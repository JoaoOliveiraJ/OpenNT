# Estruturas do NT geradas por `cargo xtask nt-types` a partir dos símbolos
# do ntoskrnl (o PDB de [pdb]). Cada raiz entra com o fecho transitivo dos
# tipos que ela contém por valor (structs, uniões e enums aninhados);
# ponteiros não puxam o tipo apontado, que só aparece no comentário
# `/// -> ...`. Depois de mudar este arquivo, rode `cargo xtask nt-types`;
# `cargo xtask nt-types --check` falha se os arquivos gerados estiverem
# desatualizados.
#
# Uma estrutura que os símbolos não têm fica à mão num `extra_*.rs` (ou em
# `wdk.rs`), no mesmo estilo, citando o cabeçalho público de origem.

raizes = [
  # nt_abi.rs
  "_DRIVER_OBJECT", "_DRIVER_EXTENSION", "_DEVICE_OBJECT", "_DEVOBJ_EXTENSION", "_VPB", "_IRP",
  "_IO_STACK_LOCATION", "_FILE_OBJECT", "_IO_STATUS_BLOCK", "_POWER_STATE_TYPE",
