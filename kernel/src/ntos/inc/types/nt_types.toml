# O PDB do ntoskrnl.exe 10.0.19041 que os tipos seguem (GUID e idade do RSDS
# do PE). Ausente em `arquivo`, é baixado do servidor público de símbolos.
[pdb]
arquivo = "build/symbols/ntkrnlmp.pdb"
nome = "ntkrnlmp.pdb"
guid = "F57E740B088E5056E8AF0772F1CC5BEB"
idade = 1
servidor = "https://msdl.microsoft.com/download/symbols"

# Os `.rs` do diretório que não são de família são mantidos à mão: os de
# `reexportados` entram no `mod.rs` com `pub use x::*`; os demais (os
# `extra_*.rs`) como `pub mod x`.
[saida]
diretorio = "kernel/src/ntos/inc/types"
nt_abi = "kernel/src/ntos/inc/nt_abi.rs"
reexportados = ["wdk"]

# Famílias: um arquivo por componente do NT. Um tipo vai para a família que
# o cita em `nomes` (nome sem o `_` inicial, em maiúsculas) ou, senão, para a
# primeira, na ordem abaixo, com um prefixo que case (`NOME$` exige o nome
# inteiro). Tipos anônimos ficam com a família do tipo que os contém.

[[familia]]
nome = "rtl"
doc = "Rtl: listas, strings, inteiros grandes e estruturas de runtime."
nomes = ["TIME_FIELDS", "RTLP_RANGE_LIST_ENTRY"]
prefixos = [
  "LIST_ENTRY", "SINGLE_LIST_ENTRY", "SLIST_", "UNICODE_STRING", "STRING$", "LARGE_INTEGER",
  "ULARGE_INTEGER", "GUID", "RTL_", "EXCEPTION_RECORD", "BALANCED", "LUID$", "QUAD$", "M128A",
