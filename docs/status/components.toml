fase = "8"
notas = "Alvo de carga dos binários reais. O barramento PCI interno já enumera a placa e1000 com os seus recursos; nenhum dos três drivers carrega ainda. Dos imports do ntoskrnl, faltam 2 ao ndis.sys (ExSubscribeWnfStateChange e NtQuerySystemInformationEx) e 13 ao tcpip.sys; os do netio.sys já estão todos atendidos."

