notas = "Carrega e roda com `--start-driver=beep`: DRIVER_START_COMPLETED state=4 win32=0. A chave Beep tem os valores da instalação (Type 1, ErrorControl 1, Group Base, Tag 2, DisplayName Beep, sem ImagePath), com Start 3 em vez de 1. O IOCTL_BEEP_SET passa pelo IoStartPacket, pela KDEVICE_QUEUE do dispositivo e pelo StartIo do driver, que repassa a frequência e a duração ao pedido pendente da sessão (a CSQ do driver) e chama o IoStartNextPacket no modo adiado (DOE_SIO_DEFERRED); o beep.sys do Windows 10 não toca o alto-falante do PC, quem toca é a sessão. Os KeRemoveDeviceQueue/KeRemoveEntryDeviceQueue de que ele precisava agora existem, com o resto da família KDEVICE_QUEUE."

