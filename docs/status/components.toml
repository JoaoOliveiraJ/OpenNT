notas = "Suporte de boot do próprio kernel. Quando o build traz o i8042prt.sys e o kbdclass.sys (o xtask os copia sempre que existem na máquina de build), as teclas chegam pelos drivers do Windows e este driver só faz a tradução; a leitura direta pela IRQ1 é o caminho de reserva, sem teste automático."

[[componente]]
nome = "Barramento PCI"
categoria = "Drivers internos"
