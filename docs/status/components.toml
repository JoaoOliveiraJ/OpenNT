descricao = "Descreve os dispositivos fixos do PC, como a controladora de teclado e mouse PS/2, para que os drivers os encontrem."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/motherboard.rs"]
testes = ["fase4"]
fase = "4"
notas = "Suporte de boot do próprio kernel: cria os PDOs do teclado (PNP0303) e do mouse (PNP0F13) PS/2 com as portas e as IRQs, papel que no Windows é do ACPI.sys. É sobre eles que o PnP monta a pilha do i8042prt.sys."

[[componente]]
nome = "Disco ATA (interno)"
categoria = "Drivers internos"
icone = "disk"
descricao = "Lê e grava setores dos discos do canal IDE primário (LBA28) por DMA de bus master da controladora PIIX3, com PIO como alternativa."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/storage/ata_pio.rs"]
testes = ["fase4"]
fase = "4"
notas = "Suporte de boot do próprio kernel, não um substituto do atapi.sys: é por ele que o kernel lê e grava o volume NTFS do segundo disco, de onde vêm o cng.sys, a ci.dll e os catálogos. Hoje ele atende todo acesso a disco, porque a pilha de disco do Windows (atapi.sys, disk.sys) carrega mas não recebe nenhum dispositivo. Um comando por vez no canal, sob o lock do canal (testado com leitores em outras CPUs), e prazos em tempo de relógio (10 s; 30 s para o FLUSH CACHE) em vez de um número fixo de leituras do status, que sob carga no host dava por falho um flush ainda em andamento."

[[componente]]
nome = "hal.dll"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "A biblioteca de abstração de hardware do Windows, carregada como módulo do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/phase1.rs", "kernel/src/hal/private_dispatch.rs", "kernel/src/hal/public_dispatch.rs"]
testes = ["drivers"]
fase = "6"
notas = "No Windows 10 da máquina de build, a hal.dll não tem rotinas próprias nem ponto de entrada: são 91 encaminhamentos para o ntoskrnl. O OpenNT carrega a imagem real na fase 1 do boot e liga cada encaminhamento a um export do próprio kernel, que faz o trabalho da HAL. O kernel também publica a HalPrivateDispatchTable e a HalDispatchTable; os 23 slots desta última ainda devolvem STATUS_NOT_SUPPORTED."

[[componente]]
nome = "i8042prt.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "Driver da Microsoft para a controladora de teclado e mouse PS/2."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/io/pnp.rs"]
testes = ["teclado", "drivers", "shell"]
fase = "6"
notas = "O PnP o anexa aos PDOs PS/2 da placa-mãe, com START_DEVICE e as ISRs nativas conectadas às IRQs 1 e 12; no boot comum, é por ele que o shell recebe as teclas. Sem os binários no build, o teclado usa o driver PS/2 interno."

[[componente]]
nome = "kbdclass.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
