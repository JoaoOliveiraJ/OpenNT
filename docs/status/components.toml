[[componente]]
nome = "Modo usuário"
categoria = "Programas do Windows"
icone = "user"
descricao = "Processos e threads de usuário no anel 3, separados do kernel pela proteção de página, que chamam o sistema pela instrução SYSCALL."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ps/user"]
testes = ["fase7"]
fase = "7"
notas = "Vários processos de usuário rodam ao mesmo tempo, cada um no próprio espaço de endereços (a própria tabela de páginas, criada com o processo), com a PEB e a pilha na mesma VA e conteúdos diferentes. Um despachante só alterna as threads de todos os processos vivos, como o do Windows: um processo anda com os outros sem que ninguém o espere, o escalonador do kernel também dá a vez a eles, e o timer tira da CPU quem não a cede; quem precisa do fim de um processo espera despachando todos. Um processo pode terminar outro pelo handle (NtTerminateProcess com PROCESS_TERMINATE): só o alvo perde as threads e os recursos, liberados na hora, e quem pediu segue rodando; o NtTerminateProcess sem handle termina as outras threads do próprio processo, como o primeiro passo do ExitProcess do Windows. Programas de usuário ainda rodam só no processador de boot. Um programa de usuário já cria outro processo pela chamada de sistema do Windows (NtCreateUserProcess): o kernel lê da memória de quem chama os parâmetros do processo (normalizados ou não), o pedido de criação e a lista de atributos (caminho da imagem, pai declarado, prioridade e as saídas de ids, TEB e informações da imagem), cria o processo e a primeira thread (suspensa quando pedido), devolve os handles do processo e da thread na tabela de quem chamou e o estado da criação (sucesso, ou a falha ao abrir a imagem); quem criou retoma a thread e espera o processo pelo handle, que fica sinalizado quando o processo termina. Com a flag de herança, os handles herdáveis de quem cria (ou do pai declarado) vão para o filho com o mesmo valor; o token e o processo depurado ainda não entram nesse caminho. Todo processo de usuário nasce por um caminho só (ps/create.rs), como o PspCreateProcess do Windows: o executável, a PEB, os parâmetros do processo (caminho da imagem, linha de comando pedida, diretório, ambiente, console), a TEB e o contexto inicial da primeira thread são montados dentro do processo novo, e os drivers que acompanham a carga de imagens são avisados do executável e da ntdll ainda na criação, no contexto do processo novo e com o PID dele, como no Windows. A ntdll, o apiset e as tabelas NLS são mapeados uma vez na tabela do System e cada processo recebe cópias privadas deles nas mesmas VAs, devolvidas no término; nenhuma página gravável de usuário é dividida entre processos. Cada EPROCESS, o System inclusive, já tem um registro de estado próprio (process_state.rs), criado com o processo e destruído no término. A tabela de handles já é desse registro: um handle só vale no processo que o abriu (ou no processo anexado), o mesmo objeto aberto em dois processos tem um handle e um acesso em cada um, e o término do processo fecha os handles dele. Handles atravessam processos como no Windows: o NtDuplicateObject copia um handle de um processo para outro (com o mesmo acesso ou um menor, nunca maior, e com OBJ_INHERIT se pedido; DUPLICATE_CLOSE_SOURCE fecha a origem no processo dono); um processo criado com herança recebe os handles inherit do pai com os mesmos valores; o NtOpenProcess e o NtOpenThread abrem processos e threads de qualquer processo por CLIENT_ID, com a checagem de acesso pela DACL (ou pelo SeDebugPrivilege); e a ProcessBasicInformation e a ThreadBasicInformation de outro processo trazem a PEB, a TEB, os ids e o processo pai dele. Um evento duplicado para um filho é sinalizado por ele e acorda o pai que espera nele. As regiões de memória também: alocações, vistas de seção e imagens ficam no VAD de quem as criou, a consulta, a liberação e a troca de proteção de um processo não enxergam as de outro sem um handle dele, e o término devolve só as regiões do processo que saiu. Com o handle, um processo mexe na memória de outro como no Windows: aloca, libera, reprotege, consulta, lê e grava (NtReadVirtualMemory/NtWriteVirtualMemory e o MmCopyVirtualMemory dos drivers) e mapeia ou desfaz vistas de seção nele, com os direitos que o handle precisa ter (PROCESS_VM_OPERATION, PROCESS_VM_READ, PROCESS_VM_WRITE, PROCESS_QUERY_INFORMATION; sem eles, acesso negado); uma cópia que encontra uma página inacessível para nela e informa exatamente quantos bytes passou; a escolha de endereço olha só o espaço do processo e as faixas de sistema que todos veem na mesma VA. A identidade também: PID, PEB e cookie vêm do EPROCESS corrente, o caminho da imagem e a PEB_LDR_DATA do estado do processo, e PIDs e TIDs saem de uma tabela de ids de cliente só (cid.rs), sem colisão entre processos e threads; a thread principal tem TID próprio. O registro do serviço em curso (argumentos brutos e pilha sondada) é de cada thread. As threads de usuário e os módulos do loader do kernel também são do processo, e o término de um processo devolve tudo o que é dele (threads, E/S pendente, fábricas de workers, mutantes, módulos, handles e regiões), inclusive quando ele falha logo depois de criado; nada é reiniciado entre um processo e o próximo, então um processo vivo não perde nada quando outro nasce, roda e termina, e o mesmo programa executado três vezes seguidas não deixa variação de memória física nem da arena a partir da segunda vez. O kernel só toca a memória de usuário do processo corrente (ou do anexado): um modo estrito, ligado em todo boot, para o sistema se uma sonda alcançar a memória de outro processo, e as cópias de conclusão de E/S e o post-mortem anexam ao processo dono, como o KeStackAttachProcess do Windows. O espaço de usuário começa em 64 KB, como no Windows: o executável carrega na sua ImageBase quando ela está livre (e é desfeito quando o processo termina), e a pilha, a PEB, a TEB e as demais estruturas recebem a VA que o alocador escolhe, sem janelas fixas; o teste da fase 7 confere memória de usuário abaixo de 4 GB lida e escrita pelo anel 3. O único executável que roda hoje é o PE mínimo gerado pelo teste da fase 7, com a ntdll de bring-up. Inclui csr.rs, uma imitação dentro do kernel do lado servidor do csrss.exe (ApiPort e SharedSection da sessão 0, ativas em todo boot), mantida só até o csrss.exe real rodar. APCs de usuário (NtQueueApcThread/Ex/Ex2 e NtTestAlert) são entregues no retorno ao modo usuário pelo frame do KiUserApcDispatcher, e NtContinueEx, NtGet/SetContextThread, NtOpenProcess, NtOpenThread e NtGetNextProcess/Thread já têm handler. A PEB sai com o CriticalSectionTimeout do Windows (30 dias, do Session Manager): a ntdll espera sem prazo numa seção crítica disputada. Antes o prazo era 0, e a espera voltava na hora com STATUS_TIMEOUT e um aviso no DbgPrint. Para os serviços do início automático do services.exe (o mapa em docs/mapa-cadeia.md), NtCompareObjects, NtCompareTokens, NtSetUuidSeed e NtIsSystemResumeAutomatic têm handler com a semântica do 19041 (autoteste test/user_service_chain.rs)."

[[componente]]
nome = "ntdll.dll, KERNEL32 e KERNELBASE"
categoria = "Programas do Windows"
icone = "layers"
descricao = "As bibliotecas de sistema reais do Windows, pelas quais os programas falam com o kernel."
estado = "planejado"
fase = "7"
notas = "Com --initial-process=smss, o smss.exe real já roda com a ntdll.dll real (LdrInitializeThunk, thread pool, ALPC e o carregador), e o csrss.exe carrega e inicializa o kernelbase.dll e o kernel32.dll reais, puxados pelo user32.dll que o winsrvext.dll importa. No boot comum, nenhum processo carrega as DLLs reais ainda. A ntdll.dll real vai para o volume só porque o vgk.sys a abre pelo caminho; o kernel procura a ntdll na raiz do volume (D:\\NTDLL.DLL), onde o build não a põe, e no boot comum registra “ntdll.dll ausente”. Os testes do modo usuário usam uma ntdll de bring-up que o build gera, só com os stubs das chamadas de sistema."

[[componente]]
nome = "Executáveis .exe (comando exec)"
categoria = "Programas do Windows"
icone = "window"
descricao = "Programas do Windows carregados pelo shell e executados em modo usuário."
estado = "planejado"
fase = "7"
notas = "O comando exec do shell ainda responde “ainda nao implementado”. A parte do kernel da criação de processos (PEB, TEB, seções, ntdll mapeada e entrada pelo LdrInitializeThunk) existe em Modo usuário, mas nenhum .exe real do Windows roda ainda: falta a ntdll real e o resto do modo usuário."

[[componente]]
nome = "csrss.exe"
categoria = "Programas do Windows"
icone = "message"
descricao = "O processo do subsistema Windows (Client/Server Runtime), que os programas Win32 contatam ao iniciar."
estado = "em desenvolvimento"
fase = "7"
notas = "Com --initial-process=smss, o smss.exe real roda como primeiro processo e cria o smss da sessão, que cria o csrss.exe real; o teste smss-csrss confere o csrss até o primeiro serviço do win32k. O csrss cria o diretório da sessão, o \\Windows\\ApiPort e a seção compartilhada e carrega os servidores reais: o basesrv.dll (hora do sistema, \\BaseNamedObjects, links da sessão e o mapeamento de arquivos .ini do Registro), o winsrv.dll e o winsrvext.dll, que importa o user32.dll real. A inicialização do user32 dentro do csrss, com o kernelbase, o kernel32, o gdi32 e o gdi32full reais, chega ao NtGdiInit, o primeiro serviço do win32k.sys, e o marcador sai ali; o win32k.sys real, carregado antes pelo smss da sessão (o Kmode do SubSystems), atende o serviço. A thread do csrss vira thread GUI pelos callouts do win32k e o NtGdiInit volta TRUE; o user32 inicializa, mas o cfgmgr32.dll (importado pelo winsrvext) recusa a carga sem o \\Device\\DeviceApi\\CMApi do PnP do ntoskrnl, e o winsrv volta STATUS_NOT_IMPLEMENTED antes do NtUserInitialize, com o que o csrss sai. Com o \\Device\\DeviceApi\\CMApi do PnP, o NtNotifyChangeKey e o NtQueryLicenseValue de modo usuário, o cfgmgr32 carrega, o winsrvext inicializa e chama o NtUserInitialize (o marcador USER_INITIALIZED sai quando ele volta com sucesso, pelo número do stub do win32u.dll do csrss). Sem adaptador de vídeo, a sessão do dxgkrnl espera o primeiro adaptador; com --display=basic o adaptador inicia e o NtUserInitialize volta com sucesso (teste win32k-display, USER_INITIALIZED): a sessão 0 usa o dispositivo de exibição desconectado (Services\\TSDDD\\Device0). Em seguida o winsrv sobe as threads dele (ThreadBasePriority 2), o csrss assina os nomes WNF da instalação e o sxssrv.dll lê a chave SideBySide; o CsrSbApiPortInitialize então cria a \\Windows\\SbApiPort pelo NtCreatePort (as portas LPC de modo usuário, sobre o ALPC), o smss mestre se conecta a ela e o SbCreateSession do wininit.exe é atendido (a ProcessExceptionPort, ThreadTimes e ThreadIsTerminated); o csrss aceita a conexão LPC da ntdll do wininit na \\Windows\\ApiPort com a vista e responde ao pedido síncrono que o NtUserCreateWindowStation do win32k manda direto à porta de conexão.exe (já no volume, com o services.exe e o lsass.exe). O smss pede o NtInitializeRegistry, o NtApphelpCacheControl e as classes ProcessDefaultHardErrorMode, ProcessHandleCheckingMode, ThreadBreakOnTermination, SystemFlagsInformation, SystemPhysicalMemoryInformation e SystemHypervisorSharedPageInformation, e o csrss o NtIsUILanguageComitted, todos atendidos como no ntoskrnl; ainda sem provedor ficam o NtAccessCheck e o NtGetMUIRegistryInfo do csrss (o aviso `sem provedor` da serial), e ainda respondem errado a ProcessBasePriority e a ProcessMitigationPolicy, as SystemPlatformBinaryInformation, SystemFlushInformation e SystemWriteConstraintInformation e o MEM_RELEASE de parte de uma região. No boot comum, o kernel mantém uma imitação provisória do lado servidor do csrss (ps/user/csr.rs), descrita em Modo usuário, desligada no boot com o smss."

