[[componente]]
nome = "ndis.sys, tcpip.sys e E1G6032E.sys"
categoria = "Drivers do Windows"
icone = "plug"
descricao = "A pilha de rede do Windows (NDIS e TCP/IP) com o miniport Intel PRO/1000 da Microsoft, que atende a placa e1000 emulada pelo QEMU (PCI 8086:100E)."
estado = "em desenvolvimento"
testes = ["ndis", "afd", "tcpip"]
fase = "8"
notas = "O ndis.sys e o afd.sys reais carregam e o DriverEntry deles tem sucesso (testes ndis e afd), iniciados na ordem dos grupos de boot do Windows (NDIS, depois AFD; `--start-driver` aceita a lista). O netio.sys, que não tem serviço, entra como DLL dependente do ndis.sys: os dois importam um do outro e o carregador resolve o ciclo pela entrada já listada, como o MmLoadSystemImage; o DllInitialize dele chama o NdisDllInitialize e sobe o NMR, o NSI (com o repositório Control\\Nsi da instalação) e a WFP. No caminho o kernel passou a dar o que esses DriverEntry usam como no ntoskrnl: o RtlQueryRegistryValues do RtlpQueryRegistryValues, o descritor de segurança padrão dos dispositivos e dos DRIVER_OBJECTs (ObGetObjectSecurity e ObSetSecurityObjectByPointer sobre eles), o ServiceKeyName, o ObReferenceObjectByHandle de handles de chave, os eventos de memória de \\KernelObjects, o FullDllName de \\SystemRoot que o NMR confere, os encaminhamentos de export sem extensão, o NtCreateFile e o HalTranslateBusAddress. O tcpip.sys carrega (com o fltmgr.sys, que ele importa) e o DriverEntry dele passa pelo NSI e pela WFP: o ZwQueryInformationToken com TokenAccessInformation (classe 22) devolve o bloco do SepCopyTokenAccessInformation (os hashes de SIDs, os atributos de segurança no formato interno do token e os privilégios), que o SeTokenFromAccessInformation e o SeQuerySecurityAttributesTokenAccessInformation consomem, e o SeQueryInformationToken responde a TokenSessionId e a TokenIsAppContainer que o tcpip e o ndis pedem. O tcpip lê o IRQL direto no registrador (mov rax, cr8) entre o KfRaiseIrql e o KeLowerIrql, e o IRQL do kernel é o próprio CR8, como no Windows x64: o DriverEntry do tcpip termina com sucesso (state=4, teste tcpip). Com o NDIS e o AFD iniciados, a pilha PS/2 e o teclado seguem normais (as threads de sistema dos drivers de rede esperam fora da lista de prontas). O NtQuerySystemInformationEx de modo kernel responde a distância entre nós NUMA que o ndis.sys pergunta, e o PsChargeProcessPoolQuota/PsReturnPoolQuota cobram a cota de pool do processo para o afd.sys. O kernel já registra o host de extensão do controle de taxa de rede que o tcpip.sys usa (id 4). Sem miniport: a placa e1000 do QEMU (PCI 8086:100E) ainda não tem o E1G6032E.sys ligado pelo PnP."

