# Dados editados à mão para `cargo xtask status` (páginas em docs/site/ e
# docs/ROADMAP.md).
#
# O gerador confere o que dá para conferir: os caminhos citados precisam
# existir no repositório, e o marcador de cada teste precisa aparecer nas
# fontes Rust. O que não confere sai como aviso na geração e no fim da página
# de componentes.
#
# Estado declarado de cada componente:
#   "implementado"        vira "Funciona" se algum teste listado em `testes`
#                         tiver o marcador presente nas fontes; sem teste,
#                         aparece como "Parcial", com o aviso de que falta teste
#   "em desenvolvimento"  uma parte já existe; aparece como "Parcial"
#   "planejado"           previsto numa fase do roadmap
#   "fora"                fora do escopo atual
# `fase` é o número da fase em [[fase]] (texto livre também vale).
# `icone`: cpu, memory, cube, threads, io, sliders, book, shield, database,
# power, folder, chip, terminal, plug, window, check, message, chart, rocket,
# atom, keyboard, monitor, disk, bus, lock, list, layers, clock, mouse, play,
# user.

[fontes]
# Pastas varridas para achar o arquivo Rust de cada módulo planejado (mesma
# pasta-pai e mesmo nome). Atualize junto com a reorganização de
# docs/ARQUITETURA.md.
rust = ["kernel/src"]
# Pastas das suítes de autoteste do kernel.
testes = ["kernel/src/ntos/test"]

[icones_categoria]
"Núcleo do kernel" = "cpu"
"Drivers internos" = "plug"
"Drivers do Windows" = "window"
"Sistemas de arquivos" = "folder"
"Aplicações do kernel" = "terminal"
"Programas do Windows" = "layers"

# Frase que abre cada categoria na página de componentes.
[descricoes_categoria]
"Núcleo do kernel" = "As partes centrais do kernel, escritas em Rust: boot, interrupções, memória, processos, sincronização, objetos, segurança, I/O, Registro e o carregador de drivers."
"Drivers internos" = "Drivers escritos em Rust que fazem parte do próprio OpenNT: vídeo, console, teclado, barramento, disco e segurança."
"Drivers do Windows" = "Drivers do Windows (.sys e .dll) carregados como estão, sem recompilar nem modificar. Os binários vêm da máquina de build, copiados pelo xtask, e nunca entram no repositório. Aqui, Funciona quer dizer que o binário do próprio Windows carrega e roda durante um teste automático de boot."
"Sistemas de arquivos" = "Os sistemas de arquivos que o kernel monta e lê."
"Aplicações do kernel" = "Programas que rodam dentro do próprio kernel: o shell e os programas de exemplo."
"Programas do Windows" = "Programas do Windows (.exe) rodando em modo usuário, com as bibliotecas de sistema do próprio Windows."

# ---- fases do roadmap -------------------------------------------------------------

[[fase]]
numero = "1"
nome = "base"
estado = "concluída"
escopo = "Boot pela BIOS até o modo de 64 bits, HAL, nanokernel (interrupções, canais de mensagens, serviços), relógio, escalonador cooperativo, sistema de arquivos em memória, vídeo, console, teclado, shell e a ferramenta de build e testes (cargo xtask)."

[[fase]]
numero = "2"
nome = "memória e CPU"
estado = "concluída"
escopo = "Banco de páginas físicas, mapeamento recursivo, pool do kernel, variáveis exportadas, imagens carregadas, KUSER_SHARED_DATA, KPCR, IRQL, DPCs, multiprocessador, ACPI, estruturas do NT e acesso à memória de convidado."

[[fase]]
numero = "3"
nome = "objetos e executive"
estado = "concluída"
escopo = "Object Manager (tipos, handles, namespace, callbacks), biblioteca de runtime, Executive (locks, rundown, listas lookaside, callbacks), segurança (SIDs, ACLs, descritores, tokens) e processos e threads com as estruturas reais do NT."

[[fase]]
numero = "4"
nome = "I/O e armazenamento"
estado = "concluída"
escopo = "I/O Manager, ACPI e PCI, gerência de energia, ETW, drivers de barramento, disco ATA e NTFS."

[[fase]]
numero = "5"
nome = "Registro e serviços"
estado = "concluída"
escopo = "Configuration Manager (hives, chaves e valores) e o controle de serviços e drivers (sc)."

[[fase]]
numero = "6"
nome = "loader PE e ntoskrnl"
estado = "em andamento"
escopo = "Carregador de PE, funções exportadas pelo kernel, carga dos drivers reais do Windows (i8042prt, kbdclass, cng.sys) e KsecDD."

[[fase]]
numero = "7"
nome = "modo usuário"
estado = "em andamento"
escopo = "Processos e threads de usuário, comunicação ALPC, chamadas de sistema e as bibliotecas ntdll e KERNEL32 reais."

# ---- testes automáticos de boot -------------------------------------------------

[[teste]]
id = "entrada"
titulo = "Entrada no kernel"
marcador = "HELLO_KERNEL_OK"
comando = "cargo xtask test-boot HELLO_KERNEL_OK"
descricao = "O carregador de boot levou a máquina ao modo de 64 bits, entregou o controle ao kernel e a saída serial funciona."

[[teste]]
id = "boot"
titulo = "Boot completo"
marcador = "KERNEL_RS_OK"
comando = "cargo xtask test-boot"
descricao = "As fases 0 e 1 do boot terminaram: relógio, interrupções, memória, processadores, pool, processos e namespace prontos."

[[teste]]
id = "selftest"
titulo = "Autoteste do kernel"
marcador = "SELFTEST_OK"
comando = "cargo xtask test-boot SELFTEST_OK 60000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Roda dentro do kernel todas as suítes de autoteste: arquivos em memória, programas de exemplo, memória, escalonador, timer, IPC e serviços; depois as suítes das fases 3 a 7 (objetos e executive, I/O e armazenamento, Registro e serviços, carregador de PE, modo usuário) e o teclado real. O marcador só aparece se todas passarem."

[[teste]]
id = "fase3"
titulo = "Autoteste de objetos e executive"
marcador = "PHASE3_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE3_SELFTEST_OK 60000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Dispatcher, APCs, timers e alertas; push locks e rundown; tabelas de handles, namespace e callbacks de objetos; processos e segurança."

[[teste]]
id = "fase4"
titulo = "Autoteste de I/O e armazenamento"
marcador = "PHASE4_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE4_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "No hardware emulado do QEMU: configuração e barramento PCI, dispositivos da placa-mãe, disco ATA, leitura e escrita de NTFS, I/O Manager (IRPs, dispositivos e arquivos), energia e ETW."

[[teste]]
id = "fase5"
titulo = "Autoteste de Registro e serviços"
marcador = "PHASE5_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE5_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Hive em memória, chaves e valores, callbacks do Registro, banco de serviços, WNF, licenciamento e capacidades."

[[teste]]
id = "fase6"
titulo = "Autoteste do carregador de PE e do ntoskrnl"
marcador = "PHASE6_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE6_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Formato PE, carga de imagens do kernel, os exports do ntoskrnl grupo por grupo (Ke, Mm, Ex, Io, Ob, Rtl, Zw...), ciclo de vida de drivers e tratamento de exceções."

[[teste]]
id = "fase7"
titulo = "Autoteste do modo usuário"
marcador = "PHASE7_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE7_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Seções e memória virtual de usuário, arquivos, eventos e threads, chamadas de sistema, entrada no anel 3, ALPC, controle de serviços (sc) e um processo do Windows em modo usuário."

[[teste]]
id = "teclado"
titulo = "Teclado real"
marcador = "KBDTEST_OK"
comando = "cargo xtask test-boot SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Monta pelo PnP as pilhas do i8042prt.sys com kbdclass.sys e mouclass.sys, injeta um scancode pelo controlador 8042 e lê a tecla em \\Device\\KeyboardClass0 (IRQ1, ISR do driver, DPC e callback do kbdclass)."

[[teste]]
id = "shell"
titulo = "Teste do shell"
marcador = "[shell] pronto"
comando = "cargo xtask test-boot KERNEL_RS_OK 120000 \"--keys=run hello\\nps\\n\" \"--expect== 42\" \"--expect=PID  STATE\""
descricao = "Espera o shell, digita comandos pelo monitor do QEMU (run hello, ps) e confere a saída: teclado, IPC, shell e console."

[[teste]]
id = "watchdog"
titulo = "Driver watchdog.sys real"
marcador = "DRIVER_START_COMPLETED"
comando = "cargo xtask test-boot DRIVER_START_COMPLETED 300000 --start-driver=watchdog --build-dir=build/watchdog --smp=1 \"--expect=name=watchdog state=4 win32=0\""
descricao = "O gerenciador de serviços inicia o watchdog.sys da Microsoft: o Code Integrity valida a imagem pelo catálogo, o loader resolve os imports no ntoskrnl e o DriverEntry retorna sucesso, com o serviço em execução (state=4)."

# ---- componentes e drivers ------------------------------------------------------

[[componente]]
nome = "Boot em 64 bits"
categoria = "Núcleo do kernel"
icone = "rocket"
descricao = "Leva a máquina do modo real da BIOS ao modo de 64 bits, carrega o kernel em 1 MB e entrega o controle a ele."
estado = "implementado"
caminhos = ["boot/src/boot.s", "boot/src/stage2.s", "kernel/src/main.rs"]
testes = ["entrada", "boot"]
fase = "1"

[[componente]]
nome = "Interrupções e timer"
categoria = "Núcleo do kernel"
icone = "atom"
descricao = "Monta a tabela de interrupções, programa o timer do processador a 100 Hz e despacha as interrupções de hardware."
estado = "implementado"
caminhos = ["kernel/src/nano/interrupts.rs", "kernel/src/hal/amd64/irqstubs.rs", "kernel/src/hal/lapic.rs"]
testes = ["boot", "selftest"]
fase = "1"

[[componente]]
nome = "Gerência de memória"
categoria = "Núcleo do kernel"
icone = "memory"
descricao = "Controla as páginas de memória física, as tabelas de páginas e o pool de memória do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/pfn.rs", "kernel/src/ntos/mm/paging.rs", "kernel/src/ntos/mm/kernel_pool.rs", "kernel/src/ntos/mm/guest_memory.rs"]
testes = ["selftest"]
fase = "2"
notas = "A memória que os drivers enxergam é acessada como no NT: uma instrução por acesso, direto pelo endereço virtual, respeitando páginas somente leitura e cópia na escrita; a falta de página do anel 0 passa pelo Mm antes do bugcheck, e as PTEs são gravadas numa única escrita de 64 bits. Ponteiros vindos do modo usuário são sondados antes (o papel do __try/ProbeForRead) e devolvem STATUS_ACCESS_VIOLATION."

[[componente]]
nome = "Multiprocessador (SMP)"
categoria = "Núcleo do kernel"
icone = "cpu"
descricao = "Acorda os outros núcleos do processador para que o kernel use mais de uma CPU."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/smp.rs", "kernel/src/hal/amd64/aptrampoline.rs"]
testes = ["selftest"]
fase = "2"
notas = "Verificado com 4 CPUs no QEMU."

[[componente]]
nome = "Processos e threads"
categoria = "Núcleo do kernel"
icone = "threads"
descricao = "Alterna a CPU entre os processos do kernel e mantém as estruturas de processo e thread do NT (EPROCESS e KTHREAD)."
estado = "implementado"
caminhos = ["kernel/src/ntos/ps/scheduler.rs", "kernel/src/ntos/ps/process.rs"]
testes = ["selftest", "fase3"]
fase = "3"
notas = "O escalonador cooperativo veio na fase 1; as estruturas reais de processo e thread, na fase 3."

[[componente]]
nome = "Sincronização e despacho"
categoria = "Núcleo do kernel"
icone = "clock"
descricao = "Os objetos de espera do NT (eventos, timers, APCs e DPCs), que drivers e o kernel usam para esperar e sinalizar."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/dispatcher.rs", "kernel/src/ntos/ke/apc.rs", "kernel/src/ntos/ke/timer.rs", "kernel/src/ntos/ke/dpc.rs"]
testes = ["fase3", "selftest"]
fase = "3"
notas = "Interlocked*, spin locks, push locks, rundown e contagens de referência usam instruções atômicas de verdade (lock cmpxchg/xadd), como no NT, seguras com várias CPUs."

[[componente]]
nome = "Gerenciador de objetos e namespace"
categoria = "Núcleo do kernel"
icone = "cube"
descricao = "Dá nome e contagem de referências aos objetos do kernel e monta a árvore \\Device, \\Driver, \\GLOBAL?? e os links de unidade como C:."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ob/object_manager.rs", "kernel/src/ntos/ob/handle_table.rs", "kernel/src/ntos/init/phase0.rs"]
testes = ["fase3"]
fase = "3"
notas = "Os eventos \\KernelObjects\\* e parte dos tipos de objeto ainda faltam."

[[componente]]
nome = "Segurança e tokens"
categoria = "Núcleo do kernel"
icone = "shield"
descricao = "Tokens de acesso e descritores de segurança, usados para decidir quem pode abrir cada objeto."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/token/tokens.rs", "kernel/src/ntos/se/object_security.rs"]
testes = ["fase3"]
fase = "3"

[[componente]]
nome = "I/O Manager"
categoria = "Núcleo do kernel"
icone = "io"
descricao = "O contrato entre o kernel e os drivers: dispositivos, pedidos de I/O (IRPs), pilhas de drivers e Plug and Play."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/io/io_manager.rs", "kernel/src/ntos/io/irp_builder.rs", "kernel/src/ntos/io/pnp.rs", "kernel/src/ntos/io/work_items.rs"]
testes = ["fase4", "teclado"]
fase = "4"
notas = "A pilha de teclado do Windows (i8042prt.sys e kbdclass.sys) já roda sobre ele. Inclui filas de IRP canceláveis (IoCsq*), IRPs síncronos e assíncronos de FSD, IoCreateDriver, interfaces de dispositivo, eventos nomeados de I/O e as consultas WMI (sem WMI, com o status do Windows)."

[[componente]]
nome = "Registro"
categoria = "Núcleo do kernel"
icone = "database"
descricao = "O banco de configuração do sistema (hives, chaves e valores), de onde vêm, entre outras coisas, os serviços e drivers a carregar."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/registry.rs", "kernel/src/ntos/cm/key"]
testes = ["fase5"]
fase = "5"
notas = "Hive em memória com chaves, valores, callbacks e o banco de serviços."

[[componente]]
nome = "Carregador de PE e exports do kernel"
categoria = "Núcleo do kernel"
icone = "list"
descricao = "Carrega drivers .sys e bibliotecas no formato PE do Windows e liga cada import a uma função exportada pelo kernel."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/mm/pe_loader.rs", "kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/exports.rs"]
testes = ["fase6", "boot"]
fase = "6"
notas = "Os drivers da categoria Drivers do Windows já carregam por ele; dos exports do ntoskrnl, parte ainda falta (veja a página Exports do ntoskrnl). MmLoadSystemImage carrega imagens de sistema sob demanda (o caminho do win32k.sys real). A lógica de cada export mora no arquivo do assunto do componente e o exports.rs só adapta, como no NT."

[[componente]]
nome = "Vídeo VGA em modo texto"
categoria = "Drivers internos"
icone = "monitor"
descricao = "Escreve texto na tela de 80x25 caracteres e move o cursor."
estado = "implementado"
caminhos = ["kernel/src/drivers/video/vga.rs"]
testes = ["boot"]
fase = "1"
notas = "Os testes conferem o texto pela serial; a imagem na tela não é conferida."

[[componente]]
nome = "Console"
categoria = "Drivers internos"
icone = "terminal"
descricao = "Junta a tela e a saída serial num só lugar para as mensagens do kernel e do shell."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/console/mod.rs"]
testes = ["boot", "shell"]
fase = "4"
notas = "Tela e espelho serial funcionam desde a fase 1; o registro como dispositivo do I/O Manager (\\Device\\Console) entra na fase 4."

[[componente]]
nome = "Teclado PS/2"
categoria = "Drivers internos"
icone = "keyboard"
descricao = "Lê as teclas da controladora PS/2 a cada interrupção e as envia ao shell como caracteres."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard.rs"]
testes = ["shell"]
fase = "1"

[[componente]]
nome = "Barramento PCI"
categoria = "Drivers internos"
icone = "bus"
descricao = "Percorre o barramento PCI e descobre os dispositivos e os recursos de cada um (portas, memória, interrupções)."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/pci.rs", "kernel/src/hal/pci_config.rs"]
testes = ["fase4"]
fase = "4"

[[componente]]
nome = "Dispositivos da placa-mãe"
categoria = "Drivers internos"
icone = "chip"
descricao = "Descreve os dispositivos fixos do PC, como a controladora de teclado e mouse PS/2, para que os drivers os encontrem."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/motherboard.rs"]
testes = ["fase4"]
fase = "4"

[[componente]]
nome = "Disco ATA (PIO)"
categoria = "Drivers internos"
icone = "disk"
descricao = "Lê e grava setores do disco IDE diretamente pelas portas da controladora."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/storage/ata_pio.rs"]
testes = ["fase4"]
fase = "4"

[[componente]]
nome = "KsecDD"
categoria = "Drivers internos"
icone = "lock"
descricao = "Dispositivo de segurança do kernel: números aleatórios do hardware e avisos de mudança na configuração de criptografia."
estado = "planejado"
fase = "6"

[[componente]]
nome = "hal.dll"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "A biblioteca de abstração de hardware do Windows, carregada como módulo do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/phase1.rs"]
testes = ["boot", "selftest"]
fase = "6"

[[componente]]
nome = "i8042prt.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "Driver da Microsoft para a controladora de teclado e mouse PS/2."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/io/pnp.rs"]
testes = ["teclado", "shell"]
fase = "6"
notas = "Sem ele, o teclado usa o driver PS/2 interno."

[[componente]]
nome = "kbdclass.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "Driver de classe de teclado: entrega as teclas pelo dispositivo \\Device\\KeyboardClass0."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/init/main.rs"]
testes = ["teclado", "shell"]
fase = "6"

[[componente]]
nome = "mouclass.sys"
categoria = "Drivers do Windows"
icone = "mouse"
descricao = "Driver de classe de mouse."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/cm/hw_description.rs"]
testes = ["teclado"]
fase = "6"
notas = "A pilha inicia; nenhum programa consome o mouse ainda."

[[componente]]
nome = "atapi.sys e ataport.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Drivers da Microsoft para controladoras de disco IDE/ATA."
estado = "implementado"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/mm/sysload.rs"]
testes = ["boot", "selftest"]
fase = "6"
notas = "Carregam no boot como serviços; os discos seguem lidos pelo driver ATA interno."

[[componente]]
nome = "disk.sys e classpnp.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Driver de classe de disco: apresenta cada disco e cada partição ao resto do sistema."
estado = "implementado"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/mm/sysload.rs"]
testes = ["boot", "selftest"]
fase = "6"

[[componente]]
nome = "mountmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Mount Manager: dá nomes aos volumes e atribui as letras de unidade."
estado = "implementado"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs"]
testes = ["boot", "selftest"]
fase = "6"

[[componente]]
nome = "cng.sys"
categoria = "Drivers do Windows"
icone = "lock"
descricao = "A criptografia do kernel do Windows (Cryptography Next Generation), usada por outros drivers e pelos programas."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/phase1.rs"]
testes = ["boot", "selftest"]
fase = "6"
notas = "Carrega do volume NTFS e publica \\Device\\CNG."

[[componente]]
nome = "Drivers de teste do WDK"
categoria = "Drivers do Windows"
icone = "check"
descricao = "Drivers pequenos, compilados com o kit de drivers da Microsoft, que exercitam APIs do kernel nas suítes de teste."
estado = "planejado"
fase = "6"

[[componente]]
nome = "vgk.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver anti-cheat de terceiros (Vanguard), usado como alvo de compatibilidade."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/init/main.rs"]
notas = "Testado em WHPX com `--start-driver=vgk --trace-driver-api` (versão 1.19.2). A ci.dll original inicializa e valida a imagem; o DriverEntry resolve 252 funções do ntoskrnl pela própria busca na tabela de exports, todas atendidas pelo OpenNT. Ele então para numa verificação de integridade interna do anticheat (código ofuscado que inspeciona o próprio kernel, sem chamar API), fora do escopo do projeto. O `--trace-driver-api` mostra o log do vgk em texto (`texto:`) e cada nome procurado (`procura:`). O binário nunca entra no repositório: o build o lê de OPENNT_VGK_SYS ou de vgk.sys na raiz."

[[componente]]
nome = "watchdog.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver inbox da Microsoft (watchdog timer), base do stack de vídeo."
estado = "implementado"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/io/file/zw.rs"]
testes = ["watchdog"]
fase = "6"
notas = "Driver inbox real da Microsoft que carrega e roda limpo no OpenNT via `--start-driver=watchdog`: DRIVER_START_COMPLETED state=4 win32=0 ntstatus=0x0. Diferente do vgk (assinado embutido), ele é assinado por catálogo — o Code Integrity valida o hash da imagem contra o `.cat` da Microsoft que a própria ci.dll enumera em `CatRoot`. O DriverEntry executa e retorna sucesso. Esse mesmo caminho (catálogo + enumeração de diretório aninhado) destrava os demais drivers inbox, como o BasicDisplay e o dxgkrnl."

