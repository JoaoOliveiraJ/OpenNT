descricao = "O driver de segurança do kernel do Windows (\\Device\\KsecDD), usado por outros drivers e pelos serviços de segurança."
estado = "planejado"
fase = "6"
notas = "Alvo de carga do binário real. Ele importa funções do msrpc.sys, que o OpenNT já carrega para a ci.dll; o ksecdd.sys em si ainda não é carregado."

[[componente]]
nome = "win32k.sys, win32kbase.sys e win32kfull.sys"
categoria = "Drivers do Windows"
icone = "window"
descricao = "O subsistema de janelas e gráficos do Windows no kernel (USER e GDI), carregado como imagem de sistema."
estado = "planejado"
fase = "8"
notas = "Alvo de carga dos binários reais, com o kernel dando só o suporte (MmLoadSystemImage, tabela de serviços e callouts de processo e thread). A imitação desse papel que existia dentro do kernel foi removida; nenhum dos três carrega ainda. Sem eles, a tabela 1 do KeServiceDescriptorTableShadow fica vazia, como no Windows: uma syscall gráfica tenta converter a thread em GUI pelo PsConvertToGuiThread, que falha sem os callouts, e devolve STATUS_INVALID_SYSTEM_SERVICE. A KeAddSystemServiceTable, a PsEstablishWin32Callouts/PsInvokeWin32Callout e a conversão da W32pServiceTable na carga pela classe 38 do ZwSetSystemInformation já existem, testadas sem o win32k: o PsConvertToGuiThread invoca de fato os callouts de processo e de thread. Dos imports do ntoskrnl, ainda faltam 65 ao win32kbase.sys, 58 ao win32kfull.sys e um (ZwQueryInformationJobObject) ao win32k.sys."

[[componente]]
