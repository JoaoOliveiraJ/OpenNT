icone = "terminal"
descricao = "Tela e espelho serial."
fase = "1 e 4"

[[subsistema]]
pasta = "drivers/input"
nome = "Drivers de entrada"
icone = "keyboard"
descricao = "Teclado PS/2 e a pilha de teclado do Windows."
fase = "1 e 6"

[[subsistema]]
pasta = "drivers/bus"
nome = "Drivers de barramento"
icone = "bus"
descricao = "PCI e dispositivos da placa-mãe."
fase = "4"

[[subsistema]]
pasta = "drivers/storage"
nome = "Drivers de armazenamento"
icone = "disk"
descricao = "Disco ATA do próprio kernel (DMA de bus master, com PIO como alternativa)."
fase = "4"

[[subsistema]]
pasta = "drivers/crypto"
nome = "Drivers de criptografia"
icone = "lock"
descricao = "Nenhum driver interno: a criptografia do kernel é papel do cng.sys real, que já carrega, e do ksecdd.sys real, alvo de carga."
fase = "6"

[[subsistema]]
pasta = "ntos/inc"
nome = "Cabeçalhos do NT (inc)"
icone = "book"
descricao = "As estruturas do NT geradas dos símbolos do próprio ntoskrnl pelo cargo xtask nt-types (589 tipos, a partir da lista em types/nt_types.toml, com tamanho e offsets conferidos na compilação; --check acusa arquivos desatualizados), as do WDK e as privadas que os símbolos não trazem e os NTSTATUS; acesso tipado por campo, como o C do NT."
fase = "2"

[[subsistema]]
pasta = "win32"
nome = "Diagnósticos de drivers"
icone = "chart"
descricao = "Instrumentação de diagnóstico de drivers, fora da conta: esse papel é do --trace-driver-api e dos traços do QEMU."
fase = "—"

[[subsistema]]
pasta = "ntos/exports"
nome = "Exports do kernel"
icone = "list"
descricao = "A tabela de exports do ntoskrnl; as rotinas moram no componente de cada uma (ntos/<componente>/exports.rs)."
fase = "6"

[[subsistema]]
pasta = "ntos/ke"
nome = "Kernel (Ke)"
icone = "cpu"
descricao = "Relógio, IRQL, DPCs, processadores, despacho de threads, APCs, timers."
fase = "1 a 3"

[[subsistema]]
pasta = "ntos/mm"
nome = "Memória (Mm)"
icone = "memory"
descricao = "Páginas físicas, tabelas de páginas, pool, seções e imagens carregadas."
fase = "2, 3 e 6"

[[subsistema]]
pasta = "ntos/ob"
nome = "Objetos (Ob)"
icone = "cube"
descricao = "Tipos de objeto, handles, namespace e callbacks."
fase = "3"

[[subsistema]]
pasta = "ntos/ps"
nome = "Processos e threads (Ps)"
icone = "threads"
descricao = "Processos, threads, notificações e escalonador."
fase = "1, 3 e 7"

[[subsistema]]
pasta = "ntos/ps/user"
nome = "Modo usuário (Ps)"
icone = "user"
descricao = "PEB/TEB, carregamento da ntdll e chamadas de sistema dos programas."
fase = "7"
notas = "Inclui csr.rs, uma imitação dentro do kernel do lado servidor do csrss.exe, mantida só até o csrss.exe real rodar."

[[subsistema]]
pasta = "ntos/ex"
nome = "Executive (Ex)"
icone = "sliders"
descricao = "Locks, pool, listas lookaside, callbacks e WNF."
fase = "1 e 3"

[[subsistema]]
pasta = "ntos/rtl"
nome = "Runtime library (Rtl)"
icone = "book"
descricao = "Strings, árvores, bitmaps, ordenação, imagens PE, Unicode e páginas de código, tabelas de átomos e heap."
fase = "3 e 6"

[[subsistema]]
pasta = "ntos/se"
nome = "Segurança (Se)"
icone = "shield"
descricao = "SIDs, ACLs, descritores, tokens e privilégios."
fase = "3"

[[subsistema]]
pasta = "ntos/io"
nome = "Entrada e saída (Io)"
icone = "io"
descricao = "Dispositivos, IRPs, drivers, Plug and Play e work items."
fase = "3 e 4"

[[subsistema]]
pasta = "drivers/fs"
nome = "Sistemas de arquivos"
icone = "folder"
descricao = "Arquivos em memória, volumes e NTFS."
fase = "1, 3 e 4"

[[subsistema]]
pasta = "hal"
nome = "HAL executiva"
icone = "chip"
descricao = "Tabelas ACPI, PCI e firmware; o BIOS de vídeo num emulador de x86 (x86Bios*)."
fase = "2 e 4"

[[subsistema]]
pasta = "ntos/cm"
nome = "Registro (Cm)"
icone = "database"
descricao = "Hives, chaves, valores e serviços."
fase = "2 e 5"

[[subsistema]]
pasta = "ntos/po"
nome = "Energia (Po)"
icone = "power"
descricao = "Estados de energia e registro de falhas."
fase = "4"

[[subsistema]]
pasta = "ntos/etw"
nome = "Rastreamento (Etw)"
icone = "chart"
descricao = "Event Tracing for Windows."
fase = "4"
notas = "Um registro único de provedores (entradas de GUID com os TRACE_ENABLE_INFO das sessões) para os drivers (EtwRegister, EtwWrite, EtwWriteEx, EtwWriteString, EtwEventEnabled, EtwSetInformation com traits) e para a ntdll real: o NtTraceControl registra os provedores de modo usuário como objetos EtwRegistration com handle no processo e entrega as habilitações como notificação na fila do processo; o NtTraceEvent da ntdll grava nas sessões. As sessões do StartTrace têm buffers de verdade com registros EVENT_HEADER, Flush e Stop. Ainda não há consumidores de tempo real, arquivos .etl, EnableTraceEx2 de modo usuário nem autologgers."

[[subsistema]]
pasta = "ntos/dbgk"
nome = "Depuração (Dbgk)"
icone = "chart"
descricao = "Relatórios ao vivo do Windows Error Reporting."
fase = "6"
notas = "Sem o werkernel.sys, o DbgkWerCaptureLiveKernelDump faz as validações do Windows e falha com STATUS_NOT_SUPPORTED, o status do stub da extensão ausente."

[[subsistema]]
pasta = "ntos/kd"
nome = "Depurador do kernel (Kd)"
icone = "terminal"
descricao = "O estado do depurador visto pelos drivers e o depurador do próprio OpenNT (protocolo remoto do GDB pela porta serial)."
fase = "6"
notas = "Sem --kd, KdPitchDebugger: KdEnableDebugger, KdDisableDebugger e KdChangeOption devolvem STATUS_DEBUGGER_INACTIVE, como o ntoskrnl num boot sem /DEBUG. Com --kd, o depurador do OpenNT fica ligado (teste kd)."

[[subsistema]]
pasta = "ntos/alpc"
nome = "Comunicação entre processos (Alpc)"
icone = "message"
descricao = "Portas ALPC entre processos."
fase = "7"

[[subsistema]]
pasta = "ntos/test"
nome = "Autotestes"
icone = "check"
descricao = "Suítes que rodam dentro do kernel no QEMU."
fase = "contínua"
notas = "Uma suíte planejada conta como pronta quando o arquivo de teste de mesmo nome existe, ou pela tabela [correspondencias]."

