notas = "Carrega e roda com `--start-driver=fs_rec`: DRIVER_START_COMPLETED state=4 win32=0. A chave Fs_Rec tem os valores da instalação (Type 8, SERVICE_RECOGNIZER_DRIVER, ErrorControl 0, Group File System, sem ImagePath), com Start 3 em vez de 0. O DriverEntry cria e registra os reconhecedores de disco e de CD-ROM nas filas do IoRegisterFileSystem; cada reconhecedor de disco (FAT, exFAT, ReFS, ReFSv1 e UDFS) responde a um IRP_MN_MOUNT_VOLUME sobre o volume NTFS do segundo disco com STATUS_UNRECOGNIZED_VOLUME, lendo o setor de boot e a geometria. O reconhecedor de NTFS não é criado: o DriverEntry só o cria quando ZwCreateFile(\\Ntfs) dá STATUS_OBJECT_NAME_NOT_FOUND, e no OpenNT \\NTFS é a montagem do volume lido pelo kernel, como num Windows com o ntfs.sys carregado. O dispositivo de volume do teste é servido pelo próprio teste (o segundo disco pelo driver ATA do kernel), até o volume do disco existir como DEVICE_OBJECT do kernel; o DRIVER_OBJECT fica em \\Driver\\Fs_Rec, não em \\FileSystem\\Fs_Rec como no Windows."

