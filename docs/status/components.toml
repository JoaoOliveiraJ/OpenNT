[[componente]]
nome = "Depurador do kernel"
categoria = "Núcleo do kernel"
icone = "terminal"
descricao = "Depurador do próprio OpenNT: com --kd=com2, atende pela porta serial o protocolo remoto do GDB, com consultas de objetos do NT, rastro de instruções e os processos de usuário (contexto, breakpoints por processo, eventos); clientes: o prompt cargo xtask debug, o depurador gráfico opennt-dbg e o depurador de engenharia reversa opennt-re."
estado = "implementado"
caminhos = ["kernel/src/ntos/kd/stop.rs", "kernel/src/ntos/kd/session.rs", "kernel/src/ntos/kd/inspect.rs", "kernel/src/ntos/kd/trace.rs", "kernel/src/ntos/kd/user_debug.rs", "kernel/src/ntos/kd/process_context.rs", "tools/opennt-kd/src/client.rs", "tools/opennt-kd/src/unwind.rs", "tools/opennt-kd/src/analysis/mod.rs", "tools/opennt-dbg/src/app.rs", "tools/opennt-re/src/app.rs"]
testes = ["kd", "kd-parada", "kd-usuario"]
fase = "6"
notas = "Sem --kd o boot é o de um Windows sem /DEBUG. Processos de usuário: o host escolhe um processo (.process) e lê a memória dele pela raiz dele, a lista de módulos sai da PEB.Ldr e do VAD com os PDBs públicos da ntdll e das DLLs, os breakpoints de software de usuário só param no processo dono (o int 3 de outro processo que divide o quadro de código passa sem parar), o passo usa o TF da thread, há parada na criação e saída de processo e thread e na carga de uma DLL num processo (sxe ld:csrss!basesrv.dll), exceções de primeira chance do anel 3 opcionais, handles com tipo e nome, regiões de usuário e threads com TEB e o CONTEXT salvo. O opennt-re (tools/opennt-re) é o depurador de engenharia reversa sobre o mesmo cliente: aba CPU com desmontagem e setas de desvio, registradores, Dump 1-5 e pilha; grafo de fluxo; referências a strings, constantes, chamadas entre módulos e xrefs; padrões com curingas; mapa de memória; símbolos, exports e imports; comentários, rótulos e marcadores por módulo + RVA; patches com montador; breakpoints de log, com comandos e em grupos; roteiros. Também: análise automática (colchetes das funções e dos laços, comentários das chamadas com os argumentos decodificados), referências cruzadas pelo índice do módulo, destaque de registradores, XMM, x87, YMM e DR0-DR7, a caixa dos argumentos x64, editor de breakpoints (condição de parada, log e condição de log, comandos e condição de comando, uma vez só, silencioso, retorno rápido), breakpoints de hardware de usuário por processo (DR0-DR3 no CONTEXT das threads do processo) e de memória por página (o bit reservado da PTE, monitor membp, sem mudar a proteção vista pelo processo). Extensões para as ferramentas de engenharia reversa: o fluxo de registros (pacotes O em lotes com a máquina rodando e qOpenNTStream parada), o monitor de APIs no despacho dos exports, o rastreador de IRPs no IofCallDriver, no IofCompleteRequest e no IoFreeIrp (desligados, cada gancho só lê um booleano) e os exploradores do Registro, do namespace e dos arquivos (monitor reg, objdir, fs). O opennt-mcp (tools/opennt-mcp) expõe o mesmo depurador pelo Model Context Protocol para agentes de IA, também de dentro da janela do opennt-re. Com --kd=com2 (com3, com4) o kernel atende o protocolo remoto do GDB na porta, que o QEMU expõe como socket TCP; um GDB comum também entra. Paradas: pedido do host (o 0x03 visto no tique do relógio, como o KdPollBreakIn), int 3 do código, breakpoints de software e de hardware (DR0-DR3: execução, escrita, acesso), passo a passo, exceção de kernel sem tratador, KeBugCheckEx antes da tela de STOP e pânico. Parado, os outros processadores ficam congelados por NMI; o host lê e grava registradores (com x87/SSE) e memória (pelas tabelas de páginas, sem faltas). Consultas do OpenNT: processos, threads (e a pilha de uma thread fora da CPU pelo quadro de troca), módulos, processadores com IRQL, objeto por nome, DbgPrint, bugcheck (código, nome e driver de um parâmetro) e objetos do NT pelos layouts do PDB: EPROCESS com as threads, ETHREAD com estado, motivo da espera e pilha de kernel, IRP com a pilha de E/S, DEVICE_OBJECT com a pilha de dispositivos, DRIVER_OBJECT com a tabela de despacho e a entrada de um handle. Rastro de instruções dentro do convidado: o processador da parada executa passo a passo e grava registros compactos (RIP, profundidade, registradores que mudaram) num buffer lido em lotes, até um número de instruções, um endereço, o retorno da função ou a entrada ou saída de uma faixa, com faixas puladas e um endereço vigiado. Os clientes (tools/opennt-kd) desenrolam a pilha pela .pdata dos drivers da Microsoft e pelos frame pointers do OpenNT, com os nomes dos PDBs públicos (cache build/symbols e download do servidor de símbolos), avaliam expressões com os tipos do PDB do ntoskrnl, analisam o bugcheck e têm breakpoints condicionais, com contagem, adiados e por carga de módulo. Os drivers veem o depurador como no Windows: KdDebuggerEnabled, KdDebuggerNotPresent (FALSE com um host anexado), KUSER_SHARED_DATA.KdDebuggerEnabled e KdComPortInUse, e KdDisableDebugger, KdEnableDebugger, KdChangeOption, KdRefreshDebuggerNotPresent e KdPowerTransitionEx com a lógica do ntoskrnl. Com um host anexado, o DbgPrint de um programa (o `int 0x2D` da ntdll) é tratado no kernel como no NT: o texto sai no log e no host quando o filtro do NtQueryDebugFilterState deixa, e a thread segue depois do `int3`. Antes, o serviço chegava ao processo como violação de acesso, e o csrss.exe morria quando o depurador era anexado no começo do boot. Ainda falta: os processadores secundários usam uma IDT própria de três vetores, então só o processador de boot trata int 3 e #DB; continuar depois de uma exceção fatal não é possível; o rastro do convidado segue só o processador da parada e para antes de iretq, sysret, hlt e int; nenhum GDB está instalado nesta máquina para conferir a interoperabilidade além do cliente próprio."

[[componente]]
nome = "Gerência de memória"
categoria = "Núcleo do kernel"
icone = "memory"
descricao = "Controla as páginas de memória física, as tabelas de páginas e o pool de memória do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/pfn.rs", "kernel/src/ntos/mm/paging.rs", "kernel/src/ntos/mm/kernel_pool.rs", "kernel/src/ntos/mm/guest_memory.rs", "kernel/src/ntos/mm/paging_file/mod.rs", "kernel/src/ntos/mm/working_set.rs", "kernel/src/ntos/mm/modified_writer.rs", "kernel/src/ntos/mm/commit.rs", "kernel/src/ntos/mm/section/image_segment.rs", "kernel/src/ntos/mm/section/image_header.rs", "kernel/src/ntos/mm/system_ptes.rs"]
testes = ["selftest", "pagefile"]
fase = "2"
notas = "A memória que os drivers enxergam é acessada como no NT: uma instrução por acesso, direto pelo endereço virtual, respeitando páginas somente leitura e cópia na escrita; a falta de página do anel 0 passa pelo Mm antes do bugcheck, e as PTEs são gravadas numa única escrita de 64 bits. Ponteiros vindos do modo usuário são sondados antes (o papel do __try/ProbeForRead) e devolvem STATUS_ACCESS_VIOLATION. Endereços físicos nunca são usados como ponteiro: toda a memória física aparece num mapa direto na metade de sistema (0xFFFFB000_00000000 + endereço físico), montado no boot, e é por ele que o kernel lê tabelas de páginas, o banco de PFNs, MMIO, tabelas ACPI e os dados dos processadores secundários; MmMapIoSpace devolve endereços desse mapa, como o NT devolve endereços de sistema. O heap do kernel e a arena de onde saem IRPs, DEVICE_OBJECTs, MDLs e as demais estruturas que os drivers recebem também moram na metade de sistema, numa janela própria (0xFFFFC000_C0000000), o papel do pool não paginado do NT: toda alocação fica acima de MmSystemRangeStart, e os drivers reais distinguem ponteiros de kernel e de usuário como no Windows. Essa janela não executa (como o pool não paginado sem execução do Windows): executar a partir dela falta, e o código que o kernel entrega aos drivers fica na imagem do próprio kernel. Como no Windows 10, o pool não paginado comum (NonPagedPool, e o ExAllocatePool2 com POOL_FLAG_NON_PAGED_EXECUTE) continua executável, em regiões próprias, para os drivers que executam a partir dele; o NonPagedPoolNx e o pool paginado não executam. O próprio kernel também: ele é ligado e executa em 0xFFFFF80040000000, onde o ntoskrnl do Windows fica, com a pilha de boot logo ao lado, e é essa a base que a lista de módulos carregados publica. A metade de usuário do espaço de endereços não tem nada do kernel: o carregador de boot só mapeia ali a página em que liga a paginação, que o kernel desfaz na entrada, e a página de partida dos processadores secundários fica mapeada só enquanto eles sobem; o boot confere que, no fim da fase 0, só restam páginas de usuário abaixo de MmSystemRangeStart. Essa metade é a do Windows 10 19041 x64: vai de 64 KB (os primeiros 64 KB nunca são mapeáveis, e um pedido com base abaixo deles falha com STATUS_CONFLICTING_ADDRESSES, assim como confirmar páginas, sem reservá-las, num endereço que não foi reservado antes) a MmHighestUserAddress = 0x7FFFFFFEFFFF, com MmUserProbeAddress = 0x7FFFFFFF0000. Uma alocação sem base recebe a primeira faixa livre de 64 KB a partir de baixo (com MEM_TOP_DOWN, a partir do topo), e pilhas, PEB, TEB e imagens também recebem a VA que o alocador escolhe; o único endereço fixo é a cópia somente leitura da KUSER_SHARED_DATA em 0x7FFE0000. A metade de sistema é preparada para vários espaços de endereçamento, como no NT: no boot, as entradas de sistema da tabela de páginas de nível mais alto ficam presentes e permanentes (nunca são criadas depois nem liberadas), menos a do espaço de sessão, e toda operação sobre as tabelas de páginas aceita a raiz de outro espaço, de modo que uma tabela nova copia a metade de sistema uma única vez e enxerga o kernel nos mesmos endereços. O Mm já monta o espaço de endereçamento próprio de um processo, como o MmCreateProcessAddressSpace: uma tabela de nível mais alto nova, com a metade de sistema compartilhada e a cópia somente leitura da KUSER_SHARED_DATA em 0x7FFE0000, gravada no KPROCESS; no último dereference do processo, todas as tabelas da metade de usuário e a própria raiz voltam à memória livre (MmDeleteProcessAddressSpace). KeStackAttachProcess e KeAttachProcess já trocam de verdade a tabela de páginas da CPU para a do processo anexado, e o detach volta à anterior, também em anexações aninhadas; a troca de thread corrente carrega a tabela do processo da thread, e o Mm recusa liberar uma tabela que alguma CPU esteja usando. Todo processo de usuário ganha esse espaço próprio ao ser criado e roda nele: a memória privada, o executável, a pilha, a PEB, a TEB e as vistas de seção de um processo ficam só na tabela dele, a mesma VA pode ter páginas diferentes em dois processos, e o System e os processos de kernel continuam na tabela do boot. Toda edição das tabelas de um processo vai à raiz dele, esteja ela carregada ou não, e o término desfaz todas as páginas de usuário dele antes de a raiz voltar à memória livre. As tabelas de páginas de cada processo e as páginas mapeadas nelas também entram no banco de páginas físicas do Windows (o MMPFN de cada uma sabe quantas entradas a apontam e onde está a principal), então uma tabela ainda em uso não pode ser devolvida, nem devolvida duas vezes, e uma tabela esquecida no fim do processo impede a raiz de voltar. Toda VA de usuário que o kernel toca, por acesso confiável ou sondado, exige que a tabela carregada na CPU seja a do processo corrente (o assert de CR3, ligado em todo boot). O espaço de sessão é o do Windows 10 x64: um slot próprio de cada sessão na tabela de nível mais alto, ligado na tabela de cada processo da sessão e vazio no System, com o MM_SESSION_SPACE na mesma VA em toda sessão; a sessão nasce com o processo criado com PROCESS_CREATE_FLAGS_CREATE_SESSION, os filhos entram nela, e o fim do último processo desfaz tudo. O pool de sessão (PagedPoolSession) só existe na sessão que o alocou, com a contabilidade de tags da sessão, e liberar fora dela para o sistema com BAD_POOL_CALLER; uma imagem carregada como imagem de sessão (MmLoadSystemImage com a flag de sessão, como o win32k) fica na mesma VA em toda sessão que a carrega, com o código compartilhado e os dados de cada sessão separados; o teste carrega o BOOTVID.DLL real em duas sessões. Arquivos de paginação: o smss.exe real cria o do Registro (PagingFiles) pelo NtCreatePagingFile, e o limite de commit cresce com ele. Quando falta memória, o corte do working set tira páginas das alocações privadas (PTE de transição). O modified page writer grava essas páginas no arquivo por IRP_PAGING_IO (PTE de arquivo de paginação). A falta de página traz a página de volta, sem E/S se ela ainda está em transição. SystemPageFileInformation e SystemPerformanceInformation mostram o arquivo, o commit e a paginação. Quando o commit passa do limite, ou o modified page writer acha o arquivo cheio, o Mm estende o arquivo até o máximo, como o 19041 (um pedido de extensão atendido por uma thread própria; o novo fim vai ao file system pelo IoSetInformation, sempre deixando 256 MB livres no volume), e o limite de commit sobe junto. Falta: o arquivo não encolhe, não há working set por processo, e pilha inicial, PEB e TEB ficam residentes. Uma seção de imagem tem a control area do NT (mm/section/image_segment.rs): a primeira vista de um arquivo monta as páginas protótipo em frames do PFN, e toda seção do mesmo arquivo usa a mesma control area. As vistas dividem as páginas de código e somente leitura entre os processos; as graváveis são cópias privadas, e uma página dividida que o NtProtectVirtualMemory torna gravável ganha antes a cópia privada (o PAGE_WRITECOPY). O heap do kernel guarda só os vetores de frames e de proteções da vista; antes, cada vista recarregava a imagem e guardava a tabela de exports no heap, que acabava no boot do smss real. A control area lê as seções do PE do disco direto para os frames, também quando o arquivo vem de um FILE_OBJECT de usuário, e nada do tamanho de uma seção ou de um arquivo passa pelo heap do kernel (o cache de leitura dos arquivos do volume também fica em frames do PFN). O cabeçalho de toda seção de imagem segue o MiVerifyImageHeader e o MiCreateImageFileMap do 19041 (alinhamentos, SizeOfImage arredondado à página); uma imagem com SectionAlignment menor que a página, como o E1G6032E.sys com 0x80, é mapeada plana: o arquivo inteiro a partir do offset zero, com o offset igual ao RVA, todo gravável por cópia e executável. O censo do heap (--heap-census e a falha do heap; cargo xtask heap-census dá os nomes) mostra os bytes vivos por local de alocação. O MmMapLockedPagesSpecifyCache em KernelMode mapeia as páginas travadas de um buffer de usuário em PTEs de sistema (mm/system_ptes.rs), e o MmUnlockPages as devolve."

[[componente]]
nome = "Multiprocessador (SMP)"
categoria = "Núcleo do kernel"
icone = "cpu"
descricao = "Acorda os outros núcleos do processador para que o kernel use mais de uma CPU."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/smp.rs", "kernel/src/hal/amd64/aptrampoline.rs", "kernel/src/ntos/ke/pcr.rs", "kernel/src/ntos/ke/processor_identity.rs", "kernel/src/ntos/ke/processor_topology.rs", "kernel/src/ntos/ke/affinity_set.rs"]
testes = ["selftest", "fase7"]
fase = "2"
notas = "Verificado com 4 CPUs no QEMU. Cada processador descreve a si mesmo como no Windows: no boot, cada um lê a própria identificação da CPU e preenche o seu bloco de controle com o fabricante, a família, o modelo, os recursos (pela mesma tabela de testes do Windows), o identificador do APIC, os núcleos, os caches e a frequência; com todos ligados, o kernel agrupa quem divide núcleo, pacote e cache. Daí saem os recursos que o modo usuário consulta (IsProcessorFeaturePresent), a descrição do processador e a topologia de núcleos e caches pedidas pelos programas e drivers, e o Errata Manager passa a reconhecer o fabricante. Os conjuntos de processadores de vários grupos e a enumeração dos processadores de um conjunto, que os drivers de energia do processador do Windows usam, seguem as rotinas do Windows. Como no Windows, cada processador tem a sua KPCR, publicada no próprio registrador GS (os secundários a recebem antes de partir), e nela o estado das chamadas de sistema e da execução em modo usuário: a pilha do usuário na entrada de uma syscall fica na KPCR da CPU que a executou, e não numa área compartilhada. A thread corrente também é de cada processador (o campo CurrentThread da KPCR, que os drivers leem em gs:[188h]): threads em CPUs diferentes ao mesmo tempo veem cada uma a si mesma e ao próprio processo. Programas de usuário ainda rodam só no processador de boot, mas cada processador já pode armar o modo usuário como no Windows: a tabela de descritores, a TSS com as pilhas próprias, a tabela de interrupções, os registradores da chamada de sistema e o timer local de cada um (com a opção --user-smp no boot, ou pelo teste), e então espera no laço ocioso dele com as interrupções ligadas. Um teste roda um programa de usuário no segundo processador e retoma nele uma chamada de sistema que bloqueou no primeiro. As esperas de resposta a interrupções entre processadores são medidas em tempo, e a invalidação de TLB espera a confirmação sem prazo, como no Windows (que só tem o IPI_WATCHDOG_TIMEOUT na barreira do KeIpiGenericCall, de 300 s): um processador que demora mais de 5 s vai à serial e a espera continua. Antes, a parada depois de 5 s derrubava a suíte com 4 CPUs quando o hospedeiro carregado deixava uma CPU virtual segundos sem rodar. A confirmação vem por NMI, que um processador com as interrupções desligadas e em nível de interrupção máximo ainda atende (um teste confirma 64 invalidações seguidas assim); o prazo da partida (100 ms) e o diagnóstico (5 s) valem em hardware e sob hipervisor, e no emulador do QEMU (TCG) são 12 vezes maiores, porque lá um processador virtual fica segundos sem rodar quando a máquina hospedeira está carregada. As chamadas a código nativo em curso também são de cada processador e de cada thread: dois processadores, ou duas threads que se revezam, dentro de drivers ao mesmo tempo não se confundem."

[[componente]]
nome = "Estado estendido do processador (XSAVE e AVX)"
categoria = "Núcleo do kernel"
icone = "cpu"
descricao = "Liga o AVX e salva os registradores YMM de cada thread, como o Windows faz."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/xsave.rs", "kernel/src/ntos/ke/xstate.rs", "kernel/src/hal/amd64/extended_state.rs", "kernel/src/ntos/rtl/extended_context.rs", "kernel/src/ntos/ps/context/xstate.rs"]
testes = ["xstate", "selftest"]
fase = "2"
notas = "Como no Windows 10 19041: no boot o kernel lê da CPU os recursos de estado estendido (x87, SSE, AVX e, quando o processador tem, o AVX-512), filtra pela política do hwpolicy.sys real (sem ele, nada é ligado, como no Windows), liga o OSXSAVE e o XCR0 em todos os processadores e publica a configuração na KUSER_SHARED_DATA. Com isso o modo usuário e os drivers veem o AVX e o AVX2 (IsProcessorFeaturePresent, o XGETBV e a XState que a ntdll lê) e escolhem os caminhos vetoriais. Cada thread tem a área de salvamento no topo da pilha de kernel; o estado sai da CPU sempre que a thread a deixa (fim de um intervalo de usuário, bloqueio no kernel, troca entre threads de kernel) e volta quando ela a retoma, pela mesma instrução que o Windows escolhe (XSAVES, XSAVEOPT ou XSAVE). Os drivers usam KeSaveExtendedProcessorState e KeRestoreExtendedProcessorState com a lógica do Windows (lista por thread, área do pool ou do processador em DISPATCH_LEVEL). O frame de exceção leva o CONTEXT com o pedaço XSTATE no layout do Windows, e o NtContinue, o NtRaiseException e o NtGetContextThread/NtSetContextThread aceitam o CONTEXT_XSTATE. O frame de uma APC de usuário especial, que interrompe o programa em qualquer instrução, leva o pedaço XSTATE como no Windows, e a volta pelo NtContinueEx devolve os YMM do código interrompido; a APC normal, que só sai no retorno de uma chamada de sistema, não o leva, também como no Windows. Um driver que passa um CONTEXT com CONTEXT_XSTATE ao PsSetContextThread é atendido. O depurador mostra os YMM reais. Falta: o PsGetContextThread (o kernel ainda não o exporta) e as threads com pilha de sombra (CET), que o Windows 10 19041 só liga com o hardware e a política próprios."

[[componente]]
nome = "Relógio e fuso horário"
categoria = "Núcleo do kernel"
icone = "clock"
descricao = "A hora do sistema, o fuso horário do Registro, o contador de desempenho e a resolução do relógio, como o Windows os expõe a drivers e programas."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/clock.rs", "kernel/src/hal/rtc.rs", "kernel/src/ntos/ex/time_zone.rs", "kernel/src/ntos/ex/system_time.rs", "kernel/src/ntos/ex/timer_resolution.rs", "kernel/src/ntos/rtl/time.rs", "kernel/src/ntos/po/time_change.rs", "kernel/src/ntos/cm/time_zone_information.rs"]
testes = ["relogio", "selftest", "fase6", "fase7"]
fase = "6"
notas = "Como no Windows 10: o relógio da CMOS guarda a hora local (o QEMU sobe com a hora local do fuso da hive) e o kernel a lê com o ActiveTimeBias do Registro; o fuso desta máquina (UTC−3, sem horário de verão) fica em Control\\TimeZoneInformation, e o kernel calcula o viés, o horário padrão ou de verão pelas datas de troca e publica tudo na página compartilhada com os programas, com o fim da validade do viés. A hora pode ser acertada (NtSetSystemTime, com o privilégio de mudar a hora), o que desloca a hora do boot e reescreve a CMOS; o fuso pode ser trocado (NtSetSystemInformation, com o privilégio de fuso). O contador de desempenho é o do processador escalado a 10 MHz por uma página de referência, a mesma conta nos drivers e nos programas: a ntdll real lê o contador sem entrar no kernel. A página compartilhada avança como no tique do relógio do Windows: o tempo de interrupção e a hora em passos da resolução corrente e o contador de tiques em períodos de 15,625 ms; a resolução vai de 15,625 ms a 0,5 ms, pelo menor pedido de um processo (NtSetTimerResolution, cancelado na saída do processo) ou do kernel (ExSetTimerResolution). Ainda falta: o aviso de troca da hora (o callback SetSystemTime e o estado WNF) só sai com o win32k carregado, como no Windows, e só o teste do win32k o alcança; as regras de horário de verão por ano (Dynamic DST) não estão na hive SOFTWARE do boot; a interrupção do relógio continua a 100 Hz (o quantum do escalonador): a resolução corrente muda os passos do tempo publicado, não a frequência da interrupção."

[[componente]]
nome = "Processos e threads"
categoria = "Núcleo do kernel"
icone = "threads"
descricao = "Alterna a CPU entre os processos do kernel e mantém as estruturas de processo e thread do NT (EPROCESS e KTHREAD)."
estado = "implementado"
caminhos = ["kernel/src/ntos/ps/scheduler.rs", "kernel/src/ntos/ps/process.rs", "kernel/src/ntos/ps/critical.rs", "kernel/src/ntos/mm/kernel_stack.rs"]
testes = ["selftest", "fase3", "fase6", "fase7"]
fase = "3"
notas = "O escalonador veio na fase 1; as estruturas reais de processo e thread, na fase 3. Como no Windows, toda thread do kernel (as threads de sistema que os drivers criam com o PsCreateSystemThread, o serviço de teclado, o shell) roda inteira na própria pilha, e o kernel troca de uma para outra salvando os registradores de quem sai e retomando os de quem entra: uma thread roda até ceder a vez, esperar ou terminar, e o código de um driver que chama o kernel é servido na pilha da própria thread. Como no Windows 10, o handle que o PsCreateSystemThread devolve é sempre de kernel, e o ProcessHandle escolhe o processo da thread: ela roda no espaço de endereçamento dele e vê a sessão dele, como a thread de apresentação que o cdd.dll cria no csrss da sessão. Uma thread que gasta o seu quantum cede a vez na próxima chamada ao kernel, então as interrupções e as outras threads não ficam esperando por ela, e o escalonador nunca roda dentro de uma espera. Como no Windows, cada thread que executa (de usuário ou de sistema) tem a sua pilha de kernel, na metade de sistema e com uma página de guarda, descrita nos campos da KTHREAD (StackBase, StackLimit, InitialStack e KernelStack): as chamadas de sistema, as interrupções e as exceções vindas do modo usuário rodam na pilha da própria thread, que volta à memória quando a thread termina. Um estouro de pilha de kernel cai na guarda e vira um diagnóstico com o endereço e a pilha, numa pilha reservada para a falta dupla, em vez de reiniciar a máquina. IoGetStackLimits devolve os limites reais da pilha da thread corrente. Processos e threads críticos funcionam como no Windows 10 (ps/critical.rs): o smss.exe inicial, o csrss.exe de cada sessão, o wininit.exe e o services.exe marcam-se críticos (RtlSetProcessIsCritical e RtlSetThreadIsCritical, pelas classes ProcessBreakOnTermination e ThreadBreakOnTermination, que também podem ser consultadas), e o fim de um deles, ou de uma thread crítica, para a máquina com CRITICAL_PROCESS_DIED (0xEF), o objeto e 0 ou 1 (processo ou thread) nos parâmetros, em vez de uma falha posterior sem relação."

[[componente]]
nome = "Sincronização e despacho"
categoria = "Núcleo do kernel"
icone = "clock"
descricao = "Os objetos de espera do NT (eventos, timers, APCs e DPCs), que drivers e o kernel usam para esperar e sinalizar."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/dispatcher.rs", "kernel/src/ntos/ke/apc.rs", "kernel/src/ntos/ke/timer.rs", "kernel/src/ntos/ke/dpc.rs", "kernel/src/ntos/ke/context_switch.rs", "kernel/src/hal/amd64/context_switch.rs"]
testes = ["fase3", "fase7", "selftest"]
fase = "3"
notas = "Interlocked*, spin locks, push locks, rundown e contagens de referência usam instruções atômicas de verdade (lock cmpxchg/xadd), como no NT, seguras com várias CPUs. O nível de interrupção (IRQL) é de cada processador e é o registrador CR8 dele, como no Windows x64: o nível que um driver lê ou grava direto no registrador é o mesmo que o kernel vê, e uma thread que espera leva o seu. O relógio do kernel mede a frequência do contador do processador contra o timer do ACPI, em janelas longas e com leituras casadas dos dois relógios, e a medida não muda com a carga da máquina hospedeira (antes, uma medida de 10 ms pelo PIT chegava a errar 25%). Uma thread do kernel que espera (um evento, um semáforo, um mutex, um timer, um atraso, uma fila do kernel, uma porta de conclusão, uma porta ALPC, um fast mutex, um recurso ou um push lock) sai da lista de prontas e não gasta CPU: a espera fica registrada no próprio objeto, nas estruturas do Windows (os blocos de espera da thread ligados à lista do objeto), e é o sinal que a acorda — o KeSetEvent, a liberação do semáforo ou do mutex, o vencimento do timer, o fim da thread ou do processo esperado, um alerta ou uma APC. O KeInsertQueue entrega a entrada direto à thread parada na fila, como o Windows faz. Um teste põe duas threads de sistema conversando por eventos e por filas do kernel, e um servidor e um cliente ALPC do kernel em threads próprias, e confere que a thread parada não gasta um ciclo. Outro põe duas threads de sistema a retirar pacotes da mesma porta de conclusão e da mesma fila do kernel, com uma terceira thread a publicar: cada pacote acorda uma consumidora parada, que volta à lista de prontas, e nenhuma se perde. O estado da thread (em execução, esperando, pronta) só muda pelo despachante. Antes, o fim de uma retirada vindo de outra thread marcava a consumidora parada como em execução, e ela nunca mais rodava (a thread de trabalho do msrpc.sys no logon do winlogon). Como no Windows, uma thread de programa que espera dentro de uma chamada de sistema (um evento, um mutex, um recurso, um atraso) sai da CPU: o kernel guarda os registradores dela na própria pilha de kernel e roda outra thread, e quando a espera termina a retoma exatamente de onde parou. O mesmo vale para a retirada de uma fila do kernel (KeRemoveQueue, com prazo e alerta como no Windows) e para a espera do fim de uma leitura, escrita ou controle de dispositivo síncrono. Esperar com um spin lock retido, ou em nível de interrupção alto com prazo, para o sistema com um diagnóstico, como no NT. A thread que um sinal tira da espera ganha o impulso de prioridade do Windows: a base mais o incremento do sinal (1 nos serviços de evento, semáforo e mutex de modo usuário e no ALPC, 2 num alerta, o Increment que o driver passa ao KeSetEvent), mais a separação de primeiro plano num processo em primeiro plano, até 15; o fim de quantum desfaz o impulso aos poucos. Um teste confere cada caso da regra do kernel do Windows (espera curta ou longa, quantum gasto, base alta, tempo real, impulso desligado)."

[[componente]]
nome = "Jobs"
categoria = "Núcleo do kernel"
icone = "threads"
descricao = "Agrupa processos num objeto job do NT, com limites, contabilidade e notificações por porta de conclusão."
estado = "implementado"
caminhos = ["kernel/src/ntos/ps/job.rs", "kernel/src/ntos/ps/job/object.rs", "kernel/src/ntos/ps/job/membership.rs", "kernel/src/ntos/ps/job/limits.rs", "kernel/src/ntos/ps/job/information.rs", "kernel/src/ntos/mm/process_commit.rs"]
testes = ["fase7"]
fase = "7"
notas = "Como no Windows 10, um programa cria um job (NtCreateJobObject), põe processos nele (NtAssignProcessToJobObject), consulta e altera as informações dele e recebe as mensagens JOB_OBJECT_MSG_* numa porta de conclusão: processo novo, saída normal ou por exceção, job vazio, limite de processos ativos e limite de memória. O limite de processos ativos recusa a atribuição e a criação com o status do Windows; os limites de memória do job e de cada processo recusam o commit acima deles; com JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE o fechamento do último handle termina os processos do job, e NtTerminateJobObject termina todos com o status pedido. Os jobs se aninham como no Windows 8: um job vazio vira filho do job do processo. O processo criado por um membro herda o job, salvo o breakaway permitido (BREAKAWAY_OK e SILENT_BREAKAWAY_OK), e PROC_THREAD_ATTRIBUTE_JOB_LIST põe o processo novo nos jobs da lista. A contabilidade soma o tempo de CPU, as trocas de contexto e a E/S dos processos que saíram e dos vivos. Os limites de tempo, de working set, de afinidade e de prioridade ficam registrados no job, mas o escalonador ainda não os aplica; controle de CPU, de rede e de E/S, congelamento e silos ainda não."

[[componente]]
nome = "Gerenciador de objetos e namespace"
categoria = "Núcleo do kernel"
icone = "cube"
descricao = "Dá nome e contagem de referências aos objetos do kernel e monta a árvore \\Device, \\Driver, \\GLOBAL?? e os links de unidade como C:."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ob/object_manager.rs", "kernel/src/ntos/ob/handle_table.rs", "kernel/src/ntos/init/phase0.rs"]
testes = ["fase3"]
fase = "3"
notas = "Cada processo tem a própria tabela de handles (EPROCESS.ObjectTable): um handle de usuário só é resolvido no processo que o abriu, ou no processo anexado, e os handles de kernel ficam na tabela do System e valem em qualquer processo. Em \\KernelObjects já existem a MemoryPartition0 e os eventos de memória e de commit (High/LowMemoryCondition, High/Low/MaximumCommitCondition, abertos pelo mountmgr.sys); os demais eventos de \\KernelObjects e parte dos tipos de objeto (Session, entre outros) ainda faltam. Os objetos do ObCreateObject (tipos dos drivers e do subsistema de janelas, criados pelo ObCreateObjectTypeEx) têm o OBJECT_HEADER do NT na frente do corpo, com os cabeçalhos opcionais, o TypeIndex embaralhado pelo ObHeaderCookie, PointerCount e HandleCount (com a contagem por processo), a cota do processo e a remoção adiada em PASSIVE_LEVEL, e o Ob chama as rotinas do tipo (Open, Close, OkayToClose, Delete, Security e QueryName); a ParseProcedure ainda não é chamada, e processos, threads, arquivos, dispositivos, drivers, seções, tokens, chaves e eventos continuam com donos próprios, sem cabeçalho."

[[componente]]
nome = "Segurança e tokens"
categoria = "Núcleo do kernel"
icone = "shield"
descricao = "Tokens de acesso e descritores de segurança, usados para decidir quem pode abrir cada objeto."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/token/tokens.rs", "kernel/src/ntos/se/token/query.rs", "kernel/src/ntos/se/token/create.rs", "kernel/src/ntos/se/token/set_information.rs", "kernel/src/ntos/se/token/elevation.rs", "kernel/src/ntos/se/object_security.rs", "kernel/src/ntos/se/access_evaluation.rs", "kernel/src/ntos/ob/object_security.rs", "kernel/src/ntos/ps/open_procedure.rs", "kernel/src/ntos/mm/session_object.rs"]
testes = ["fase3", "fase6", "fase7"]
fase = "3"
notas = "Toda verificação de acesso é a do SeAccessCheckWithHint do ntoskrnl 19041: integridade obrigatória (o rótulo padrão Medium com NO_WRITE_UP corta a escrita de quem tem nível menor, também no MAXIMUM_ALLOWED), direitos implícitos do dono (salvo uma ACE de OWNER RIGHTS), SeSecurityPrivilege, SeTakeOwnershipPrivilege e SeRelabelPrivilege, DACL na ordem das ACEs e as passagens de token restrito e LowBox; os exports SeAccessCheck*, as aberturas do Object Manager, de processos, threads, tokens, chaves e do namespace usam a mesma. Cada objeto tem um descritor (o do OBJECT_HEADER, o da tabela lateral dos dispositivos ou o do dono do corpo) atribuído pelo SeAssignSecurity com a herança do diretório; o NtSetSecurityObject o troca e a abertura seguinte segue o descritor novo, e o NtQuerySecurityObject o lê para todo tipo. A OpenProcedure de processos e threads acrescenta os direitos limitados implícitos a cada handle, e cada sessão tem o objeto Session (\\KernelObjects\\Session<id>) que o NtSetInformationObject liga a um diretório. O NtQueryInformationToken e o ZwQueryInformationToken serializam as classes do token com os ponteiros relativos ao buffer do chamador; o ReturnLength recebe o tamanho exigido e um buffer curto devolve STATUS_BUFFER_TOO_SMALL sem gravar no buffer, como no ntoskrnl. A TokenAccessInformation (classe 22) tem o layout do SepCopyTokenAccessInformation, com os hashes de SIDs, os atributos de segurança no formato interno do token e os privilégios na ordem do LUID, e o SeTokenFromAccessInformation e o SeQuerySecurityAttributesTokenAccessInformation a consomem (o tcpip.sys monta dela o TOKEN da WFP). O NtCreateToken e o NtCreateTokenEx criam o token de logon do LSA (SeCreateTokenPrivilege, a sessão de logon do RmCreateLogonSession, dono e grupo primário, grupos obrigatórios, rótulo de integridade, origem e atributos de segurança); o NtSetInformationToken troca o dono, o grupo primário, a DACL padrão, o SessionId e os atributos de segurança, com a máscara de classes do 19041; o NtAccessCheck confere um descritor capturado contra o token de impersonação ou um pseudo-handle, que é o que o RPC faz com o descritor de cada interface; o PS_ATTRIBUTE_TOKEN do NtCreateUserProcess dá ao processo novo uma cópia do token pedido (o CreateProcessAsUser). O TokenElevation e o TokenElevationType são os do 19041, e o par de tokens do UAC existe: o TokenLinkedToken do NtSetInformationToken (o SepLinkLogonSessions) liga as sessões de logon do token completo e do filtrado, e o do NtQueryInformationToken devolve a cópia do outro; as classes 23, 24, 26 e 42 trocam os bits de TokenFlags com os privilégios do 19041. O UAC fica desligado porque as hives não têm o UACInstalled que o PsBootPhaseComplete e o lsass leem."

[[componente]]
nome = "I/O Manager"
categoria = "Núcleo do kernel"
icone = "io"
descricao = "O contrato entre o kernel e os drivers: dispositivos, pedidos de I/O (IRPs), pilhas de drivers e Plug and Play."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/io/io_manager.rs", "kernel/src/ntos/io/irp_builder.rs", "kernel/src/ntos/io/pnp/mod.rs", "kernel/src/ntos/io/pnp/tree.rs", "kernel/src/ntos/io/work_items.rs", "kernel/src/ntos/io/file/irp_service.rs"]
testes = ["fase4", "teclado", "pipes"]
fase = "4"
notas = "A pilha de teclado e mouse do Windows (i8042prt.sys, kbdclass.sys e mouclass.sys) já roda sobre ele. A árvore de dispositivos do PnP (devnodes com ids, chave Enum, instalação pelas linhas de modelo dos INFs da caixa, AddDevice de filtros e serviço, arbitragem e tradução de recursos, START_DEVICE com as listas bruta e traduzida, enumeração e IoInvalidateDeviceRelations enfileirado, de BusRelations ou SingleBusRelations, e drenado pelo PnpDeviceActionWorker quando chega fora do processamento da árvore) sobe a pilha de disco do Windows com --storage=real (teste storage) e o BasicDisplay.sys sobre o dxgkrnl.sys com --display=basic (teste basicdisplay), com as linhas do display.inf e do machine.inf (msisadrv, KMDF) no banco de drivers e o ExcludeID das seções; as funções que um driver interno do kernel serve no boot (a controladora IDE sem --storage=real, o adaptador VGA sem --display=basic) ficam com nó do kernel, sem instalação; no boot comum ela não roda e a pilha PS/2 usa o orquestrador direto, com uma tabela fixa de ids. Inclui filas de IRP canceláveis (IoCsq*), IRPs síncronos e assíncronos de FSD, IoCreateDriver, interfaces de dispositivo, eventos nomeados de I/O e as consultas WMI (sem WMI, com o status do Windows). Para file systems e armazenamento: IRPs associados (com a devolução ao mestre na conclusão), I/O de paginação (IoPageRead/IoSynchronousPageWrite), extensões de FILE_OBJECT e de IRP, registro de file systems e suas notificações, montagem de volumes pelo caminho do NT (IopMountVolume com IRP_MN_MOUNT_VOLUME a cada file system da fila, IopCheckVpbMounted e o ramo de arquivo do IopParseDevice, que manda o IRP_MJ_CREATE ao dispositivo de volume; o IoCreateDevice dá VPB e DeviceLock aos dispositivos montáveis; sem o RAW), stream file objects, share access, IoReportDetectedDevice, propriedades de dispositivo (IoGetDeviceProperty, IoGetDevicePropertyData com as DEVPKEY_Device_* e IoOpenDeviceRegistryKey pelas chaves de hardware e de driver do devnode), interfaces de dispositivo com os links do NT (\\??\\<instância>#{guid}) e IoGetDmaAdapter pelo BUS_INTERFACE_STANDARD do barramento. O grafo de dependências entre dispositivos (IoSetDependency, IoReserveDependency, IoResolveDependency, IoDuplicateDependency, IoTestDependency) existe sobre DEVOBJ_EXTENSION.DependencyNode, sem a ordem de energia nem a liberação do início dos dependentes; IoRequestDeviceEject(Ex) e IoRequestDeviceRemovalForReset validam e enfileiram como o Windows, mas o PnP ainda não processa eventos de remoção ou ejeção de dispositivo-alvo (o pedido conclui com STATUS_TOO_LATE); IoAssignResources libera e valida, mas ainda não passa pelos árbitros da árvore do PnP e nenhum pedido é atendido (STATUS_RETRY). O I/O empacotado do StartIo é o do NT: a KDEVICE_QUEUE do Ke (os sete KeInsert*/KeRemove*DeviceQueue, com o Hint da retirada por chave) e o IoStartPacket/IoStartNextPacket/IoStartNextPacketByKey com o spin lock de cancelamento, DOE_SIO_NO_CANCEL e o modo adiado de DOE_SIO_DEFERRED (o beep.sys real usa). NtReadFile/NtWriteFile de dispositivo aceitam I/O bufferizado e neither (o null.sys real); DO_DIRECT_IO ainda não. Os diretórios \\FileSystem e \\FileSystem\\Filters existem desde o boot, e o IoCreateDevice aceita um nome absoluto fora de \\Device (os reconhecedores do fs_rec.sys real). Os serviços de arquivo de modo usuário sobre IRP montam e concluem o IRP como o ntoskrnl: NtCreateNamedPipeFile e NtCreateMailslotFile (IRP_MJ_CREATE_NAMED_PIPE/CREATE_MAILSLOT com os parâmetros capturados e a validação do IopCreateFile), NtReadFile e NtWriteFile de neither I/O, NtFsControlFile (METHOD_BUFFERED e METHOD_NEITHER) e NtQueryInformationFile/NtSetInformationFile de arquivos de driver, com a cauda síncrona no FileObject->Event (a thread bloqueia de verdade) e o IopCompleteRequest na thread que pediu, por APC especial de kernel quando a conclusão vem de outra; o IofCompleteRequest mantém Irp->PendingReturned. Testados com os npfs.sys e msfs.sys reais entre dois processos. Ainda sem a APC de usuário e a porta de conclusão desses serviços, e sem METHOD_IN/OUT_DIRECT. O IoAllocateMdl só descreve o buffer e o liga ao IRP, como no ntoskrnl; os PFNs e os flags vêm do MmBuildMdlForNonPagedPool, do MmProbeAndLockPages, do IoBuildPartialMdl e do MmMapLockedPagesSpecifyCache. O NtDeviceIoControlFile (de usuário e de kernel) tenta o FastIoDeviceControl do driver antes de montar o IRP, como o IopXxxControlFile, com o evento zerado antes e sinalizado no sucesso. O PnP manager cria em todo boot o driver embutido \\Driver\\DeviceApi (PiDaInit) e o \\Device\\DeviceApi, cujo nome aberto escolhe o tratador: o \\CMApi do cfgmgr32.dll atende pelo Fast I/O os IOCTLs GetDeviceStatus, ValidateDeviceInstance (CM_Locate_DevNode), GetDeviceDepth e GetRelatedDeviceInstance sobre a árvore de dispositivos, com o resultado no buffer de saída como o PiCMHandleIoctl; os outros IOCTLs da família, o \\Dev\\Query, o \\SwDevice e os registros do \\CMNotify ainda não têm suporte. O DriverName de um driver é o nome do objeto (\\Driver\\<serviço>), como o IopLoadDriver o grava. Os work items (ExQueueWorkItem, IoQueueWorkItem e as variantes) rodam nas worker threads do sistema, como o ExpWorkerThread: o ExpWorkerInitialization da fase 1 cria as workers no processo System, antes disso a fila só guarda os itens, cada item roda na prioridade do tipo de fila (ExpTypeToPriority) e, com todas as workers paradas numa espera, o gerenciador das filas cria mais uma depois de 1 s; nenhum item roda no contexto de boot nem na pilha de quem espera. O IoGetRelatedTargetDevice devolve a lista do driver pelo ExFreePool."

[[componente]]
nome = "Registro"
categoria = "Núcleo do kernel"
icone = "database"
descricao = "O banco de configuração do sistema (hives, chaves e valores), de onde vêm, entre outras coisas, os serviços e drivers a carregar."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/registry.rs", "kernel/src/ntos/cm/key", "kernel/src/ntos/cm/hive", "kernel/src/ntos/cm/hive_list.rs", "kernel/src/ntos/cm/hive_init.rs", "kernel/src/ntos/cm/hive_services.rs", "kernel/src/ntos/cm/lazy_flush.rs", "kernel/src/ntos/cm/callbacks.rs", "kernel/src/ntos/cm/seed.rs", "xtask/src/hive_image.rs"]
testes = ["fase5"]
fase = "5"
notas = "Hives de arquivo no formato regf do Windows: bloco base com soma e sequências, bins, células nk/vk/sk/lf/lh/li/ri/db com dados grandes, células livres reaproveitadas e unidas, células de segurança compartilhadas com contagem de referências. As hives de máquina vêm de \\SystemRoot\\System32\\config, gravadas pelo build com as tabelas que o kernel semearia (SYSTEM com os serviços de driver, os parâmetros, as classes de dispositivo, o Session Manager no boot do smss e o Select; SOFTWARE com os CSPs, as Image File Execution Options e o IniFileMapping do basesrv; SAM, SECURITY, com o SAM como link para SAM\\SAM, e DEFAULT), e são ligadas na fase 1 logo depois da montagem do NTFS; sem um arquivo, as mesmas chaves vão para a memória. A SYSTEM guarda o ControlSet001, e o CurrentControlSet é o link volátil que o CmpCreateControlSet cria para o Select\\Current; a HARDWARE é uma hive volátil (células sem arquivo) criada na fase 0, antes da descrição do hardware; a lista de hives (CurrentControlSet\\Control\\hivelist) leva o nome do arquivo de cada hive. Links do Registro como no CmpDoParseKey: REG_OPTION_CREATE_LINK, o SymbolicLinkValue REG_LINK, OBJ_OPENLINK, até 64 reparses, o nome real nos handles. Cada mudança numa chave de hive vai na hora para as células (setores sujos); o NtFlushKey grava o log incremental (.LOG1/.LOG2, entradas HvLE com Marvin32) e o primário entre o bloco base invalidado e o validado, e a carga de um primário invalidado aplica os logs. O escritor preguiçoso (KTIMER de 60 s, DPC e work item do sistema) descarrega as hives sujas sem NtFlushKey, menos as REG_NO_LAZY_FLUSH, retido nos primeiros 60 s depois da montagem; o desligamento ordenado descarrega todas (CmShutdownSystem). Serviços NtLoadKey/NtLoadKey2/NtLoadKeyEx/NtLoadKey3 (com REG_APP_HIVE em \\REGISTRY\\A, que só abre pelo handle, descarrega no último fechamento e não se compartilha com REG_PROCESS_PRIVATE, REG_LOAD_HIVE_OPEN_HANDLE, o evento da descarga, o TrustClassKey com as classes de confiança que limitam os links das hives de usuário e o token de acesso ao arquivo do NtLoadKey3; o primário e os logs .LOG1/.LOG2 abertos na carga), NtUnloadKey/2/Ex (o Ex congela a hive com handles abertos até o último handle; as hives do boot não se descarregam), NtSaveKey/NtSaveKeyEx (versões 1.3 e 1.5), NtRestoreKey (com REG_WHOLE_HIVE_VOLATILE e REG_REFRESH_HIVE), NtFlushKey, NtCompressKey, NtCompactKeys e NtQueryOpenSubKeys/NtQueryOpenSubKeysEx (os corpos de chave abertos numa hive, com o PID e o nome de cada um), com SeRestorePrivilege/SeBackupPrivilege, e os Zw exportados; a carga num ponto de montagem de hive de máquina dispara o CmRegisterMachineHiveLoadedNotification. Filtros de registro: CmRegisterCallback (altitude legada 425000) e CmRegisterCallbackEx por altitude, as notificações pré e pós das chaves e dos serviços de hive, os contextos de objeto (CmSetCallbackObjectContext e o RegNtCallbackObjectContextCleanup), CmCallbackGetKeyObjectID(Ex), CmGetBoundTransaction e CmGetCallbackVersion. As hives de usuário (o NTUSER.DAT em \\REGISTRY\\USER\\<SID> e o UsrClass.dat em <SID>_Classes) seguem o caminho do serviço de perfis; ainda faltam as hives diferenciais e as transações do KTM; o NtInitializeRegistry (cm/hive_init.rs) segue o do ntoskrnl, com cada etapa uma vez só (CM_BOOT_FLAG_SMSS, o aviso dos arquivos de paginação e o aceite do boot), mas não liga as hives: o kernel já as liga na fase 1. A arena de chaves continua sendo o namespace (o papel dos KCBs com cache completo), com o descritor de segurança compartilhado entre as chaves que têm o mesmo e sem cópias dos nomes em minúsculas; os bins das hives ficam em páginas do VirtualAlloc de kernel, fora do heap. O NtNotifyChangeKey e o NtNotifyChangeMultipleKeys de modo usuário (cm/notify.rs) seguem o NtNotifyChangeMultipleKeys do ntoskrnl: validação de Count, do filtro e do REG_NOTIFY_THREAD_AGNOSTIC, o IOSB com STATUS_PENDING antes de tudo, KEY_NOTIFY no handle, a subordinada por nome em outra hive, o evento zerado, STATUS_PENDING no assíncrono e espera alertável no síncrono; a mudança grava STATUS_NOTIFY_ENUM_DIR no IOSB do processo, sinaliza o evento e enfileira a APC de usuário. Fechar a chave ainda não completa o pedido com STATUS_NOTIFY_CLEANUP."

[[componente]]
nome = "Carregador de PE e exports do kernel"
categoria = "Núcleo do kernel"
icone = "list"
descricao = "Carrega drivers .sys e bibliotecas no formato PE do Windows e liga cada import a uma função exportada pelo kernel."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/mm/pe_loader.rs", "kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/exports.rs"]
testes = ["fase6", "boot"]
fase = "6"
notas = "Os drivers do Windows que esta página dá como Funciona ou Parcial carregam por ele; um import sem export correspondente recusa a carga. Como no NT, toda imagem de kernel (drivers, hal.dll, ci.dll, bibliotecas de export) é mapeada no espaço de sistema, na janela que começa em 0xFFFFF80100000000, sobre frames do PFN, e relocada para lá; nenhuma fica na metade de usuário nem abaixo de 4 GB. Dos exports do ntoskrnl, parte ainda falta (veja a página Exports do ntoskrnl). MmLoadSystemImage carrega imagens de sistema sob demanda, o caminho previsto para o win32k.sys real, que ainda não carrega. A lógica de cada export mora no arquivo do assunto do componente e o exports.rs só adapta. Todos os imports do ntoskrnl do fltmgr.sys, storport.sys, partmgr.sys, volmgr.sys, volsnap.sys, pciidex.sys, intelide.sys, netio.sys, nsiproxy.sys, fwpkclnt.sys e pcw.sys já têm export; o pciidex.sys, o intelide.sys, o partmgr.sys e o volmgr.sys carregam no teste storage, e o storport.sys com o stornvme.sys no teste nvme. O ksecdd.sys carrega e roda (teste ksecdd), e também o null.sys, o beep.sys, o fs_rec.sys e o ksecpkg.sys (testes null, beep, fs_rec e ksecpkg). O clfs.sys já tem todos os seus imports do ntoskrnl. Imagens que importam uma da outra carregam como no MmLoadSystemImageEx: a entrada entra na lista de imagens carregadas antes dos imports, com LOAD_IN_PROGRESS, e o import que volta a ela usa os exports dessa entrada; a DLL carregada pelo import ganha DRIVER_DEPENDENT_DLL e o DllInitialize logo depois da própria carga (o par netio.sys e ndis.sys no teste ndis; duas DLLs sintéticas na fase 6). O FullDllName é o caminho NT da imagem (o ImagePath do serviço, ou \\SystemRoot\\System32\\drivers\\<nome> para as DLLs dos imports), e um encaminhamento de export sem extensão (NDIS.NdisMatchPdoWithPacket) acha a imagem carregada pelo prefixo do BaseDllName. A PsLoadedModuleList e o PsLoadedModuleResource são exports de dado reais: a cabeça e o ERESOURCE moram na .kdata, a lista é publicada no boot (ntoskrnl primeiro, depois a HAL e os drivers) e cada carga ou descarga a refaz sob o recurso exclusivo, com as KLDR_DATA_TABLE_ENTRY no layout do PDB. Os 42 exports que eram o último import de drivers reais (sscanf_s/swscanf_s, a árvore rubro-negra, RtlIpv4/6AddressToString[Ex]A, PoRegisterSystemState, PoFxRegisterPrimaryDevice, IoOpenDeviceInterfaceRegistryKey, os keep-alive do Io, MmAddPhysicalMemory, ZwFlushVirtualMemory, ZwCreateWnfStateName, PsSuspendProcess e outros) existem e têm autoteste na fase 6; o MmAddPhysicalMemory valida e acusa RAM presente, mas memória nova recebe STATUS_INSUFFICIENT_RESOURCES porque o banco de PFN não cresce depois do boot. Um segundo lote de 76 exports (SDDL, níveis de assinatura, CRT, OEM em maiúsculas, Ldr de recursos, rastreamento de I/O, callbacks de filtro do FsRtl, alias de interface, notificações de thread Ex, triagem do Ke, MDLs de dump, dispositivos de boot, EtwSendTraceBuffer, Hvl, NtCreateEvent, NtWaitForSingleObject, NtQueryInformationProcess, NtSetSecurityObject e outros) fecha os imports do ntoskrnl de mais 48 drivers da máquina (376 dos 419 com todos os imports do ntoskrnl), com autoteste na fase 6; um terceiro lote de 70 exports (prefixos Unicode, vetores de correlação, RtlCrc32, parsers de endereço com porta, término de sessões de logon, atributos de segurança de token, ZwCompareTokens, SeExamineSacl, MCB de 32 bits, FsRtlRegisterMupCalls, NtFsControlFile, ZwNotifyChangeDirectoryFile, os IRPs Ex, pedidos de energia, espera por endereço sobre push lock, ExGetSystemFirmwareTable, MmCopyMemory e outros) e o dado SePublicDefaultDacl levam a 400 dos 419 drivers com todos os imports do ntoskrnl, com autoteste na fase 6; o mup.sys, o dfsc.sys, o udfs.sys e o cldflt.sys sobem pelo --start-driver (teste drivers-arquivos-rede). O ExQueryWnfStateData segue a assinatura do 19041 (pela inscrição) e o \\SystemRoot passa pelo \\Device\\BootDevice, como no CreateSystemRootLink; a tabela de trampolins tem 4096 stubs, o bastante para os 3070 exports do ntoskrnl. A imagem do kernel tem a seção PAGE logo depois da .text, como o ntoskrnl (código, leitura e residente, 0x68000020). Drivers que acham MmAllocateIndependentPages, MmFreeIndependentPages e PsEnumProcessThreads (não exportados) seguindo um CALL conhecido encontram as mesmas sequências do ntoskrnl 19041: KeAllocateProcessorProfileStructures (export com corpo nativo) até o CALL de +0xc6, e na PAGE o MmFreeIsrStack, o PopUpdateSingleProcessHeteroPolicies e a chamada do EtwpProcessEnumCallback, com as três rotinas privadas também na PAGE; a fase 6 faz o caminho de um driver (EAT, tabela de seções pela PsLoadedModuleList, busca dos bytes) e chama cada rotina pelo endereço achado. O logger ainda não grava o rundown clássico do NT Kernel Logger: o EtwpThreadEnumCallback só marca o tipo do evento."

[[componente]]
nome = "Cache Manager"
categoria = "Núcleo do kernel"
icone = "layers"
descricao = "O cache de arquivos do NT (rotinas Cc*), pelo qual os drivers de sistema de arquivos leem e gravam através da memória."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cc"]
testes = ["fase6", "ntfs"]
fase = "8"
notas = "51 das 69 rotinas Cc* do ntoskrnl: SHARED_CACHE_MAP e PRIVATE_CACHE_MAP nativos pendurados no SECTION_OBJECT_POINTERS, vistas de 256 KB lidas por IRPs de paginação à pilha do próprio arquivo, cópias, map/pin com BCBs, MDLs, flush, purge e as rotinas de LSN e log do NTFS. O lazy writer é o do NT: uma thread de sistema do Cc acordada pelo ScanTimer (CcFirstDelay, 3 s, e CcIdleDelay, 1 s, enquanto há trabalho) ou por uma passada rápida, que faz o CcWriteBehind de cada mapa sujo (AcquireForLazyWrite, escrita das páginas com o write-ahead do log, ReleaseFromLazyWrite) e apaga os mapas sem FILE_OBJECTs, soltando a referência do stream file. O último CcUninitializeCacheMap de um mapa sem PinAccess (e sem evento), sujo ou em escrita fica para ele (FALSE), e o CcWaitForCurrentLazyWriterActivity espera a passada. O ntfs.sys real monta, lê e grava por ele (teste ntfs); os autotestes usam um dispositivo sintético. O FsRtlCopyRead/CopyWrite e o MDL genérico do FsRtl já chegam a ele. Ainda falta o FsRtlAcquireFileExclusive em volta da remoção do mapa (o lazy writer do NT adquire o arquivo antes de apagá-lo)."

[[componente]]
nome = "Desligamento e reinício"
categoria = "Núcleo do kernel"
icone = "power"
descricao = "O desligamento ordenado do NT: avisa drivers e file systems, grava o Registro e os volumes no disco e desliga ou reinicia a máquina pela ACPI."
estado = "implementado"
caminhos = ["kernel/src/ntos/po/shutdown.rs", "kernel/src/ntos/io/shutdown.rs", "kernel/src/ntos/ex/shutdown.rs", "kernel/src/hal/firmware_return.rs", "kernel/src/ntos/test/shutdown.rs"]
testes = ["shutdown", "reboot", "shell-shutdown"]
fase = "4"
notas = "NtShutdownSystem e NtSetSystemPowerState (ações de desligamento) de modo kernel e de usuário, com o SeShutdownPrivilege habilitado exigido do modo usuário, seguem o PopGracefulShutdown do ntoskrnl 19041: o PopShutdownEvent e as threads do PoRequestShutdownEvent; o ExShutdownSystem(0), que grava o ShutdownTime em Control\\Windows; o IoShutdownSystem(0), com o IRP_MJ_SHUTDOWN síncrono no topo da pilha de cada dispositivo do IoRegisterShutdownNotification (o último registrado primeiro); o CmShutdownSystem, com todas as hives no disco; o IoShutdownSystem(1), com os file systems das filas de disco, CD-ROM e fita (o ntfs.sys real descarrega e fecha o volume) e a fila de última chance; o CcWaitForCurrentLazyWriterActivity; e o PopShutdownSystem. A HAL desliga pelo S5 (PM1a/PM1b_CNT com o HalpShutdownContext que o acpi.sys dá pelo HaliAcpiMachineStateInit, ou o \\_S5_ da DSDT sem o acpi.sys) e reinicia pelo caminho do HalpPowerWriteResetCommand (CMOS 0x0F, 0x472, RESET_REG da FADT, 8042). A política DontPowerOffAfterShutdown faz o ShutdownNoReboot parar com a máquina ligada. O shell tem os comandos shutdown e reboot. Os testes shutdown e reboot gravam pelo ntfs.sys e no Registro, desligam ou reiniciam, e conferem no boot seguinte o que sobreviveu, com o QEMU saindo sozinho pelo desligamento ACPI. Ficam de fora os passos de componentes que o OpenNT não tem: TmShutdownSystem, EtwShutdown, MmShutdownSystem sem arquivo de paginação, PsWaitForAllProcesses e os IRPs de energia S5 aos dispositivos (PopSetDevicesSystemState); o PoQueueShutdownWorkItem e os tratadores de estado do ZwPowerInformation ainda não existem."

[[componente]]
nome = "Vídeo VGA em modo texto"
categoria = "Drivers internos"
icone = "monitor"
descricao = "Escreve texto na tela de 80x25 caracteres e move o cursor."
estado = "implementado"
caminhos = ["kernel/src/drivers/video/vga.rs"]
testes = ["boot"]
fase = "1"
notas = "Suporte de boot do próprio kernel, para as mensagens e o shell; a tela gráfica do Windows é o alvo dxgkrnl.sys e BasicDisplay.sys. Sem framebuffer de boot, a tela de bugcheck sai aqui, em branco sobre azul, com os textos do bootres.dll.mui (bgk/bugcheck_screen.rs). Os testes conferem o texto pela serial; a imagem na tela não é conferida."

[[componente]]
nome = "Console"
categoria = "Drivers internos"
icone = "terminal"
descricao = "Junta a tela e a saída serial num só lugar para as mensagens do kernel e do shell."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/console/mod.rs"]
testes = ["boot", "shell", "condrv"]
fase = "4"
notas = "Tela e espelho serial funcionam desde a fase 1. O registro como dispositivo do I/O Manager (\\Device\\Console), previsto no módulo, ainda não existe. O console do Windows é o condrv.sys real (\\Device\\ConDrv), que já está no volume com a chave de serviço da instalação (sob demanda) e carrega e roda com `--start-driver=condrv` (teste condrv): o kernel abre \\Device\\ConDrv\\Server, a referência e a conexão de um console como o conhost e a kernelbase fazem e troca as mensagens de conexão e desconexão pelos IOCTLs do condrv (READ_IO e COMPLETE_IO). O conhost.exe real ainda não roda (precisa do user32 e do win32k). Os exports de console de boot que ele usa (BgkDisplayCharacter, BgkGetConsoleState, BgkSetCursor) e o PsResumeProcess já existem: sem biblioteca gráfica de boot, os Bgk* devolvem STATUS_UNSUCCESSFUL, como no Windows sem console gráfico de boot."

[[componente]]
nome = "Teclado PS/2"
categoria = "Drivers internos"
icone = "keyboard"
descricao = "Traduz os scancodes do teclado em caracteres para o shell e, sem os drivers do Windows no build, lê a controladora PS/2 direto pela IRQ1."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard.rs"]
testes = ["shell"]
fase = "1"
notas = "Suporte de boot do próprio kernel. Quando o build traz o i8042prt.sys e o kbdclass.sys (o xtask os copia sempre que existem na máquina de build), as teclas chegam pelos drivers do Windows e este driver só faz a tradução; a leitura direta pela IRQ1 é o caminho de reserva, sem teste automático."

[[componente]]
nome = "Barramento PCI"
categoria = "Drivers internos"
icone = "bus"
descricao = "Percorre o barramento PCI e descobre os dispositivos e os recursos de cada um (portas, memória, interrupções)."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/pci.rs", "kernel/src/drivers/bus/pci_pnp.rs", "kernel/src/drivers/bus/device_tree.rs", "kernel/src/hal/pci_config.rs"]
testes = ["fase4", "storage", "basicdisplay", "usb"]
fase = "4"
notas = "Suporte de boot do próprio kernel: enumera as funções PCI no início da fase 1 (o driver ATA interno e os autotestes usam as funções), e com --pnp-root=internal faz a enumeração que no Windows é do pci.sys, criando um PDO por função, filhos de um PDO de barramento raiz (PCI_HAL\\PNP0A03\\0). Os PDOs respondem como o pci.sys: QUERY_ID com os formatos dele (DeviceID PCI\\VEN_v&DEV_d&SUBSYS_s&REV_r, as listas de HardwareIDs e CompatibleIDs e o InstanceID do slot), capacidades (a ponte de host RawDeviceOK, como o PciDevice_QueryCapabilities), requisitos e configuração de boot dos BARs (sem os do canal IDE legado; um BAR de memória pré-buscável com CM_RESOURCE_MEMORY_PREFETCHABLE), START_DEVICE que programa os BARs e liga I/O, memória e bus master, informação de barramento, os textos da tabela de mensagens do pci.sys, interrupções por mensagem (`pci_msi.rs`: com MSISupported na chave Interrupt Management do dispositivo, os requisitos pedem as mensagens MSI-X ou MSI no formato do pci.sys, e o START programa o endereço e o dado de cada mensagem na tabela MSI-X ou na capacidade MSI pelo HalGetMessageRoutingInfo, com os vetores que o PnP manager deu), BUS_INTERFACE_STANDARD (espaço de configuração e o adaptador de DMA da HAL) e PCI_BUS_INTERFACE_STANDARD, READ_CONFIG/WRITE_CONFIG. No boot comum a raiz da árvore é ACPI e quem enumera é o pci.sys real (veja acpi.sys e pci.sys)."

[[componente]]
nome = "Dispositivos da placa-mãe"
categoria = "Drivers internos"
icone = "chip"
descricao = "Descreve os dispositivos fixos do PC, como a controladora de teclado e mouse PS/2, para que os drivers os encontrem."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/motherboard.rs"]
testes = ["fase4"]
fase = "4"
notas = "Suporte de boot do próprio kernel: cria os PDOs do teclado (PNP0303) e do mouse (PNP0F13) PS/2 com as portas e as IRQs, papel que no Windows é do ACPI.sys, para a pilha do i8042prt.sys quando a raiz da árvore é o barramento PCI interno (--pnp-root=internal). No boot comum a raiz é ACPI e o teclado e o mouse são os ACPI\\PNP0303 e ACPI\\PNP0F13 que o acpi.sys real relata (veja acpi.sys e pci.sys)."

[[componente]]
nome = "Disco ATA (interno)"
categoria = "Drivers internos"
icone = "disk"
descricao = "Lê e grava setores dos discos do canal IDE primário (LBA28) por DMA de bus master da controladora PIIX3, com PIO como alternativa."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/storage/ata_pio.rs", "kernel/src/drivers/storage/ata_volume.rs"]
testes = ["fase4", "ata-falha"]
fase = "4"
notas = "Suporte de boot do próprio kernel, não um substituto do atapi.sys: é por ele que o kernel lê e grava o volume NTFS do segundo disco, de onde vêm o cng.sys, a ci.dll e os catálogos. No boot comum ele atende todo acesso a disco; com --storage=real a pilha de disco do Windows assume a controladora no fim da fase 1, depois de este driver ler o que o boot precisa. Um comando por vez no canal, sob o lock do canal (testado com leitores em outras CPUs), e prazos em tempo de relógio em vez de um número fixo de leituras do status, que sob carga no host dava por falho um flush ainda em andamento. As falhas seguem a pilha de disco do 19041 num disco IDE: o prazo de cada comando é o TimeOutValue do disk.sys (10 s, ou o valor de Services\\disk\\TimeOutValue) e o do FLUSH CACHE quatro vezes ele; um comando vencido leva o canal ao reset (o SRST do atapi.sys, com até 60 s para o BSY cair) e o pedido é mandado de novo até 4 vezes (o MaxNumberOfIoRetries do classpnp, ou o valor de Control\\Classpnp) antes de falhar. Cada tentativa que falha sai numa linha [ata] da serial com o comando, o drive, o LBA, os setores, o status, o registrador de erro, o status do bus master e o tempo. Também expõe o segundo disco como o dispositivo de volume \\Device\\AtaVolume1, que os file systems reais montam pelo IopMountVolume: VPB, DO_DIRECT_IO, a capacidade do IDENTIFY DEVICE e os IOCTLs de disco, armazenamento e mount manager da montagem; as escritas do file system ficam numa sobreposição em memória, porque o leitor NTFS do kernel continua dono do disco."

[[componente]]
nome = "hal.dll"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "A biblioteca de abstração de hardware do Windows, carregada como módulo do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/phase1.rs", "kernel/src/hal/private_dispatch.rs", "kernel/src/hal/public_dispatch.rs"]
testes = ["drivers"]
fase = "6"
notas = "No Windows 10 da máquina de build, a hal.dll não tem rotinas próprias nem ponto de entrada: são 91 encaminhamentos para o ntoskrnl. O OpenNT carrega a imagem real na fase 1 do boot e liga cada encaminhamento a um export do próprio kernel, que faz o trabalho da HAL. O kernel também publica a HalPrivateDispatchTable e a HalDispatchTable; nesta, o HalQuerySystemInformation é o HaliQuerySystemInformation (a classe HalDisplayBiosInformation responde HalDisplayEmulatedBios e as classes que o acpi.sys consulta, a BadIOAddrList com o tratador de 0xCF8, depurador, controladores secundários e limite de MSI, também respondem; as outras ainda dão STATUS_NOT_SUPPORTED), o HalInitPowerManagement entrega a HalAcpiDispatchTable e os outros 21 slots devolvem STATUS_NOT_SUPPORTED. Os x86Bios* que a hal.dll encaminha são a interface x86 BIOS do kernel: o BIOS de vídeo da máquina num emulador de x86 de modo real, como no Windows (veja dxgkrnl.sys e BasicDisplay.sys)."

[[componente]]
nome = "i8042prt.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "Driver da Microsoft para a controladora de teclado e mouse PS/2."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/io/pnp/install.rs"]
testes = ["teclado", "drivers", "shell", "bugcheck", "teclado-e-mouse"]
fase = "6"
notas = "O PnP o anexa aos PDOs PS/2 da placa-mãe, com START_DEVICE e as ISRs nativas conectadas às IRQs 1 e 12; no boot comum, é por ele que o shell recebe as teclas. Com o CrashOnCtrlScroll ligado nos parâmetros do serviço, o Ctrl direito com o Scroll Lock duas vezes faz o próprio driver chamar KeBugCheckEx(MANUALLY_INITIATED_CRASH), como no despejo manual do Windows (teste bugcheck). Sem os binários no build, o teclado usa o driver PS/2 interno."

[[componente]]
nome = "kbdclass.sys"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "Driver de classe de teclado: entrega as teclas pelo dispositivo \\Device\\KeyboardClass0."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/init/main.rs"]
testes = ["teclado", "drivers", "shell", "teclado-e-mouse"]
fase = "6"
notas = "Entra como filtro de classe sobre o i8042prt.sys; o serviço de teclado do kernel mantém um READ pendente em \\Device\\KeyboardClass0 e repassa as teclas ao shell."

[[componente]]
nome = "mouclass.sys"
categoria = "Drivers do Windows"
icone = "mouse"
descricao = "Driver de classe de mouse."
estado = "implementado"
caminhos = ["kernel/src/drivers/input/keyboard_stack.rs", "kernel/src/ntos/cm/hw_description.rs"]
testes = ["drivers", "teclado", "teclado-e-mouse"]
fase = "6"
notas = "Entra como filtro de classe sobre o i8042prt.sys e a pilha do mouse recebe START_DEVICE; nenhum programa consome o mouse ainda."

[[componente]]
nome = "wmilib.sys e WppRecorder.sys"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "Bibliotecas de export da Microsoft usadas pelos drivers de teclado, mouse e disco: a wmilib.sys atende o IRP_MJ_SYSTEM_CONTROL (WMI) e a WppRecorder.sys guarda o rastreamento WPP de cada driver (In-Flight Recorder)."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "xtask/src/windows_binaries.rs", "kernel/src/ntos/dbgk/wer.rs"]
testes = ["teclado", "drivers"]
fase = "6"
notas = "Carregam como drivers de export (DllInitialize) na primeira vez que um driver as importa: a wmilib.sys com o ataport.sys no boot, a WppRecorder.sys com o kbdclass.sys, o i8042prt.sys e o mouclass.sys; os imports desses drivers resolvem nos exports das imagens reais, e o ntoskrnl do OpenNT não publica nenhum nome delas. A WppRecorder.sys procura o RtlQueryModuleInformation pelo MmGetSystemRoutineAddress, que o kernel agora exporta, e importa o DbgkWerCaptureLiveKernelDump, que falha com STATUS_NOT_SUPPORTED como num Windows sem o werkernel.sys."

[[componente]]
nome = "atapi.sys e ataport.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Drivers da Microsoft para controladoras de disco IDE/ATA."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/io/pnp/install.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carregam no boot como serviço (o ataport.sys como biblioteca de import do atapi.sys, com DllInitialize) e o DriverEntry retorna sucesso: sc query atapi mostra RUNNING. Com --storage=real (teste storage) o PnP os liga aos dois canais IDE que o pciidex.sys relata (Internal_IDE_Channel, mshdc.inf [atapi_Inst]): AddDevice, START_DEVICE com as portas e a IRQ legadas de cada canal, IoConnectInterruptEx, IDENTIFY dos discos e do CD-ROM, PDOs IDE\\Disk... e IDE\\CdRom... nas BusRelations e leituras por DMA de bus master. No boot comum os discos continuam com o driver ATA interno."

[[componente]]
nome = "disk.sys e classpnp.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Driver de classe de disco: apresenta cada disco e cada partição ao resto do sistema."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/mm/sysload.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carregam no boot (o classpnp.sys como biblioteca de import do disk.sys, com DllInitialize) e o DriverEntry do disk.sys retorna sucesso: sc query disk mostra RUNNING. Com --storage=real (teste storage) o PnP instala os dois discos IDE pelo disk.inf (GenDisk) com o filtro de classe partmgr.sys do c_diskdrive.inf; o disk.sys cria \\Device\\Harddisk0\\DR0 e \\Device\\Harddisk1\\DR1, os dois discos terminam o START (o partmgr.sys lê o setor 0 e grava a assinatura de disco MBR num disco que não tem nenhuma) e as leituras do teste passam pelo disk.sys, pelo classpnp.sys e pelo ataport.sys até o disco. Com --storage=nvme (teste nvme) o disco é a LUN que o storport.sys relata no controlador NVMe: o disk.sys cria o \\Device\\Harddisk0\\DR0 e o partmgr.sys entrega a partição MBR ao volmgr.sys, que cria o \\Device\\HarddiskVolume1, iniciado com o volume.sys, e o ntfs.sys monta o volume."

[[componente]]
nome = "mountmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Mount Manager: dá nomes aos volumes e atribui as letras de unidade."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs"]
testes = ["drivers", "nvme"]
fase = "6"
notas = "Carrega no boot e o DriverEntry retorna sucesso (lê NoAutoMount do Registro; sc query mountmgr mostra RUNNING); a rotina de reinicialização (IoRegisterDriverReinitialization) roda depois dos drivers de sistema e liga a atribuição automática de letras. No boot comum nenhum volume chega a ele: as letras C: e D: são links que o próprio kernel cria para os seus sistemas de arquivos. Com --storage=nvme (teste nvme) o volume da partição, que o volmgr.sys cria e o volume.sys inicia, chega a ele pela interface do volume: o MountMgrMountedDeviceArrival consulta nome, identificador único e atributos GPT do volume, grava \\DosDevices\\E: no MountedDevices e cria o \\GLOBAL??\\E:. O WorkerThread que ele enfileira abre o \\Device\\VolumesSafeForWriteAccess (que o FsRtlInitSystem cria) e espera o smss sinalizá-lo; sem smss a espera não termina, como no NT, mas fica numa worker thread do sistema."

[[componente]]
nome = "cng.sys"
categoria = "Drivers do Windows"
icone = "lock"
descricao = "A criptografia do kernel do Windows (Cryptography Next Generation), usada por outros drivers e pelos programas."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/phase1.rs", "kernel/src/ntos/cm/cng_defaults.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carrega do volume NTFS na fase 1 do boot, roda o DriverEntry, registra a sua fonte de entropia e publica \\Device\\CNG. O vgk.sys o usa como biblioteca de import."

[[componente]]
nome = "ci.dll (Code Integrity)"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "A integridade de código do Windows: confere a assinatura de cada imagem de kernel antes de ela rodar."
estado = "implementado"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/se/code_integrity_information.rs", "kernel/src/ntos/io/file/zw.rs", "kernel/src/ntos/io/file/lifetime.rs"]
testes = ["watchdog"]
fase = "6"
notas = "A ci.dll real e o msrpc.sys, de que ela depende, carregam do volume NTFS; a CI inicializa, lê a política e valida cada imagem nova, pela assinatura embutida (vgk.sys) ou pelo catálogo da Microsoft que ela mesma procura em System32\\CatRoot (watchdog.sys); com ela ativa, os drivers carregados depois, como a pilha PS/2 (kbdclass.sys, i8042prt.sys e mouclass.sys, cujo catálogo também vai para o volume), também passam pela validação. Uma imagem sem catálogo é recusada com STATUS_INVALID_IMAGE_HASH, que chega ao SCM como o erro 577. Ao registrar uma recusa, a ci.dll lê FileObject->SectionObjectPointer->ImageSectionObject sem conferir: os arquivos dos volumes do kernel publicam o SECTION_OBJECT_POINTERS do arquivo, como um file system do NT, e o kernel recusa com STATUS_INVALID_FILE_FOR_SECTION uma imagem sem ele em vez de entregá-la à ci.dll. Só é ativada no boot com --start-driver; no boot comum, os drivers do bundle carregam sem essa verificação."

[[componente]]
nome = "vgk.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver anti-cheat de terceiros, usado como alvo de compatibilidade."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/init/main.rs"]
notas = "Testado em WHPX com `--start-driver=vgk --trace-driver-api` (versão 1.19.2). A ci.dll original valida a imagem pela assinatura embutida; o DriverEntry resolve 252 funções do ntoskrnl pela própria busca na tabela de exports, todas atendidas pelo OpenNT. Depois da última busca, sem chamar mais nenhuma API do kernel, o código ofuscado do anticheat registra o erro E00001AC no próprio log, e o DriverEntry desiste com 0xC000007A. Essa verificação do ambiente é do anticheat e passar por ela está fora do escopo do projeto; o trabalho no vgk para aqui. O `--trace-driver-api` mostra o log do vgk em texto (`texto:`) e cada nome procurado (`procura:`). O binário nunca entra no repositório: o build o lê de OPENNT_VGK_SYS ou de vgk.sys na raiz."

[[componente]]
nome = "watchdog.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver inbox da Microsoft (watchdog) do qual o dxgkrnl.sys e o win32k.sys importam funções: uma dependência da pilha de vídeo."
estado = "implementado"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/io/file/zw.rs"]
testes = ["watchdog"]
fase = "6"
notas = "Carrega e roda com `--start-driver=watchdog`: DRIVER_START_COMPLETED state=4 win32=0 ntstatus=0x0. Diferente do vgk (assinado embutido), ele é assinado por catálogo: o Code Integrity valida o hash da imagem contra o `.cat` da Microsoft que a própria ci.dll enumera em `CatRoot`. O DriverEntry executa e retorna sucesso. No boot comum ele não é iniciado (Start=3, sob demanda)."

[[componente]]
nome = "KMDF (WdfLdr.sys e Wdf01000.sys)"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "O Kernel-Mode Driver Framework da Microsoft: a WdfLdr.sys liga cada driver KMDF ao runtime Wdf01000.sys, que implementa o framework. Cerca de 65 drivers KMDF desta instalação (msisadrv, cdrom, ucx01000, winusb, hidi2c, sercx, spbcx, acpidev...) já têm todos os imports do ntoskrnl atendidos e dependem dele para carregar."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/cm/service/driver.rs", "kernel/src/ntos/cm/service/inbox_drivers.rs", "xtask/src/windows_binaries.rs"]
testes = ["kmdf", "basicdisplay", "usb"]
fase = "6"
notas = "Roda com `--start-driver=msisadrv`: DRIVER_START_COMPLETED name=msisadrv state=4 win32=0 ntstatus=0x0. Os binários reais vão para o volume NTFS com os catálogos da Microsoft que os assinam, e as chaves de serviço do Wdf01000 e do msisadrv têm os valores desta instalação (só o Start fica 3, para o boot comum não subir o framework). O Code Integrity valida o msisadrv.sys; a WdfLdr.sys carrega como biblioteca de import (DllInitialize); o WdfVersionBind do driver acha o serviço da biblioteca em Control\\Wdf\\Kmdf\\KmdfLibrary\\Versions e chama o ZwLoadDriver do Wdf01000, cujo ImagePath relativo (system32\\drivers\\Wdf01000.sys) o kernel resolve sob o \\SystemRoot. O Wdf01000.sys e a SleepStudyHelper.sys que ele importa (com a WppRecorder.sys) passam pelo Code Integrity e todos os imports resolvem no ntoskrnl; o DriverEntry do runtime cria \\Device\\KMDF0, se registra na WdfLdr (que o abre pelo IoGetDeviceObjectPointer, com o IRP_MJ_CREATE atendido pelo próprio runtime), lê as configurações, registra os provedores ETW/WPP, o WMI e os callbacks de bugcheck e grava a versão no Registro. O bind registra o cliente e devolve a tabela de funções, e o WdfDriverCreate do msisadrv tem sucesso (extensão do DRIVER_OBJECT, Parameters\\Wdf lido). Pela árvore do PnP (com `--display=basic` ou `--storage=real`), o machine.inf instala o msisadrv.sys na ponte PCI-ISA do QEMU (PCI\\CC_0601, seção MSISADRV): o PnP carrega o driver, o AddDevice do KMDF (o do runtime, que o WdfDriverCreate instala) cria e anexa o FDO e o START_DEVICE passa pela máquina de estados PnP do framework e conclui com sucesso (teste basicdisplay, KMDF_PNP_OK). Com --usb (teste usb), o usbxhci.sys com a extensão de classe ucx01000.sys e o usbhub3.sys sobem pelo framework: DMA pelo adaptador da versão 3 da HAL, registro no power framework pelo PO_FX_DEVICE_V2 e a tabela de notificação do WDF pela classe WdfNotifyRoutinesClass do WmiQueryTraceInformation. O VfIsRuleClassEnabled, que o runtime procura pelo MmGetSystemRoutineAddress, ainda não existe; sem ele o runtime segue com o verificador desligado."

[[componente]]
nome = "ksecdd.sys"
categoria = "Drivers do Windows"
icone = "lock"
descricao = "O driver de segurança do kernel do Windows (\\Device\\KsecDD), usado por outros drivers e pelos serviços de segurança."
estado = "implementado"
caminhos = ["kernel/src/ntos/ex/extension_host.rs", "kernel/src/ntos/se/extension_hosts.rs", "kernel/src/ntos/se/logon_session.rs"]
testes = ["ksecdd"]
fase = "6"
notas = "Carrega e roda com `--start-driver=ksecdd`: DRIVER_START_COMPLETED state=4 win32=0 ntstatus=0x0. Tem assinatura embutida, validada pelo Code Integrity real, e importa do ntoskrnl, da hal.dll e do msrpc.sys. O DriverEntry liga a extensão de autorização ao host do kernel (ExRegisterExtension, id 2, um dos hosts de extensão que o kernel registra na fase 1, como no Windows), registra a notificação de criação de processos (PsSetCreateProcessNotifyRoutineEx2), conversa com o cng.sys real por IOCTLs do \\Device\\CNG, cria o monitor de silos e registra os contadores de desempenho (PcwRegister). Os contadores são do pcw.sys, que tem a chave de serviço sob demanda e ainda não completa o DriverEntry (o wdmlib dele abre o próprio DEVICE_OBJECT por ObOpenObjectByPointer, que o Object Manager do OpenNT ainda não faz para dispositivos); com o pcw fora do boot, os Pcw* devolvem sucesso com handle nulo, como num Windows com o pcw desligado. No boot comum ele não é iniciado (sob demanda; no Windows é de boot)."

[[componente]]
nome = "null.sys"
categoria = "Drivers do Windows"
icone = "io"
descricao = "O driver do \\Device\\Null do Windows: leituras terminam em fim de arquivo e escritas são aceitas inteiras."
estado = "implementado"
caminhos = ["kernel/src/ntos/cm/service/inbox_drivers.rs", "kernel/src/ntos/ps/user/device_io.rs", "kernel/src/ntos/test/boot_drivers.rs"]
testes = ["null"]
fase = "6"
notas = "Carrega e roda com `--start-driver=null`: DRIVER_START_COMPLETED state=4 win32=0, validado pelo catálogo da Microsoft. A chave Null tem os valores da instalação (Type 1, ErrorControl 1, Group Base, Tag 1, sem ImagePath, carregado de \\SystemRoot\\System32\\Drivers\\Null.sys como no IopLoadDriver), com Start 3 em vez de 1. O \\Device\\Null é aberto por um processo de teste: a leitura dá STATUS_END_OF_FILE e a escrita conclui com o tamanho pedido, pelo despacho do driver; o dispositivo não tem DO_BUFFERED_IO nem DO_DIRECT_IO, então o NtReadFile/NtWriteFile manda IRPs neither, com o buffer de usuário em Irp->UserBuffer. O caminho rápido (Fast I/O) que o driver oferece para handles síncronos ainda não é usado pelo NtReadFile."

[[componente]]
nome = "beep.sys"
categoria = "Drivers do Windows"
icone = "play"
