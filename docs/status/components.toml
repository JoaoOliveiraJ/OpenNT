fase = "4"
notas = "Suporte de boot, não o ntfs.sys: monta no dispositivo \\Device\\KernelVolume1 (o D: e o destino de \\SystemRoot) o volume que o xtask gera no segundo disco IDE, lido pelo driver ATA interno, de onde vêm o cng.sys, a ci.dll, o catálogo de assinaturas e as tabelas NLS. O dispositivo tem VPB montado pelo file system embutido do kernel, e os FILE_OBJECTs dos arquivos dele carregam DeviceObject, Vpb e o caminho no volume, como os de qualquer volume. Os nomes que ele grava seguem o espaço de nomes do NTFS (8.3 em Win32+DOS, os demais em POSIX). Um recurso compartilhado/exclusivo por drive (o papel do Vcb->Resource) separa leituras de transações, então nenhuma CPU lê no meio de um commit. Uma transação guarda só as cópias dos setores do $Bitmap e do $BITMAP do $MFT que muda; o commit grava e aplica essas cópias, e um aborto as descarta, sem copiar o bitmap inteiro. As falhas ocasionais de escrita da suíte com 4 CPUs vinham do driver ATA, que desistia de um FLUSH CACHE lento no host; a estressa de disco da fase 7 cobre o caminho."

