notas = "Carrega em todo boot como serviço de sistema, com a chave da instalação (Type 2, Start 1, grupo File system, sem ImagePath, a subchave Aliases), e o DriverEntry cria \\Device\\NamedPipe; o \\??\\PIPE vem do DOS Devices do Session Manager (o smss o cria no boot dele; no boot comum, a fase 0). Os programas falam com ele pelas chamadas de sistema do Windows, com o I/O Manager montando os IRPs como o ntoskrnl: NtCreateNamedPipeFile (IRP_MJ_CREATE_NAMED_PIPE com o NAMED_PIPE_CREATE_PARAMETERS), a abertura do cliente por NtCreateFile/NtOpenFile (o npfs.sys guarda o PID dele pela thread do IRP), NtReadFile/NtWriteFile de neither I/O, NtFsControlFile (LISTEN, WAIT na raiz, PEEK, TRANSCEIVE, GET_CONNECTION_ATTRIBUTE, QUERY_CLIENT_PROCESS, DISCONNECT) e as classes FilePipeInformation e FilePipeLocalInformation; as leituras que ficam pendentes recebem os dados pelo SystemBuffer que o próprio driver aloca, copiado na conclusão. O smss real cria por ele os prefixos protegidos. Ainda não atendidos pelo I/O Manager: a rotina de APC de usuário dos serviços de I/O e a porta de conclusão do arquivo."

