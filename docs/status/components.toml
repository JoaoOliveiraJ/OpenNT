"ntos/init/phase0" = "ainda não faz tudo o que a fase 0 do NT faz"
"ntos/init/phase1" = "faz I/O Manager, hal.dll, NTFS, PCI, drivers de boot e cng.sys; o resto da fase 1 do NT ainda falta"
"ntos/ps/user/state" = "só a sondagem de endereços de usuário"
"ntos/test/self_test" = "subconjunto"
"ntos/test/dispatcher" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/apc_regions" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/handle_table" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/ex_rundown" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/ex_push_lock" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/alert_thread" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/process_handles" = "chamadas diretas no lugar dos exports (fase 6)"
"ntos/test/primary_tokens" = "chamadas diretas no lugar dos exports (fase 6)"

