testes = ["teclado", "drivers", "shell"]
fase = "6"
notas = "Entra como filtro de classe sobre o i8042prt.sys; o serviço de teclado do kernel mantém um READ pendente em \\Device\\KeyboardClass0 e repassa as teclas ao shell."

[[componente]]
nome = "mouclass.sys"
