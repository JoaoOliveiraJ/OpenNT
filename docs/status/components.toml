[[componente]]
nome = "wmilib.sys e WppRecorder.sys"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "Bibliotecas de export da Microsoft usadas pelos drivers de teclado, mouse e disco: a wmilib.sys atende o IRP_MJ_SYSTEM_CONTROL (WMI) e a WppRecorder.sys guarda o rastreamento WPP de cada driver (In-Flight Recorder)."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/sysload.rs", "xtask/src/windows_binaries.rs", "kernel/src/ntos/dbgk/wer.rs"]
testes = ["teclado", "drivers"]
fase = "6"
notas = "Carregam como drivers de export (DllInitialize) na primeira vez que um driver as importa: a wmilib.sys com o ataport.sys no boot, a WppRecorder.sys com o kbdclass.sys, o i8042prt.sys e o mouclass.sys; os imports desses drivers resolvem nos exports das imagens reais, e o ntoskrnl do OpenNT não publica nenhum nome delas. A WppRecorder.sys procura o RtlQueryModuleInformation pelo MmGetSystemRoutineAddress, que o kernel agora exporta, e importa o DbgkWerCaptureLiveKernelDump, que falha com STATUS_NOT_SUPPORTED como num Windows sem o werkernel.sys."

[[componente]]
nome = "atapi.sys e ataport.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Drivers da Microsoft para controladoras de disco IDE/ATA."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/io/pnp.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carregam no boot como serviço (o ataport.sys como biblioteca de import do atapi.sys, com DllInitialize) e o DriverEntry retorna sucesso: sc query atapi mostra RUNNING. Mas o PnP ainda não liga o atapi ao controlador IDE (PCI 8086:7010): o AddDevice nunca é chamado, não há START_DEVICE e nenhum canal ou disco é enumerado. A tabela de associação do kernel já tem o id do controlador, mas o boot não a percorre para o barramento PCI, e o PDO PCI não responde QUERY_INTERFACE nem outros pedidos PnP além de START_DEVICE, REMOVE_DEVICE e QUERY_ID. Os discos são lidos pelo driver ATA interno, que monta o NTFS antes de estes drivers carregarem."

[[componente]]
nome = "disk.sys e classpnp.sys"
categoria = "Drivers do Windows"
icone = "disk"
descricao = "Driver de classe de disco: apresenta cada disco e cada partição ao resto do sistema."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs", "kernel/src/ntos/mm/sysload.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carregam no boot (o classpnp.sys como biblioteca de import do disk.sys, com DllInitialize) e o DriverEntry do disk.sys retorna sucesso: sc query disk mostra RUNNING. Nenhum disco chega a ele: sem o atapi.sys anexado ao controlador, não existe PDO de disco IDE e o AddDevice do disk.sys nunca é chamado."

[[componente]]
nome = "mountmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Mount Manager: dá nomes aos volumes e atribui as letras de unidade."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/service/system_drivers.rs"]
testes = ["drivers"]
fase = "6"
notas = "Carrega no boot e o DriverEntry retorna sucesso (lê NoAutoMount do Registro; sc query mountmgr mostra RUNNING). Nenhum volume chega a ele: as letras C: e D: são links que o próprio kernel cria para os seus sistemas de arquivos."

[[componente]]
nome = "cng.sys"
