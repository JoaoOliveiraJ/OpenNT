[[componente]]
nome = "win32k.sys, win32kbase.sys e win32kfull.sys"
categoria = "Drivers do Windows"
icone = "window"
descricao = "O subsistema de janelas e gráficos do Windows no kernel (USER e GDI), carregado como imagem de sistema."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ex/system_information.rs", "kernel/src/ntos/mm/session_image.rs", "kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/ps/win32.rs", "kernel/src/ntos/po/power_information.rs", "kernel/src/ntos/test/session_driver_support.rs"]
testes = ["win32k", "win32k-display"]
fase = "8"
notas = "Os binários reais carregam como no Windows, com o kernel dando só o suporte. Com --initial-process=smss, o smss da sessão lê o Kmode (\\SystemRoot\\System32\\win32k.sys) e o carrega pela SystemExtendServiceTableInformation: o NtSetSystemInformation de modo usuário confere o mestre de sessão, o SeLoadDriverPrivilege e o caminho exato, e o kernel carrega a imagem no espaço de sessão, converte a W32pServiceTable gravada com RVAs no disco e chama o DriverEntry, cujo DriverUnload libera os callouts da sessão. O win32k.sys resolve os contratos de API set pelo ApiSetMap da PEB do smss e carrega o win32kbase.sys e o win32kfull.sys como imagens de sessão (o hidparse.sys antes, no espaço de sistema, pelas classes 54 e 27); o import de uma imagem já carregada a acha na lista de imagens carregadas e retém o LoadCount dela, e cada sessão conta as cargas de uma imagem de sessão. O Win32kBaseDriverEntry cria \\Driver\\Win32k, conecta-se ao dxgkrnl.sys (que agora sobe com os drivers de sistema nesse boot, como o Start 1 da instalação), publica a tabela 1 e a filtro do KeServiceDescriptorTableShadow e os callouts Win32, e inicializa o GDI e o USER: para isso o kernel ganhou a seção nomeada com OBJ_KERNEL_EXCLUSIVE, PagedPoolSession com o bit NX e com quota, o MmPageEntireDriver de imagens de sessão, as listas LOOKASIDE_LIST_EX com o AllocateEx e o FreeEx de dois argumentos e o ZwPowerInformation de SessionPowerInit, SessionPowerCleanup e SystemVideoState. O DriverEntry volta com sucesso (marcador WIN32K_LOADED, teste win32k). A conversão em thread GUI (PsConvertToGuiThread) segue a ordem do 19041: o callout de processo sempre, o GuiThread ligado antes do callout de thread e só o STATUS_SUCCESS repete a busca no Shadow. Com ele, a thread do csrss.exe vira thread GUI (os callouts de processo e de thread do win32k, que consultam o token pelas classes escalares do SeQueryInformationToken) e o NtGdiInit volta TRUE; o user32, o gdi32 e o gdi32full inicializam no csrss, mas o cfgmgr32.dll, que o winsrvext.dll importa pelo api-ms-win-devices-swdevice, recusa a carga sem o \\Device\\DeviceApi\\CMApi (a interface de dispositivos do PnP do ntoskrnl, que o OpenNT ainda não cria): a carga do winsrvext falha, o winsrv.dll volta STATUS_NOT_IMPLEMENTED antes do NtUserInitialize e o csrss sai com esse status. Sem eles, no boot comum, a tabela 1 do KeServiceDescriptorTableShadow fica vazia: uma syscall gráfica tenta converter a thread em GUI, que falha sem os callouts, e devolve STATUS_INVALID_SYSTEM_SERVICE. O suporte Rtl, Ob, Ps e ALPC que a família importa já existia (nenhum import do ntoskrnl falta)."

[[componente]]
nome = "acpi.sys e pci.sys"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "O driver ACPI da Microsoft como raiz da árvore de dispositivos e o driver do barramento PCI sobre ele (--pnp-root=acpi)."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/acpi_stack.rs", "kernel/src/hal/pnp.rs", "kernel/src/hal/acpi_pm.rs", "kernel/src/hal/system_information.rs", "kernel/src/hal/interrupt_lines.rs", "kernel/src/hal/interrupt_targets.rs", "kernel/src/ntos/cm/arbiters.rs"]
testes = ["acpi"]
fase = "8"
notas = "Com --pnp-root=acpi o acpi.sys real é a raiz da árvore: a HAL relata ROOT\\ACPI_HAL\\0000 e o AcpiRootPdo ACPI_HAL\\PNP0C08\\0 como o HalpDispatchPnp (ids, capacidades, os vetores da IDT de dispositivos como requisitos e configuração de boot), o acpi.inf o instala (serviço ACPI com Tag 2 e Group Core), o HalInitPowerManagement entrega a HalAcpiDispatchTable (tabelas do firmware pelo cache da HAL, FACS mapeada, registradores de PM da FADT, configuração PCI, o modelo APIC e as linhas dos IOAPICs da MADT), o HalQuerySystemInformation responde as classes que ele consulta (BadIOAddrList com o tratador de 0xCF8, depurador, controladores secundários, limite de MSI), o carregador deixa o MultifunctionAdapter 'ACPI BIOS' com a RSDT e o mapa E820 e a hive SYSTEM tem o Control\\Arbiters da instalação. O DriverEntry, o AddDevice e o START do acpi.sys têm sucesso: o interpretador AML dele carrega a DSDT do QEMU, entra no modo ACPI, conecta a SCI (GSIV 9, vetor 0x29, pelos dados de conexão que ele grava no PDO e que o IoConnectInterruptEx LINE_BASED usa, como o IopConnectLineBasedInterrupt) e as BusRelations da raiz são ACPI\\PNP0A03\\0, ACPI\\PNP0103, ACPI\\ACPI0010 e ACPI\\FixedButton, com o mesmo prefixo de instância (2&daba3ff&0) da instalação desta máquina. O nó PNP0A03 recebe o pci.sys pelo pci.inf; a pshed.dll carrega como DLL de modo kernel com os imports atendidos (KeGetEffectiveIrql, RtlPcToFileName, WheaLogInternalEvent, as variáveis de ambiente Ex e o HalBugCheckSystem). Falta: o DriverEntry do pci.sys devolve STATUS_NOT_FOUND no PciGetSystemWideHackFlagsFromEM, porque o Errata Manager não carrega o banco do errata.inf (as regras IgnorePciRootBusNumberRange e afins, avaliadas contra a FADT); os dispositivos sem driver do machine.inf (NO_DRV: HPET, contêiner de processadores, botão fixo) ficam sem instalação; o i8042prt.sys ainda sobe nos PDOs da placa-mãe do kernel e não nos PNP0303/PNP0F13 que o acpi.sys relataria sob a ponte ISA."

[[componente]]
nome = "dxgkrnl.sys e BasicDisplay.sys"
categoria = "Drivers do Windows"
icone = "monitor"
descricao = "O núcleo gráfico do Windows (DirectX Graphics Kernel) e o driver de vídeo básico da Microsoft, que juntos dão a tela gráfica."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/graphics_defaults.rs", "kernel/src/ntos/inbv/display.rs", "kernel/src/ntos/ttm/device.rs", "kernel/src/drivers/video/display_stack.rs", "kernel/src/ntos/bgk/graphics_information.rs", "kernel/src/hal/x86bios/mod.rs", "kernel/src/hal/system_information.rs"]
testes = ["dxgkrnl", "basicdisplay", "win32k-display", "fase6"]
fase = "8"
notas = "O dxgkrnl.sys real carrega e roda com `--start-driver=DXGKrnl` (a chave do serviço tem os valores do Windows, com Start=3): o Code Integrity o valida pelo catálogo, os imports no ntoskrnl, no watchdog.sys e na WMILIB.SYS resolvem (nenhum import do ntoskrnl falta) e o DriverEntry retorna sucesso (DRIVER_START_COMPLETED state=4), criando \\Device\\DxgKrnl com a segurança SDDL da wdmsec. Para isso o kernel ganhou Control\\GraphicsDrivers, Control\\Video e Control\\Class da instalação, o ZwPowerInformation(PlatformInformation), o ObOpenObjectByPointer de DEVICE_OBJECTs e o ReturnLength local da consulta da CI. As duas inscrições WNF do DriverEntry (nomes do SRUM e do relatório de uso) dão STATUS_OBJECT_NAME_NOT_FOUND, porque o OpenNT não instala esses nomes; o driver segue sem elas, como no Windows. O dxgmms2.sys, carregado quando um adaptador inicia, e o cdd.dll já têm todos os imports do ntoskrnl. Com `--display=basic` (teste basicdisplay) o BasicDisplay.sys real sobe pelo PnP no adaptador VGA do QEMU: o display.inf o instala (PCI\\CC_0300, seção MSBDA, classe Display; a chave do serviço tem os valores da instalação, com o ImagePath no repositório de drivers e Start 3), o DriverEntry dele carrega o dxgkrnl.sys pelo ZwLoadDriver (sem `--start-driver`) e se registra nele pelo DxgkInitialize, o DpiAddDevice cria o FDO de vídeo e chama o DxgkDdiAddDevice do miniport, e o START_DEVICE (DpiFdoHandleStartDevice) passa pelo barramento com as listas bruta e traduzida e conclui com sucesso. O dxgkrnl não inicia o adaptador nesse START: o DpiFdoStartAdapterThread, com o DxgkDdiStartDevice do miniport, espera a criação da primeira sessão, que o win32k.sys anuncia no NtUserInitialize (watchdog!SMgrNotifySessionChange -> DxgkNotifySessionStateChange -> DpiSessionCreateCallback). Esse é o próximo passo, junto com o win32k. A tela de POST que o dxgkrnl procura na classe SystemBootGraphicsInformation (126) não existe no OpenNT (o vídeo de boot é o modo texto VGA): a consulta devolve STATUS_UNSUCCESSFUL, como o BgkQueryBootGraphicsInformation do NT sem biblioteca gráfica de boot. Sem tela de POST, o BasicDisplay usa o BIOS de vídeo (VBE) pelos x86Bios* da HAL, e esse caminho já responde de verdade: a interface x86 BIOS do kernel (`hal/x86bios`) executa o BIOS de vídeo do QEMU (a ROM em C0000h) num emulador de x86 de modo real, com a IVT e a BDA copiadas da máquina, o buffer de transferência em 2000:0000 e as portas no hardware, e o HalQuerySystemInformation(HalDisplayBiosInformation) informa o BIOS emulado, que é o que o BasicDisplay consulta antes de tentar o VBE. O autoteste da fase 6 conversa com o BIOS como o BasicDisplay: 4F00h devolve 'VESA' e os 93 modos do QEMU, 4F01h de um modo 1024x768x32 dá o framebuffer linear no BAR0 do adaptador (linha de 4096 bytes), 4F02h liga o modo (os registradores de modo do adaptador e da VGA confirmam), 4F03h o devolve, e o INT 10h AX=0003h volta ao modo texto. Com --display=basic o boot deixa o vídeo de boot que o carregador do Windows deixa num boot por BIOS (bgk/graphics_information.rs: o modo VBE 1024x768x32 com framebuffer linear, que o SystemBootGraphicsInformation descreve), e com o smss real a sessão do win32k faz o dxgkrnl iniciar o adaptador: o DxgkDdiStartDevice do BasicDisplay usa esse framebuffer e o serviço de BDD do dxgkrnl (que reconhece o driver pelo DriverName \\Driver\\BasicDisplay), e o PoDisableSleepStates devolve NTSTATUS com o handle por ponteiro, como no NT; o DpiFdoStartAdapter cria o \\Device\\Video0 e habilita a interface de chegada de dispositivo de vídeo (ADAPTER_STARTED, teste win32k-display). O InitVideo do win32k enumera o \\Device\\Video0 mas ainda não monta a configuração de exibição (VIDEO_DRIVER_INIT_FAILURE, 0xB4)."

[[componente]]
nome = "ntfs.sys, fastfat.sys e fltmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Os drivers de sistema de arquivos do Windows (NTFS e FAT) e o Filter Manager, base dos filtros de sistema de arquivos."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/io/file_system.rs", "kernel/src/ntos/io/parse.rs", "kernel/src/drivers/storage/ata_volume.rs", "kernel/src/ntos/test/file_system_mount.rs", "kernel/src/ntos/test/fs_driver_imports.rs", "xtask/src/ntfs_image.rs"]
testes = ["ntfs"]
fase = "8"
notas = "O ntfs.sys real monta o volume NTFS 3.1 do segundo disco IDE e serve arquivos (teste ntfs): com `--start-driver=ntfs` o carregador resolve o clfs.sys, o clipsp.sys, o ksecdd.sys e o fltmgr.sys (cada um validado pelo Code Integrity pelo catálogo), o DriverEntry cria o CDO \\Ntfs e o FltMgr se anexa a ele pela notificação de registro (state=4). A abertura de \\Device\\AtaVolume1\\HELLO.TXT monta o volume pelo IopMountVolume: o NtfsFsdFileSystemControl posta a montagem à FSP e o FltMgr espera; o NtfsMountVolume vai até o fim (LFS, reinício e checkpoint, $Secure, $Extend, $UpCase) e os streams internos que ele solta ficam para o lazy writer do Cache Manager, de onde vem o IRP_MJ_CLOSE deles depois, como no Windows. O arquivo é aberto e lido pelo Cache Manager; um arquivo novo é criado, gravado, fechado, reaberto e lido de volta pelo ntfs.sys, com o FltMgr na pilha do volume. Para isso: o volume do kernel saiu da raiz do namespace (\\NTFS colidia com o CDO \\Ntfs) para o seu dispositivo \\Device\\KernelVolume1, e os arquivos dos volumes do kernel ganharam DeviceObject e VPB (o IoGetBaseFileSystemDeviceObject do FltMgr); todo IRP_MJ_CREATE leva o IO_SECURITY_CONTEXT (o IoGetDeviceObjectPointer de \\Device\\NamedPipe do FltMgr derrubava o npfs.sys); o ObQueryNameString acha objetos nomeados na raiz; os itens de trabalho não rodam um dentro do outro e cada drenagem só roda os que já estavam na fila (o item de pós-montagem do NTFS esperava o DeviceLock que a montagem retém); o CcUninitializeCacheMap e o lazy writer seguem o NT; o ExAcquireFastMutexUnsafe não exige APCs desligadas, como no ntoskrnl (o LfsFlushToLsn entra com elas ligadas); o ExDeleteResourceLite tira o recurso da lista do sistema mesmo com dono, como no ntoskrnl (o checkpoint do NTFS apaga a tabela de reinício, que mora na pilha dele, ainda adquirida, e o recurso esquecido na lista fazia as inserções seguintes gravarem na pilha de outra chamada: a falha intermitente do teste no despachante nativo); e o volume do xtask grava os nomes 8.3 no espaço Win32+DOS e os demais no POSIX (um nome só Win32 sem o par curto é corrupção para o ntfs.sys). O fastfat.sys vai para o volume com o catálogo dele; o início dele pelo `--start-driver` sobre um volume FAT ainda não foi exercitado."

