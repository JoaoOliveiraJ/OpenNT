testes = ["fase4"]
fase = "4"
notas = "Suporte de boot do próprio kernel: faz a enumeração que no Windows é do pci.sys, que não é carregado, e cria um PDO por função com os recursos dela. O PDO responde só START_DEVICE, REMOVE_DEVICE e QUERY_ID (sempre com o HardwareID, qualquer que seja o tipo de id pedido); os outros pedidos PnP, como QUERY_INTERFACE, voltam STATUS_NOT_SUPPORTED."

[[componente]]
nome = "Dispositivos da placa-mãe"
categoria = "Drivers internos"
