testes = ["fase4"]
fase = "4"
notas = "Suporte de boot, não o ntfs.sys: monta como D: o volume que o xtask gera no segundo disco IDE, lido pelo driver ATA interno, de onde vêm o cng.sys, a ci.dll, o catálogo de assinaturas e as tabelas NLS. Um recurso compartilhado/exclusivo por drive (o papel do Vcb->Resource) separa leituras de transações, então nenhuma CPU lê no meio de um commit. As falhas ocasionais de escrita da suíte com 4 CPUs vinham do driver ATA, que desistia de um FLUSH CACHE lento no host; a estressa de disco da fase 7 cobre o caminho."

