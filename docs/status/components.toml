testes = ["drivers"]
fase = "6"
notas = "Carrega do volume NTFS na fase 1 do boot, roda o DriverEntry, registra a sua fonte de entropia e publica \\Device\\CNG. O vgk.sys o usa como biblioteca de import."

[[componente]]
nome = "ci.dll (Code Integrity)"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "A integridade de código do Windows: confere a assinatura de cada imagem de kernel antes de ela rodar."
estado = "implementado"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/se/code_integrity_information.rs", "kernel/src/ntos/io/file/zw.rs"]
testes = ["watchdog"]
fase = "6"
notas = "A ci.dll real e o msrpc.sys, de que ela depende, carregam do volume NTFS; a CI inicializa, lê a política e valida cada imagem nova, pela assinatura embutida (vgk.sys) ou pelo catálogo da Microsoft que ela mesma procura em System32\\CatRoot (watchdog.sys); com ela ativa, os drivers carregados depois, como o kbdclass.sys, também passam pela validação. Só é ativada no boot com --start-driver; no boot comum, os drivers do bundle carregam sem essa verificação."

[[componente]]
nome = "vgk.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver anti-cheat de terceiros, usado como alvo de compatibilidade."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/init/main.rs"]
notas = "Testado em WHPX com `--start-driver=vgk --trace-driver-api` (versão 1.19.2). A ci.dll original valida a imagem pela assinatura embutida; o DriverEntry resolve 252 funções do ntoskrnl pela própria busca na tabela de exports, todas atendidas pelo OpenNT. Depois da última busca, sem chamar mais nenhuma API do kernel, o código ofuscado do anticheat registra o erro E00001AC no próprio log, e o DriverEntry desiste com 0xC000007A. Essa verificação do ambiente é do anticheat e passar por ela está fora do escopo do projeto; o trabalho no vgk para aqui. O `--trace-driver-api` mostra o log do vgk em texto (`texto:`) e cada nome procurado (`procura:`). O binário nunca entra no repositório: o build o lê de OPENNT_VGK_SYS ou de vgk.sys na raiz."

[[componente]]
nome = "watchdog.sys"
categoria = "Drivers do Windows"
icone = "shield"
descricao = "Driver inbox da Microsoft (watchdog) do qual o dxgkrnl.sys e o win32k.sys importam funções: uma dependência da pilha de vídeo."
estado = "implementado"
caminhos = ["kernel/src/ntos/se/code_integrity.rs", "kernel/src/ntos/io/file/zw.rs"]
testes = ["watchdog"]
fase = "6"
notas = "Carrega e roda com `--start-driver=watchdog`: DRIVER_START_COMPLETED state=4 win32=0 ntstatus=0x0. Diferente do vgk (assinado embutido), ele é assinado por catálogo: o Code Integrity valida o hash da imagem contra o `.cat` da Microsoft que a própria ci.dll enumera em `CatRoot`. O DriverEntry executa e retorna sucesso. No boot comum ele não é iniciado (Start=3, sob demanda)."

[[componente]]
nome = "ksecdd.sys"
