"win32/ci_view_experiment" = "experimento de diagnóstico"
"win32/driver_diagnostics" = "diagnóstico; substituído pelo --trace-driver-api"
"win32/export_sentinels" = "diagnóstico"
"win32/hal_data_diagnostic" = "diagnóstico"
"win32/hal_reference_experiment" = "experimento de diagnóstico"
"win32/private_mm_diagnostic" = "diagnóstico"
"win32/user_call_evidence" = "diagnóstico"
"win32/win32" = "kernel32 mínimo de bring-up; o alvo são as DLLs reais do Windows"
"ntos/ke/tracer" = "diagnóstico fora do escopo"

# ---- o que roda (página O que roda) -------------------------------------------
#
# Cada [[roda]] é um binário real da Microsoft (ou um marco) que o OpenNT
# exercita. O estado sai dos dados:
#   - sem `teste`: "Não roda";
#   - um teste com espera_falha = true: "Parcial";
#   - senão, nos grupos driver e programa, o componente da mesma categoria
#     cujo nome cita o binário decide: "implementado" = "Roda", qualquer
#     outro estado = "Parcial"; sem componente (e nos marcos) = "Roda".
# `estado = "roda" | "parcial" | "nao roda"` só onde os dados não dizem.
# Campos: nome (binários separados por vírgula e "e"), grupo (marco, driver
# ou programa), teste (um id ou uma lista; o primeiro dá a captura de tela),
# faz (uma linha: o que funciona) e para (opcional: onde para).

[marco]
atual = "Na sessão 0, o wininit.exe real cria o services.exe e o lsass.exe reais. O lsass instala o banco de política e o banco de contas de um sistema novo, inicializa a auditoria, as sessões de logon, as credenciais e os pacotes de segurança e publica as interfaces RPC do LSA; o services.exe consulta o domínio da conta no lsass, publica a interface RPC do gerenciador de serviços e cria os svchost dos grupos DcomLaunch e rpcss com o token do logon de serviço; sobem o Power, o DcomLaunch, o RpcEptMapper e o RpcSs, e o Local Session Manager sobe no svchost do DcomLaunch e sinaliza o TermSrvReadyEvent. Na sessão 1, o winlogon.exe real registra o processo de logon pelo RPC de kernel do msrpc.sys, abre as Desktops Winlogon, Disconnect e Default da WinSta0 dele e chama o SwitchDesktop; o InitVideo da sessão carrega o cdd.dll sobre o adaptador de renderização do BasicRender.sys e o win32k desenha o ponteiro do mouse na tela pelo BasicDisplay.sys (o primeiro pixel). O LSM conecta a sessão 1 ao console pelo csrss dela, e o winlogon carrega o tema e cria o dwm.exe e o LogonUI.exe reais."
teste = "logonui"
proximo = "O dwm.exe e o LogonUI.exe seguirem até a tela de logon: o dwm compõe sobre o adaptador WARP do BasicRender a interface XAML que o LogonUI mostra."

[[roda]]
nome = "O smss.exe cria o csrss.exe"
grupo = "marco"
teste = "smss-csrss"
faz = "O smss.exe real é o primeiro processo: monta a sessão e cria o smss da sessão, que carrega o win32k.sys e cria o csrss.exe real, todos com a ntdll real."

[[roda]]
nome = "O win32k.sys atende o csrss.exe"
grupo = "marco"
teste = "win32k"
faz = "O smss da sessão carrega o win32k.sys, o win32kbase.sys e o win32kfull.sys; a thread do csrss vira thread GUI e o NtGdiInit e o NtUserInitialize são atendidos."

[[roda]]
nome = "Adaptador de vídeo iniciado"
grupo = "marco"
teste = "win32k-display"
faz = "Com o BasicDisplay.sys sobre o dxgkrnl.sys, a sessão do win32k faz o dxgkrnl iniciar o adaptador, que usa o framebuffer VBE 1024x768 e cria o \\Device\\Video0; o InitVideo da sessão 0 termina e o NtUserInitialize do csrss volta com sucesso."
para = "O csrss segue: cria a \\Windows\\SbApiPort, o smss executa o wininit.exe e o winlogon.exe da sessão 1, e o wininit cria a WinSta0 com as Desktops dele (teste winsta0)."

[[roda]]
nome = "A WinSta0 do wininit.exe"
grupo = "marco"
teste = "winsta0"
faz = "O wininit.exe real registra o processo de logon, cria a WinSta0 e as Desktops Winlogon, Disconnect e Default, chama o SwitchDesktop, sobe o servidor RPC \\PIPE\\InitShutdown e cria o services.exe."
para = "O wininit cria também o lsass.exe e segue (teste services)."

[[roda]]
nome = "O LSA do lsass.exe"
grupo = "marco"
teste = "lsa-politica"
faz = "O lsass.exe real instala o banco de política e o banco de contas de um sistema novo, inicializa a auditoria, as políticas de acesso central, as sessões de logon, as credenciais e os pacotes de segurança (negoexts, kerberos, msv1_0), publica as interfaces RPC do LSA e registra a extensão de consulta."
para = "O services.exe consulta o lsass e segue (teste services-scm)."

[[roda]]
nome = "O gerenciador de serviços do services.exe"
grupo = "marco"
teste = "services-scm"
faz = "O services.exe real consulta o domínio da conta no lsass, publica a interface RPC do gerenciador de serviços, sobe o servidor do SCE e o gerenciador de drivers de modo usuário e roda o início automático, com o logon de serviço dos serviços da cadeia do LSM no lsass."
para = "O início automático cria o svchost do DcomLaunch (teste svchost-dcomlaunch)."

[[roda]]
nome = "O svchost do DcomLaunch"
grupo = "marco"
teste = "svchost-dcomlaunch"
faz = "O services.exe cria o svchost do grupo DcomLaunch com o token do logon de serviço; o serviço Power (umpo.dll) conecta ao \\PowerPort do kernel, sobe o endpoint umpo e lê o NtPowerInformation de modo usuário. O umpo manda pelo \\PowerPort os valores do esquema de energia ativo (esquema de energia ativo), que o kernel grava nas configurações de power setting."
para = "O RpcSs e o RpcEptMapper sobem no svchost do rpcss e o Local Session Manager sobe no svchost do DcomLaunch (teste lsm)."

[[roda]]
nome = "O Local Session Manager"
grupo = "marco"
teste = "lsm"
faz = "O svchost do DcomLaunch carrega o lsm.dll; o LSM conecta ao smss pelo \\SmApiPort, cria a \\SmSsWinStationApiPort, sobe o \\RPC Control\\LSMApi e sinaliza o TermSrvReadyEvent."
para = "O csrss e o winlogon da sessão 1 conectam ao LSM e o LSM conecta a sessão 1 ao console (teste conexao-console)."

[[roda]]
nome = "A sessão 1 conectada ao console"
grupo = "marco"
teste = "conexao-console"
faz = "O LSM manda ao csrss da sessão 1 o DoConnect do console: o winsrvext.dll passa pelo NtUserRemoteConnect do win32k, conecta a thread dele ao user32, carrega os cursores e os ícones do sistema e cria a \\RPC Control\\AutoRotationApiPort."
para = "O winlogon da sessão 1 carrega o tema e cria o dwm.exe e o LogonUI.exe (testes dwm e logonui)."

[[roda]]
nome = "O winlogon.exe cria o dwm.exe"
grupo = "marco"
teste = "dwm"
faz = "Depois da conexão ao console, o winlogon.exe da sessão 1 carrega o uxinit.dll e o tema Aero e o dwminit.dll cria o dwm.exe real da sessão."
para = "O dwm.exe ainda termina antes de compor o primeiro quadro (teste tela-de-logon)."

[[roda]]
nome = "O winlogon.exe cria o LogonUI.exe"
grupo = "marco"
teste = "logonui"
faz = "Depois da conexão ao console, o winlogon.exe da sessão 1 reabre as Desktops da WinSta0 e cria o LogonUI.exe real da sessão."
para = "O LogonUI.exe ainda termina antes de mostrar a interface XAML da tela de logon (teste tela-de-logon)."

[[roda]]
nome = "As Desktops do winlogon.exe"
grupo = "marco"
teste = "winlogon"
faz = "O winlogon.exe real da sessão 1 registra o processo de logon pelo RPC de kernel do msrpc.sys, abre as Desktops Winlogon, Disconnect e Default da WinSta0 da sessão dele e chama o SwitchDesktop."
para = "Depois do SwitchDesktop o winlogon carrega o winsta.dll e espera no WinStationWaitForConnect o TermSrvReadyEvent, que o Local Session Manager sinaliza quando sobe no svchost do DcomLaunch (teste lsm); depois o LSM conecta a sessão 1 ao console (teste conexao-console)."

[[roda]]
nome = "Primeiro pixel do win32k.sys"
grupo = "marco"
teste = "primeiro-pixel"
faz = "O InitVideo da sessão 1 carrega o cdd.dll sobre o adaptador de renderização do BasicRender.sys, e o win32k desenha o ponteiro do mouse pelo BasicDisplay.sys: o primeiro pixel na tela."
para = "A Desktop do Winlogon fica preta até a tela de logon (o LogonUI sobre o dwm, teste tela-de-logon)."

[[roda]]
nome = "Tela de logon"
grupo = "marco"
teste = "tela-de-logon"
faz = "O xtask lê a tela do QEMU e espera a tela de logon depois do primeiro pixel: uma imagem cobrindo a tela, com 8 cores ou mais, igual em duas leituras seguidas."
para = "O winlogon cria o dwm.exe e o LogonUI.exe (testes dwm e logonui), mas os dois terminam antes de desenhar a tela de logon."

[[roda]]
nome = "Tela de bugcheck do Windows 10"
grupo = "marco"
teste = "bugcheck"
faz = "O Ctrl direito com o Scroll Lock duas vezes faz o i8042prt.sys real chamar KeBugCheckEx(0xE2); o kernel congela os processadores, desenha a tela azul do Windows 10 no framebuffer de boot (\":(\", os textos da instalação, o progresso e o código de parada), roda os callbacks dos drivers e para."

[[roda]]
nome = "O ntfs.sys monta e grava"
grupo = "marco"
teste = "ntfs"
faz = "O ntfs.sys monta o volume NTFS 3.1 do segundo disco, lê um arquivo pelo Cache Manager e cria, grava e relê outro."

[[roda]]
nome = "Teclado pela pilha PS/2 do Windows"
grupo = "marco"
teste = ["teclado", "shell"]
faz = "O i8042prt.sys e o kbdclass.sys sobem pelo PnP e as teclas chegam ao shell pela IRQ 1, pela ISR e pelo DPC do driver."

[[roda]]
nome = "Teclado e mouse USB pela pilha do Windows"
grupo = "marco"
teste = "usb"
faz = "Na controladora xHCI do QEMU, com interrupções MSI-X, o usbxhci.sys, o usbhub3.sys, o hidusb.sys e o kbdhid.sys e o mouhid.sys sobem pelo PnP, e a tecla mandada pelo monitor do QEMU chega pelo teclado USB ao kbdclass."

[[roda]]
nome = "Pipes e mailslots entre processos"
grupo = "marco"
teste = "pipes"
faz = "Dois processos de usuário conversam pelos npfs.sys e msfs.sys: pipes de mensagens e de bytes, E/S assíncrona e mailslot."

[[roda]]
nome = "Disco lido pela pilha IDE do Windows"
grupo = "marco"
teste = "storage"
faz = "O PnP sobe intelide, atapi, disk e partmgr na controladora do QEMU, e os setores lidos pela pilha conferem com os do disco."

[[roda]]
nome = "Desligamento e reinício limpos"
grupo = "marco"
teste = ["shutdown", "reboot"]
faz = "O NtShutdownSystem avisa os drivers, o ntfs.sys descarrega o volume, o Registro vai para o disco e a máquina desliga pela ACPI (ou reinicia); o boot seguinte encontra o que foi gravado."

[[roda]]
nome = "Disco NVMe pela pilha storport do Windows"
grupo = "marco"
teste = "nvme"
faz = "O PnP sobe o storport.sys e o stornvme.sys no controlador NVMe do QEMU; o disk.sys lê o MBR pela LUN do storport, o volume.sys inicia o volume da partição, o mountmgr.sys lhe dá a letra E: e o ntfs.sys o monta, lê e grava arquivos."
para = "Sem smss, o WorkerThread do mountmgr.sys fica à espera do \\Device\\VolumesSafeForWriteAccess, como no NT."

[[roda]]
nome = "TPM 2.0 pelo tpm.sys e pelo tbs.sys"
grupo = "marco"
teste = "tpm"
faz = "Com --tpm o QEMU expõe um TPM 2.0 CRB sobre um simulador de TPM; o acpi.sys relata o MSFT0101, o PnP sobe o tpm.sys pelo tpm.inf e o kernel manda TPM2_Startup, TPM2_GetRandom e TPM2_GetCapability pelo tbs.sys."

[[roda]]
nome = "acpi.sys como raiz dos dispositivos"
grupo = "marco"
teste = "acpi"
faz = "O acpi.sys carrega a DSDT do QEMU e relata o barramento PCI; o pci.sys enumera as funções, e os árbitros e tradutores dos dois dão as portas, a memória e as IRQs de cada dispositivo."

[[roda]]
nome = "Área de trabalho na tela"
grupo = "marco"
faz = "Ainda não há sessão gráfica: nenhuma janela é desenhada."
para = "A sessão 0 é a de serviços e usa o dispositivo de exibição desconectado; a tela é da sessão do console (winlogon), que ainda não existe."

[[roda]]
nome = "Programas Win32 (.exe)"
grupo = "marco"
faz = "O smss.exe, o csrss.exe, o wininit.exe, o winlogon.exe, o services.exe e o lsass.exe reais rodam no boot com o smss."
para = "O shell ainda não executa .exe e não há sessão de usuário."

[[roda]]
nome = "Rede pela placa e1000"
grupo = "marco"
teste = "rede"
faz = "Com --net, o E1G6032E.sys sobe na placa e1000 pelo PnP e o NDIS relata o enlace conectado."
para = "O tcpip.sys ainda não se liga ao adaptador: a chegada da interface de rede ao NDIS precisa vir depois do START."

[[roda]]
nome = "hal.dll"
grupo = "driver"
teste = "drivers"
faz = "Carrega na fase 1 do boot; os 91 encaminhamentos da imagem ligam aos exports do kernel, que faz o papel da HAL."

[[roda]]
nome = "ci.dll e msrpc.sys"
grupo = "driver"
teste = "watchdog"
faz = "A integridade de código do Windows valida cada imagem de kernel pela assinatura embutida ou pelo catálogo da Microsoft."

[[roda]]
nome = "cng.sys"
grupo = "driver"
teste = "drivers"
faz = "Carrega no boot, registra a fonte de entropia e publica \\Device\\CNG."

[[roda]]
nome = "i8042prt.sys"
grupo = "driver"
teste = ["teclado", "drivers"]
faz = "Liga-se aos dispositivos PS/2 da placa-mãe pelo PnP, com as ISRs nas IRQs 1 e 12; é por ele que o shell recebe as teclas."

[[roda]]
nome = "kbdclass.sys"
grupo = "driver"
teste = ["teclado", "drivers"]
faz = "Filtro de classe sobre o i8042prt.sys: entrega as teclas em \\Device\\KeyboardClass0."

[[roda]]
nome = "mouclass.sys"
grupo = "driver"
teste = "drivers"
faz = "Anexa-se sobre o i8042prt.sys e a pilha do mouse inicia."
para = "Nenhum programa lê o mouse ainda."

[[roda]]
nome = "wmilib.sys e WppRecorder.sys"
grupo = "driver"
teste = ["teclado", "drivers"]
faz = "Bibliotecas de export carregadas pelo primeiro driver que as importa (ataport, kbdclass, i8042prt, mouclass)."

[[roda]]
nome = "watchdog.sys"
grupo = "driver"
teste = "watchdog"
faz = "Validado pelo catálogo, o DriverEntry retorna sucesso; o dxgkrnl.sys e o win32k.sys importam dele."

[[roda]]
nome = "ksecdd.sys"
grupo = "driver"
teste = "ksecdd"
faz = "Liga-se ao host de autorização do kernel, conversa com o cng.sys por IOCTLs e publica \\Device\\KsecDD."

[[roda]]
nome = "ksecpkg.sys"
grupo = "driver"
teste = "ksecpkg"
faz = "O pacote de segurança do kernel (NTLM e SSL) sobe sobre o ksecdd.sys e o cng.sys."

[[roda]]
nome = "null.sys"
grupo = "driver"
teste = "null"
faz = "Publica \\Device\\Null; um processo lê (fim de arquivo) e escreve pelo despacho do próprio driver."

[[roda]]
nome = "beep.sys"
grupo = "driver"
teste = "beep"
faz = "Publica \\Device\\Beep; o IOCTL_BEEP_SET passa pela fila do dispositivo e pelo StartIo do driver."

[[roda]]
nome = "ahcache.sys, ws2ifsl.sys, bowser.sys e afunix.sys"
grupo = "driver"
teste = "drivers-software"
faz = "Quatro drivers de software sobem um depois do outro pela chave da instalação e o DriverEntry de cada um retorna sucesso; o afunix.sys traz o NETIO.SYS como dependência de import."

[[roda]]
nome = "mup.sys, dfsc.sys, udfs.sys e cldflt.sys"
grupo = "driver"
teste = "drivers-arquivos-rede"
faz = "O redirecionador UNC, o cliente DFS (que importa o mup.sys já carregado), o file system UDF e o minifiltro de arquivos na nuvem sobem um depois do outro pela chave da instalação e o DriverEntry de cada um retorna sucesso."

[[roda]]
nome = "fs_rec.sys"
grupo = "driver"
teste = "fs_rec"
faz = "Registra os reconhecedores de file system; cada um examina o volume NTFS e responde como no Windows."

[[roda]]
nome = "condrv.sys"
grupo = "driver"
teste = "condrv"
faz = "O driver do console: servidor, referência e conexão abertos como o conhost abre, e a conexão chega ao servidor."

[[roda]]
nome = "npfs.sys"
grupo = "driver"
teste = "pipes"
faz = "Sobe em todo boot; processos criam, conectam e trocam dados por pipes nomeados."

[[roda]]
nome = "msfs.sys"
grupo = "driver"
teste = "pipes"
faz = "Sobe em todo boot; processos trocam mensagens por mailslots."

[[roda]]
nome = "ntfs.sys"
grupo = "driver"
teste = "ntfs"
faz = "Monta o volume NTFS 3.1 do segundo disco, lê pelo Cache Manager e cria, grava e relê um arquivo."
para = "Só quando o teste o inicia; no boot comum, o volume é servido pelo NTFS do próprio kernel."

[[roda]]
nome = "clfs.sys e clipsp.sys"
grupo = "driver"
teste = "ntfs"
faz = "Carregam como imports do ntfs.sys, validados pelo catálogo."

[[roda]]
nome = "fltmgr.sys"
grupo = "driver"
teste = "minifilters"
faz = "O Filter Manager sobe pela chave dele, se anexa ao file system e ao volume montado pelo ntfs.sys e hospeda os minifiltros, com instâncias, contextos e o FltCreateFileEx."

[[roda]]
nome = "FileInfo.sys e Wof.sys"
grupo = "driver"
teste = "minifilters"
faz = "Minifiltros de boot: registram-se no FltMgr e se anexam sozinhos ao volume NTFS na montagem; o FileInfo registra a sua interface no prefetcher."

[[roda]]
nome = "storqosflt.sys e bindflt.sys"
grupo = "driver"
teste = "minifilters"
faz = "Registram-se no FltMgr e se anexam ao volume NTFS pela anexação manual, como os serviços deles pedem."
para = "Sem os serviços de modo usuário que os comandam (QoS de armazenamento, contêineres), as instâncias não têm trabalho."

[[roda]]
nome = "fastfat.sys"
grupo = "driver"
faz = "Vai para o volume com o catálogo dele."
para = "O início sobre um volume FAT ainda não foi exercitado."

[[roda]]
nome = "intelide.sys e pciidex.sys"
grupo = "driver"
teste = "storage"
estado = "parcial"
faz = "Instalados pelo PnP na controladora IDE PIIX3 do QEMU; relatam os dois canais."
para = "Só com --storage=real; no boot comum, o disco é servido pelo driver ATA do kernel."

[[roda]]
nome = "atapi.sys e ataport.sys"
grupo = "driver"
teste = "storage"
faz = "Ligam-se aos dois canais IDE: IDENTIFY dos discos e do CD-ROM, IRQ 14 e 15 e leituras por DMA."
para = "Só com --storage=real; no boot comum, o disco é servido pelo driver ATA do kernel."

[[roda]]
nome = "disk.sys, classpnp.sys e partmgr.sys"
grupo = "driver"
teste = "storage"
faz = "Criam \\Device\\Harddisk0\\DR0 e \\Device\\Harddisk1\\DR1; as leituras do teste atravessam a pilha até o disco."
para = "Só com --storage=real; no boot comum, o disco é servido pelo driver ATA do kernel."

[[roda]]
nome = "volmgr.sys"
grupo = "driver"
teste = ["storage", "nvme"]
estado = "parcial"
faz = "Carrega e relata o próprio dispositivo raiz; com --storage=nvme recebe do partmgr.sys a partição do disco, cria o \\Device\\HarddiskVolume1 e relata o devnode STORAGE\\Volume, que o volume.sys inicia."
para = "Só volumes básicos de partição MBR foram exercitados, sem os filtros de classe do volume (volsnap, fvevol, rdyboost, iorate)."

[[roda]]
nome = "storport.sys e stornvme.sys"
grupo = "driver"
teste = "nvme"
faz = "O stornvme.inf liga o miniport ao controlador NVMe; o storport.sys inicia o controlador (DMA v3, fila de administração, MSI-X pelo árbitro do acpi.sys) e relata a LUN do namespace ao disk.sys."
para = "Só com --storage=nvme."

[[roda]]
nome = "tpm.sys e tbs.sys"
grupo = "driver"
teste = "tpm"
faz = "O tpm.inf liga o tpm.sys (KMDF) ao ACPI\\MSFT0101; ele lê a tabela TPM2 pelo HalGetCachedAcpiTable, mapeia a área do CRB e publica o \\??\\TPM, que o tbs.sys abre para mandar comandos ao TPM."
para = "Só com --tpm."

[[roda]]
nome = "mountmgr.sys"
grupo = "driver"
teste = ["drivers", "nvme"]
faz = "Carrega no boot; com --storage=nvme recebe o volume da partição e lhe dá a letra E: (MountedDevices e \\GLOBAL??\\E:)."
para = "No boot comum as letras C: e D: são links do próprio kernel; sem smss o WorkerThread espera o \\Device\\VolumesSafeForWriteAccess numa worker thread."

[[roda]]
nome = "WdfLdr.sys e Wdf01000.sys"
grupo = "driver"
teste = ["kmdf", "basicdisplay"]
faz = "O runtime KMDF: a WdfLdr.sys liga o driver ao Wdf01000.sys, que carrega pela chave do serviço e devolve a tabela de funções."

[[roda]]
nome = "msisadrv.sys"
grupo = "driver"
teste = ["kmdf", "basicdisplay"]
faz = "Driver KMDF da ponte PCI-ISA: sobe pelo serviço e, com --display=basic, pelo PnP (AddDevice e START do KMDF)."

[[roda]]
nome = "dxgkrnl.sys"
grupo = "driver"
teste = ["win32k-display", "dxgkrnl"]
faz = "Cria o \\Device\\DxgKrnl; com o BasicDisplay, inicia o adaptador quando o win32k anuncia a sessão e cria o \\Device\\Video0."
para = "Nada aparece na tela ainda: a sessão 0 usa o dispositivo de exibição desconectado do win32k."

[[roda]]
nome = "usbxhci.sys e ucx01000.sys"
grupo = "driver"
teste = "usb"
faz = "Instalados pelo PnP na controladora xHCI do QEMU (--usb), com 16 mensagens MSI-X e o DMA da versão 3; a UCX relata o hub raiz."

[[roda]]
nome = "usbhub3.sys"
grupo = "driver"
teste = "usb"
faz = "Inicia no hub raiz, liga as portas e enumera o teclado e o tablet USB do QEMU."

[[roda]]
nome = "hidusb.sys, hidclass.sys e hidparse.sys"
grupo = "driver"
teste = "usb"
faz = "Instalados pelo input.inf nos dispositivos USB HID; o hidclass relata as coleções de teclado e de mouse."

[[roda]]
nome = "kbdhid.sys e mouhid.sys"
grupo = "driver"
teste = "usb"
faz = "Sobem nas coleções HID com o kbdclass e o mouclass; as teclas do teclado USB chegam ao serviço de teclado."

[[roda]]
nome = "BasicDisplay.sys"
grupo = "driver"
teste = ["win32k-display", "basicdisplay"]
faz = "Instalado pelo PnP no adaptador VGA do QEMU; registra-se no dxgkrnl e o DxgkDdiStartDevice usa o framebuffer VBE 1024x768."
para = "Nada aparece na tela ainda: a sessão 0 usa o dispositivo de exibição desconectado do win32k."

[[roda]]
nome = "win32k.sys, win32kbase.sys e win32kfull.sys"
grupo = "driver"
teste = ["win32k-display", "win32k"]
faz = "Carregados pelo smss no espaço de sessão; atendem o csrss (thread GUI, NtGdiInit, NtUserInitialize) e anunciam a sessão ao dxgkrnl."
para = "O NtUserInitialize da sessão 0 termina sobre o dispositivo desconectado; as Desktops (pela ParseProcedure da WindowStation) esperam o wininit.exe."

[[roda]]
nome = "acpi.sys"
grupo = "driver"
teste = "acpi"
faz = "Raiz da árvore de dispositivos em todo boot: interpretador AML com a DSDT do QEMU, modo ACPI, SCI conectada, os dispositivos relatados (o teclado e o mouse PS/2 entre eles) e o árbitro e o tradutor das IRQs."

[[roda]]
nome = "pci.sys e pshed.dll"
grupo = "driver"
teste = "acpi"
faz = "Instalado pelo pci.inf no barramento que o acpi.sys relata, com a pshed.dll: enumera as funções PCI e arbitra as portas, a memória e os números de barramento dos filhos nas janelas do _CRS."

[[roda]]
nome = "ndis.sys e netio.sys"
grupo = "driver"
teste = "ndis"
estado = "roda"
faz = "Importam um do outro e carregam juntos; o NetIO sobe o NMR, o NSI e a WFP, e o DriverEntry do NDIS tem sucesso."
para = "Com --net a placa e1000 sobe, mas o TCP/IP ainda não se liga a ela."

[[roda]]
nome = "afd.sys e tdi.sys"
grupo = "driver"
teste = "afd"
faz = "O driver de sockets sobe depois do NDIS, com a tdi.sys carregada pelo import."
para = "Sem placa de rede ligada, nenhum socket chega a ele."

[[roda]]
nome = "tcpip.sys e fwpkclnt.sys"
grupo = "driver"
teste = "tcpip"
estado = "roda"
faz = "Sobe depois do NDIS, com o fltmgr.sys e a fwpkclnt.sys; o DriverEntry registra o NSI e a WFP e termina com sucesso (state=4)."
para = "Com --net a placa e1000 sobe, mas o TCP/IP ainda não se liga a ela."

[[roda]]
nome = "E1G6032E.sys"
grupo = "driver"
teste = "rede"
estado = "roda"
faz = "O miniport Intel PRO/1000 da placa e1000 do QEMU: instalado pelo nete1g3e.inf, iniciado pelo NDIS, com o enlace conectado."
para = "Nenhum pacote ainda: o TCP/IP não está ligado à placa."

[[roda]]
nome = "smss.exe"
grupo = "programa"
teste = "smss-csrss"
faz = "Primeiro processo, protegido e crítico: lê o Session Manager, monta \\KnownDlls, DosDevices e \\Sessions e cria o smss da sessão."

[[roda]]
nome = "ntdll.dll"
grupo = "programa"
teste = "smss-csrss"
estado = "roda"
faz = "Roda o smss e o csrss: LdrInitializeThunk, carregador, thread pool e ALPC."
para = "No boot comum, os testes de modo usuário usam uma ntdll mínima gerada pelo build."

[[roda]]
nome = "csrss.exe"
grupo = "programa"
teste = ["win32k-display", "smss-csrss"]
faz = "Cria o \\Windows\\ApiPort e a seção compartilhada, carrega os servidores (basesrv, winsrv, sxssrv) e o NtUserInitialize do win32k volta com sucesso."
para = "Com vídeo, atende o SbCreateSession do wininit.exe e a conexão dele à \\Windows\\ApiPort; o wininit para na criação da WinSta0. Sem vídeo, a sessão espera o primeiro adaptador."

[[roda]]
nome = "basesrv.dll"
grupo = "programa"
teste = "smss-csrss"
faz = "Servidor base do csrss: hora do sistema, \\BaseNamedObjects, links da sessão e o mapeamento de arquivos .ini."

[[roda]]
nome = "winsrv.dll e winsrvext.dll"
grupo = "programa"
teste = "win32k-display"
faz = "Servidores de janelas do csrss: com o cfgmgr32.dll aberto pelo \\Device\\DeviceApi\\CMApi, chamam o NtUserInitialize."

[[roda]]
nome = "user32.dll, gdi32.dll e gdi32full.dll"
grupo = "programa"
teste = "smss-csrss"
faz = "Inicializam dentro do csrss, com as chamadas ao win32k atendidas."
para = "Nenhum programa cria janela ainda."

[[roda]]
nome = "kernel32.dll e kernelbase.dll"
grupo = "programa"
teste = "smss-csrss"
estado = "roda"
faz = "Carregam e inicializam no csrss, puxadas pelo user32.dll."
para = "Nenhum programa Win32 as usa ainda."

# ---- ferramentas (página Início) ----------------------------------------------
#
# As ferramentas de desenvolvimento próprias do OpenNT. Campos: nome,
# descricao, comando (um ou uma lista), imagem (caminho no repositório,
# opcional), legenda (o texto alternativo da imagem) e teste (opcional).

[[ferramenta]]
nome = "opennt-dbg"
descricao = "O depurador gráfico do kernel, no estilo do WinDbg: pilha correta através dos drivers da Microsoft (.pdata e PDBs públicos), objetos do NT (processo, thread, IRP, dispositivo, driver, handle, structs do PDB), análise automática do bugcheck, breakpoints condicionais, de dados e por carga de módulo, observação com structs tipadas, variáveis locais pelo DWARF, memória com busca, rastro de instruções com árvore de chamadas e comparação, em painéis encaixáveis com o arranjo salvo e tema claro e escuro. Fala com o depurador do próprio OpenNT pela COM2 (--kd=com2)."
comando = ["cargo run -p opennt-dbg --release -- --launch", "cargo run -p opennt-dbg --release -- --connect=127.0.0.1:1234"]
imagem = "docs/screenshots/kd-gui.png"
legenda = "opennt-dbg parado dentro do mountmgr.sys real (o DriverEntry chamando o IoCreateDevice), com a pilha pela .pdata e os nomes do PDB público"
teste = "kd"

[[ferramenta]]
nome = "opennt-re"
descricao = "O depurador de engenharia reversa, para o kernel e os processos de usuário: aba CPU com desmontagem, colchetes das funções e dos laços, comentários das chamadas com os argumentos decodificados, referências cruzadas (X), destaque (H), registradores com SSE, x87, DR0-DR7 e a caixa dos argumentos x64, Dump em vários formatos e pilha; editor de breakpoints, breakpoints de hardware por processo e de memória por página; grafo, buscas, mapa de memória, threads, patches e roteiros; o servidor MCP na própria janela. Também: monitor de APIs (cada export do ntoskrnl e da HAL chamado pelos drivers, com os argumentos, o NTSTATUS, a thread e o chamador, filtros e CSV), rastreador de IRPs (a vida de cada IRP pelas pilhas de dispositivos), snapshots da máquina e gravação e reprodução do QEMU, ver como tipo (qualquer tipo do PDB em árvore editável, com listas), exploradores do Registro, do namespace e dos arquivos do convidado, preferências com editor de atalhos e o banco por módulo."
comando = ["cargo run -p opennt-re --release -- --launch", "cargo run -p opennt-re --release -- --launch --initial-process=smss --smp=1", "cargo run -p opennt-re --release -- --launch --vm-snapshots"]
imagem = "docs/screenshots/kd-re-cpu.png"
legenda = "opennt-re parado dentro de um driver real: colchetes das funções e dos laços, comentários automáticos e o destaque de um registrador"
teste = "kd"

[[ferramenta]]
nome = "opennt-mcp"
descricao = "O servidor MCP para agentes de IA dirigirem o depurador (JSON-RPC 2.0 por stdio ou HTTP em 127.0.0.1): abrir o OpenNT, parar, continuar, passos, registradores, memória, desmontagem com a análise automática, símbolos, módulos, processos, threads, breakpoints com condição e log, pilha, buscas, referências cruzadas, vistas do NT, rastro, espera de um marcador na COM1, roteiros e a tela do convidado em PNG; e o monitor de APIs, o rastreador de IRPs, os snapshots, os passos para trás da reprodução, a vista como tipo e os exploradores do Registro, do namespace e dos arquivos."
comando = ["cargo build -p opennt-mcp --release", "target/release/opennt-mcp --root=."]
teste = "kd"

[[ferramenta]]
nome = "cargo xtask debug"
descricao = "O mesmo depurador em modo texto, com o mesmo código: os comandos do WinDbg (k, r, db/dq, bp, bu, ba, bl, g, p, t, gu, lm, lmv, dt, sxe, !process, !thread, !irp, !devobj, !drvobj, !object, !handle, !analyze), o rastro de instruções (trace), as consultas do OpenNT, o monitor de APIs (apimon), o rastreador de IRPs (irptrace), o Registro (reg, regv), o namespace (objdir), os arquivos (fsls, fscat), a vista como tipo (dtv), os snapshots (snap) e os passos para trás (rstep, rcont); com --script, um roteiro roda como teste."
comando = ["cargo xtask debug", "cargo xtask debug --connect=127.0.0.1:1234"]
teste = "kd"
