# Dados editados à mão para `cargo xtask status` (páginas em docs/site/ e
# docs/ROADMAP.md).
#
# O gerador confere o que dá para conferir: os caminhos citados precisam
# existir no repositório, e o marcador de cada teste precisa aparecer nas
# fontes Rust. O que não confere sai como aviso na geração e no fim da página
# de componentes.
#
# Estado declarado de cada componente:
#   "implementado"        vira "Funciona" se algum teste listado em `testes`
#                         tiver o marcador presente nas fontes; sem teste,
#                         aparece como "Parcial", com o aviso de que falta teste
#   "em desenvolvimento"  uma parte já existe; aparece como "Parcial"
#   "planejado"           previsto numa fase do roadmap
#   "fora"                fora do escopo atual
# `fase` é o número da fase em [[fase]] (texto livre também vale).
# `icone`: cpu, memory, cube, threads, io, sliders, book, shield, database,
# power, folder, chip, terminal, plug, window, check, message, chart, rocket,
# atom, keyboard, monitor, disk, bus, lock, list, layers, clock, mouse, play,
# user.

[fontes]
# Pastas varridas para achar o arquivo Rust de cada módulo planejado (mesma
# pasta-pai e mesmo nome). Atualize junto com a reorganização de
# docs/ARQUITETURA.md.
rust = ["kernel/src"]
# Pastas das suítes de autoteste do kernel.
testes = ["kernel/src/ntos/test"]

[icones_categoria]
"Núcleo do kernel" = "cpu"
"Drivers internos" = "plug"
"Drivers do Windows" = "window"
"Sistemas de arquivos" = "folder"
"Aplicações do kernel" = "terminal"
"Programas do Windows" = "layers"

# Frase que abre cada categoria na página de componentes.
[descricoes_categoria]
"Núcleo do kernel" = "As partes centrais do kernel, escritas em Rust: boot, interrupções, memória, processos, sincronização, objetos, segurança, I/O, Registro e o carregador de drivers."
"Drivers internos" = "O suporte de boot do próprio kernel, escrito em Rust: vídeo em modo texto, console, teclado, barramento PCI, dispositivos da placa-mãe e disco, o mínimo para o kernel iniciar, ler o volume de dados e carregar os drivers reais do Windows. Não substituem os drivers do Windows: no teclado, onde o i8042prt.sys já roda, o driver interno fica só de reserva."
"Drivers do Windows" = "Drivers do Windows (.sys e .dll) carregados como estão, sem recompilar nem modificar. Os binários vêm da máquina de build, copiados pelo xtask, e nunca entram no repositório. Aqui, Funciona quer dizer que o binário do próprio Windows carrega e roda durante um teste automático de boot que confere o resultado; Parcial, que ele carrega mas ainda não cumpre o seu papel; Planejado, que é um alvo que ainda não carrega."
"Sistemas de arquivos" = "Os sistemas de arquivos do próprio kernel, montados no boot. Os drivers de sistema de arquivos do Windows (ntfs.sys, fastfat.sys) aparecem em Drivers do Windows, como alvos."
"Aplicações do kernel" = "Programas que rodam dentro do próprio kernel, não em modo usuário: o shell, o sc e os programas de exemplo."
"Programas do Windows" = "Programas do Windows (.exe) em modo usuário, com as bibliotecas de sistema do próprio Windows. Do lado do kernel já existem o anel 3, as chamadas de sistema, as seções e o ALPC; nenhum programa real do Windows roda ainda."

# ---- fases do roadmap -------------------------------------------------------------

[[fase]]
numero = "1"
nome = "base"
estado = "concluída"
escopo = "Boot pela BIOS até o modo de 64 bits, HAL, nanokernel (interrupções, canais de mensagens, serviços), relógio, escalonador cooperativo, sistema de arquivos em memória, vídeo, console, teclado, shell e a ferramenta de build e testes (cargo xtask)."

[[fase]]
numero = "2"
nome = "memória e CPU"
estado = "concluída"
escopo = "Banco de páginas físicas, mapeamento recursivo, pool do kernel, variáveis exportadas, imagens carregadas, KUSER_SHARED_DATA, KPCR, IRQL, DPCs, multiprocessador, ACPI, estruturas do NT e acesso à memória de convidado."

[[fase]]
numero = "3"
nome = "objetos e executive"
estado = "concluída"
escopo = "Object Manager (tipos, handles, namespace, callbacks), biblioteca de runtime, Executive (locks, rundown, listas lookaside, callbacks), segurança (SIDs, ACLs, descritores, tokens) e processos e threads com as estruturas reais do NT."

[[fase]]
numero = "4"
nome = "I/O e armazenamento"
estado = "concluída"
escopo = "I/O Manager, ACPI e PCI, gerência de energia, ETW, drivers de barramento, disco ATA e NTFS."

[[fase]]
numero = "5"
nome = "Registro e serviços"
estado = "concluída"
escopo = "Configuration Manager (hives, chaves e valores) e o controle de serviços e drivers (sc)."

[[fase]]
numero = "6"
nome = "loader PE e ntoskrnl"
estado = "em andamento"
escopo = "Carregador de PE, funções exportadas pelo kernel, Code Integrity real (ci.dll), carga dos drivers reais do Windows (i8042prt, kbdclass, mouclass, cng.sys, watchdog.sys) e o ksecdd.sys."

[[fase]]
numero = "7"
nome = "modo usuário"
estado = "em andamento"
escopo = "Processos e threads de usuário, comunicação ALPC, chamadas de sistema, as bibliotecas ntdll e KERNEL32 reais e o csrss.exe real."

[[fase]]
numero = "8"
nome = "vídeo, arquivos e rede"
estado = "planejada"
escopo = "Cache Manager e os drivers reais do Windows para a tela gráfica (win32k.sys, dxgkrnl.sys, BasicDisplay.sys), os sistemas de arquivos (ntfs.sys, fastfat.sys, fltmgr.sys) e a rede (ndis.sys, tcpip.sys, E1G6032E.sys), com o kernel dando só o suporte."

# ---- testes automáticos de boot -------------------------------------------------

[[teste]]
id = "entrada"
titulo = "Entrada no kernel"
marcador = "HELLO_KERNEL_OK"
comando = "cargo xtask test-boot HELLO_KERNEL_OK"
descricao = "O carregador de boot levou a máquina ao modo de 64 bits, entregou o controle ao kernel e a saída serial funciona."

[[teste]]
id = "boot"
titulo = "Boot completo"
marcador = "KERNEL_RS_OK"
comando = "cargo xtask test-boot"
descricao = "As fases 0 e 1 do boot terminaram: relógio, interrupções, memória, processadores, pool, processos e namespace prontos."

[[teste]]
id = "selftest"
titulo = "Autoteste do kernel"
marcador = "SELFTEST_OK"
comando = "cargo xtask test-boot PHASE7_SELFTEST_OK 600000 --kernel-test-scope=all --build-dir=build/tests --expect=SELFTEST_OK"
descricao = "Roda dentro do kernel todas as suítes de autoteste: arquivos em memória, programas de exemplo, memória, escalonador, timer, IPC e serviços; depois as suítes das fases 3 a 7 (objetos e executive, I/O e armazenamento, Registro e serviços, carregador de PE, modo usuário) e o teclado real. O SELFTEST_OK final só aparece se todas passarem. O comando espera antes o PHASE7_SELFTEST_OK porque o texto SELFTEST_OK também está dentro dos marcadores de cada fase e, sozinho, já casaria com o da fase 3."

[[teste]]
id = "fase3"
titulo = "Autoteste de objetos e executive"
marcador = "PHASE3_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE3_SELFTEST_OK 60000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Dispatcher, APCs, timers e alertas; push locks e rundown; tabelas de handles, namespace e callbacks de objetos; processos e segurança."

[[teste]]
id = "fase4"
titulo = "Autoteste de I/O e armazenamento"
marcador = "PHASE4_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE4_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "No hardware emulado do QEMU: configuração e barramento PCI, dispositivos da placa-mãe, disco ATA, leitura e escrita de NTFS, I/O Manager (IRPs, dispositivos e arquivos), energia e ETW."

[[teste]]
id = "fase5"
titulo = "Autoteste de Registro e serviços"
marcador = "PHASE5_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE5_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Hive em memória, chaves e valores, callbacks do Registro, banco de serviços, WNF, licenciamento e capacidades."

[[teste]]
id = "fase6"
titulo = "Autoteste do carregador de PE e do ntoskrnl"
marcador = "PHASE6_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE6_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Formato PE, carga de imagens do kernel, os exports do ntoskrnl grupo por grupo (Ke, Mm, Ex, Io, Ob, Rtl, Zw...), ciclo de vida de drivers e tratamento de exceções."

[[teste]]
id = "fase7"
titulo = "Autoteste do modo usuário"
marcador = "PHASE7_SELFTEST_OK"
comando = "cargo xtask test-boot PHASE7_SELFTEST_OK 240000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Seções e memória virtual de usuário, arquivos, eventos e threads, chamadas de sistema, entrada no anel 3, ALPC, controle de serviços (sc) e um processo em modo usuário: um executável PE mínimo, gerado pelo próprio teste, que passa pelo LdrInitializeThunk da ntdll de bring-up e sai com o código esperado."

[[teste]]
id = "teclado"
titulo = "Teclado real"
marcador = "KBDTEST_OK"
comando = "cargo xtask test-boot KBDTEST_OK 600000 --kernel-test-scope=all --build-dir=build/tests"
descricao = "Monta pelo PnP as pilhas do i8042prt.sys com kbdclass.sys e mouclass.sys, injeta um scancode pelo controlador 8042 e lê a tecla em \\Device\\KeyboardClass0 (IRQ1, ISR do driver, DPC e callback do kbdclass)."

[[teste]]
id = "drivers"
titulo = "Drivers do Windows no boot comum"
marcador = "[boot] hal.dll carregado"
comando = "cargo xtask test-boot \"[boot] hal.dll carregado\" 240000 --smp=1 --build-dir=build/drivers \"--expect=[boot] servicos carregados: 3\" \"--expect=[boot] cng.sys carregado;\" \"--expect=AddDevice do filtro mouclass -> 0x0\" \"--expect=[kbd] lendo teclas do driver real\""
descricao = "No boot sem autotestes, confere pela serial, nesta ordem: a hal.dll carregada; os três serviços de boot (atapi, disk e mountmgr) com a imagem carregada e o DriverEntry bem-sucedido; o cng.sys carregado com \\Device\\CNG publicado; o filtro mouclass anexado; e o serviço de teclado lendo do i8042prt.sys com o kbdclass.sys."

[[teste]]
id = "shell"
titulo = "Teste do shell"
marcador = "[shell] pronto"
comando = "cargo xtask test-boot KERNEL_RS_OK 120000 \"--keys=run hello\\nps\\n\" \"--expect== 42\" \"--expect=PID  STATE\""
descricao = "Espera o shell, digita comandos pelo monitor do QEMU (run hello, ps) e confere a saída: teclado, IPC, shell e console. Com os binários do Windows no build, as teclas chegam pelo i8042prt.sys e pelo kbdclass.sys reais."

[[teste]]
id = "watchdog"
titulo = "Driver watchdog.sys real"
marcador = "DRIVER_START_COMPLETED"
comando = "cargo xtask test-boot DRIVER_START_COMPLETED 300000 --start-driver=watchdog --build-dir=build/watchdog --smp=1 \"--expect=name=watchdog state=4 win32=0\""
descricao = "O gerenciador de serviços inicia o watchdog.sys da Microsoft: o Code Integrity valida a imagem pelo catálogo, o loader resolve os imports no ntoskrnl e o DriverEntry retorna sucesso, com o serviço em execução (state=4)."

# ---- componentes e drivers ------------------------------------------------------

[[componente]]
nome = "Boot em 64 bits"
categoria = "Núcleo do kernel"
icone = "rocket"
descricao = "Leva a máquina do modo real da BIOS ao modo de 64 bits, carrega o kernel em 1 MB e entrega o controle a ele."
estado = "implementado"
caminhos = ["boot/src/boot.s", "boot/src/stage2.s", "kernel/src/main.rs"]
testes = ["entrada", "boot"]
fase = "1"

[[componente]]
nome = "Interrupções e timer"
categoria = "Núcleo do kernel"
icone = "atom"
descricao = "Monta a tabela de interrupções, programa o timer do processador a 100 Hz e despacha as interrupções de hardware."
estado = "implementado"
caminhos = ["kernel/src/nano/interrupts.rs", "kernel/src/hal/amd64/irqstubs.rs", "kernel/src/hal/lapic.rs"]
testes = ["boot", "selftest"]
fase = "1"

[[componente]]
nome = "Gerência de memória"
categoria = "Núcleo do kernel"
icone = "memory"
descricao = "Controla as páginas de memória física, as tabelas de páginas e o pool de memória do kernel."
estado = "implementado"
caminhos = ["kernel/src/ntos/mm/pfn.rs", "kernel/src/ntos/mm/paging.rs", "kernel/src/ntos/mm/kernel_pool.rs", "kernel/src/ntos/mm/guest_memory.rs"]
testes = ["selftest"]
fase = "2"
notas = "A memória que os drivers enxergam é acessada como no NT: uma instrução por acesso, direto pelo endereço virtual, respeitando páginas somente leitura e cópia na escrita; a falta de página do anel 0 passa pelo Mm antes do bugcheck, e as PTEs são gravadas numa única escrita de 64 bits. Ponteiros vindos do modo usuário são sondados antes (o papel do __try/ProbeForRead) e devolvem STATUS_ACCESS_VIOLATION. Endereços físicos nunca são usados como ponteiro: toda a memória física aparece num mapa direto na metade de sistema (0xFFFFB000_00000000 + endereço físico), montado no boot, e é por ele que o kernel lê tabelas de páginas, o banco de PFNs, MMIO, tabelas ACPI e os dados dos processadores secundários; MmMapIoSpace devolve endereços desse mapa, como o NT devolve endereços de sistema. O heap do kernel e a arena de onde saem IRPs, DEVICE_OBJECTs, MDLs e as demais estruturas que os drivers recebem também moram na metade de sistema, numa janela própria (0xFFFFC000_C0000000), o papel do pool não paginado do NT: toda alocação fica acima de MmSystemRangeStart, e os drivers reais distinguem ponteiros de kernel e de usuário como no Windows. O próprio kernel também: ele é ligado e executa em 0xFFFFF80040000000, onde o ntoskrnl do Windows fica, com a pilha de boot logo ao lado, e é essa a base que a lista de módulos carregados publica. A metade de usuário do espaço de endereços não tem nada do kernel: o carregador de boot só mapeia ali a página em que liga a paginação, que o kernel desfaz na entrada, e a página de partida dos processadores secundários fica mapeada só enquanto eles sobem; o boot confere que, no fim da fase 0, só restam páginas de usuário abaixo de MmSystemRangeStart. Essa metade é a do Windows 10 19041 x64: vai de 64 KB (os primeiros 64 KB nunca são mapeáveis, e um pedido com base abaixo deles falha com STATUS_CONFLICTING_ADDRESSES) a MmHighestUserAddress = 0x7FFFFFFEFFFF, com MmUserProbeAddress = 0x7FFFFFFF0000. Uma alocação sem base recebe a primeira faixa livre de 64 KB a partir de baixo (com MEM_TOP_DOWN, a partir do topo), e pilhas, PEB, TEB e imagens também recebem a VA que o alocador escolhe; o único endereço fixo é a cópia somente leitura da KUSER_SHARED_DATA em 0x7FFE0000. A metade de sistema é preparada para vários espaços de endereçamento, como no NT: no boot, todas as 256 entradas de sistema da tabela de páginas de nível mais alto ficam presentes e permanentes (nunca são criadas depois nem liberadas), e toda operação sobre as tabelas de páginas aceita a raiz de outro espaço, de modo que uma tabela nova copia a metade de sistema uma única vez e enxerga o kernel nos mesmos endereços. Por enquanto todos os processos ainda usam a mesma tabela de páginas."

[[componente]]
nome = "Multiprocessador (SMP)"
categoria = "Núcleo do kernel"
icone = "cpu"
descricao = "Acorda os outros núcleos do processador para que o kernel use mais de uma CPU."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/smp.rs", "kernel/src/hal/amd64/aptrampoline.rs", "kernel/src/ntos/ke/pcr.rs"]
testes = ["selftest", "fase7"]
fase = "2"
notas = "Verificado com 4 CPUs no QEMU. Como no Windows, cada processador tem a sua KPCR, publicada no próprio registrador GS (os secundários a recebem antes de partir), e nela o estado das chamadas de sistema e da execução em modo usuário: a pilha do usuário na entrada de uma syscall fica na KPCR da CPU que a executou, e não numa área compartilhada. Programas de usuário ainda rodam só no processador de boot."

[[componente]]
nome = "Processos e threads"
categoria = "Núcleo do kernel"
icone = "threads"
descricao = "Alterna a CPU entre os processos do kernel e mantém as estruturas de processo e thread do NT (EPROCESS e KTHREAD)."
estado = "implementado"
caminhos = ["kernel/src/ntos/ps/scheduler.rs", "kernel/src/ntos/ps/process.rs"]
testes = ["selftest", "fase3"]
fase = "3"
notas = "O escalonador veio na fase 1; as estruturas reais de processo e thread, na fase 3. Os processos do kernel são tarefas cooperativas: cada passo roda até a tarefa ceder a CPU, e o timer de 100 Hz só dispara o passo seguinte."

[[componente]]
nome = "Sincronização e despacho"
categoria = "Núcleo do kernel"
icone = "clock"
descricao = "Os objetos de espera do NT (eventos, timers, APCs e DPCs), que drivers e o kernel usam para esperar e sinalizar."
estado = "implementado"
caminhos = ["kernel/src/ntos/ke/dispatcher.rs", "kernel/src/ntos/ke/apc.rs", "kernel/src/ntos/ke/timer.rs", "kernel/src/ntos/ke/dpc.rs"]
testes = ["fase3", "selftest"]
fase = "3"
notas = "Interlocked*, spin locks, push locks, rundown e contagens de referência usam instruções atômicas de verdade (lock cmpxchg/xadd), como no NT, seguras com várias CPUs."

[[componente]]
nome = "Gerenciador de objetos e namespace"
categoria = "Núcleo do kernel"
icone = "cube"
descricao = "Dá nome e contagem de referências aos objetos do kernel e monta a árvore \\Device, \\Driver, \\GLOBAL?? e os links de unidade como C:."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ob/object_manager.rs", "kernel/src/ntos/ob/handle_table.rs", "kernel/src/ntos/init/phase0.rs"]
testes = ["fase3"]
fase = "3"
notas = "Cada processo tem a própria tabela de handles (EPROCESS.ObjectTable): um handle de usuário só é resolvido no processo que o abriu, ou no processo anexado, e os handles de kernel ficam na tabela do System e valem em qualquer processo. Em \\KernelObjects já existem a MemoryPartition0 e os eventos de memória e de commit (High/LowMemoryCondition, High/Low/MaximumCommitCondition, abertos pelo mountmgr.sys); os demais eventos de \\KernelObjects e parte dos tipos de objeto (Job, Session, WindowStation, Desktop, entre outros) ainda faltam."

[[componente]]
nome = "Segurança e tokens"
categoria = "Núcleo do kernel"
icone = "shield"
descricao = "Tokens de acesso e descritores de segurança, usados para decidir quem pode abrir cada objeto."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/se/token/tokens.rs", "kernel/src/ntos/se/object_security.rs"]
testes = ["fase3"]
fase = "3"

[[componente]]
nome = "I/O Manager"
categoria = "Núcleo do kernel"
icone = "io"
descricao = "O contrato entre o kernel e os drivers: dispositivos, pedidos de I/O (IRPs), pilhas de drivers e Plug and Play."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/io/io_manager.rs", "kernel/src/ntos/io/irp_builder.rs", "kernel/src/ntos/io/pnp.rs", "kernel/src/ntos/io/work_items.rs"]
testes = ["fase4", "teclado"]
fase = "4"
notas = "A pilha de teclado e mouse do Windows (i8042prt.sys, kbdclass.sys e mouclass.sys) já roda sobre ele; a de disco ainda não (veja atapi.sys). A ligação entre dispositivo e driver vem de uma tabela fixa no kernel (o papel dos INFs), que o boot hoje só percorre para os dispositivos PS/2. Inclui filas de IRP canceláveis (IoCsq*), IRPs síncronos e assíncronos de FSD, IoCreateDriver, interfaces de dispositivo, eventos nomeados de I/O e as consultas WMI (sem WMI, com o status do Windows). Para file systems e armazenamento: IRPs associados (com a devolução ao mestre na conclusão), I/O de paginação (IoPageRead/IoSynchronousPageWrite), extensões de FILE_OBJECT e de IRP, registro de file systems e suas notificações, stream file objects, share access, IoReportDetectedDevice, propriedades de dispositivo e IoGetDmaAdapter (que devolve NULL enquanto o PDO PCI não responde QUERY_INTERFACE)."

[[componente]]
nome = "Registro"
categoria = "Núcleo do kernel"
icone = "database"
descricao = "O banco de configuração do sistema (hives, chaves e valores), de onde vêm, entre outras coisas, os serviços e drivers a carregar."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/registry.rs", "kernel/src/ntos/cm/key"]
testes = ["fase5"]
fase = "5"
notas = "Hive em memória com chaves, valores, callbacks e o banco de serviços."

[[componente]]
nome = "Carregador de PE e exports do kernel"
categoria = "Núcleo do kernel"
icone = "list"
descricao = "Carrega drivers .sys e bibliotecas no formato PE do Windows e liga cada import a uma função exportada pelo kernel."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/mm/pe_loader.rs", "kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/init/exports.rs"]
testes = ["fase6", "boot"]
fase = "6"
notas = "Os drivers do Windows que esta página dá como Funciona ou Parcial carregam por ele; um import sem export correspondente recusa a carga. Como no NT, toda imagem de kernel (drivers, hal.dll, ci.dll, bibliotecas de export) é mapeada no espaço de sistema, na janela que começa em 0xFFFFF80100000000, sobre frames do PFN, e relocada para lá; nenhuma fica na metade de usuário nem abaixo de 4 GB. Dos exports do ntoskrnl, parte ainda falta (veja a página Exports do ntoskrnl). MmLoadSystemImage carrega imagens de sistema sob demanda, o caminho previsto para o win32k.sys real, que ainda não carrega. A lógica de cada export mora no arquivo do assunto do componente e o exports.rs só adapta. Todos os imports do ntoskrnl do fltmgr.sys, storport.sys, partmgr.sys, volmgr.sys, volsnap.sys, pciidex.sys, netio.sys e nsiproxy.sys já têm export; nenhum deles é carregado pelos testes ainda."

[[componente]]
nome = "Cache Manager"
categoria = "Núcleo do kernel"
icone = "layers"
descricao = "O cache de arquivos do NT (rotinas Cc*), pelo qual os drivers de sistema de arquivos leem e gravam através da memória."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cc"]
testes = ["fase6"]
fase = "8"
notas = "51 das 69 rotinas Cc* do ntoskrnl: SHARED_CACHE_MAP e PRIVATE_CACHE_MAP nativos pendurados no SECTION_OBJECT_POINTERS, vistas de 256 KB lidas por IRPs de paginação à pilha do próprio arquivo, cópias, map/pin com BCBs, MDLs, flush, purge e as rotinas de LSN e log do NTFS. Modelo síncrono, sem a thread do lazy writer: as páginas sujas vão ao disco no CcFlushCache e no último CcUninitializeCacheMap. Os autotestes usam um dispositivo sintético; nenhum file system real o usa ainda, porque o ntfs.sys e o fastfat.sys ainda não carregam."

[[componente]]
nome = "Vídeo VGA em modo texto"
categoria = "Drivers internos"
icone = "monitor"
