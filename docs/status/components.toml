[[componente]]
nome = "sc (controle de serviços)"
categoria = "Aplicações do kernel"
icone = "sliders"
descricao = "Consulta, inicia e para os serviços e drivers registrados no Registro."
estado = "em desenvolvimento"
caminhos = ["kernel/src/shell/service_control.rs"]
testes = ["fase7"]
fase = "5"
notas = "Com drivers, usa o ciclo de vida real: sc query mostra atapi, disk, mountmgr, i8042prt e mouclass em RUNNING no boot comum, e sc start carrega a imagem e roda o DriverEntry. Serviços de processo (.exe) passam pelo loader do modo usuário, que ainda não roda programas reais do Windows."

[[componente]]
nome = "Modo usuário"
categoria = "Programas do Windows"
icone = "user"
descricao = "Processos e threads de usuário no anel 3, separados do kernel pela proteção de página, que chamam o sistema pela instrução SYSCALL."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ps/user"]
testes = ["fase7"]
fase = "7"
notas = "Roda um processo de usuário por vez, e todos dividem um só espaço de endereços. Cada EPROCESS, o System inclusive, já tem um registro de estado próprio (process_state.rs), criado com o processo e destruído no término. A tabela de handles já é desse registro: um handle só vale no processo que o abriu (ou no processo anexado), o mesmo objeto aberto em dois processos tem um handle e um acesso em cada um, e o término do processo fecha os handles dele. As regiões de memória também: alocações, vistas de seção e imagens ficam no VAD de quem as criou, a consulta, a liberação e a troca de proteção de um processo não enxergam as de outro, e o término devolve só as regiões do processo que saiu (ainda com uma tabela de páginas só, então a escolha de endereço evita o que qualquer processo ocupa). A identidade do processo ainda é global. O espaço de usuário começa em 64 KB, como no Windows: o executável carrega na sua ImageBase quando ela está livre (e é desfeito quando o processo termina), e a pilha, a PEB, a TEB e as demais estruturas recebem a VA que o alocador escolhe, sem janelas fixas; o teste da fase 7 confere memória de usuário abaixo de 4 GB lida e escrita pelo anel 3. O único executável que roda hoje é o PE mínimo gerado pelo teste da fase 7, com a ntdll de bring-up. Inclui csr.rs, uma imitação dentro do kernel do lado servidor do csrss.exe (ApiPort e SharedSection da sessão 0, ativas em todo boot), mantida só até o csrss.exe real rodar. APCs de usuário (NtQueueApcThread/Ex/Ex2 e NtTestAlert) são entregues no retorno ao modo usuário pelo frame do KiUserApcDispatcher, e NtContinueEx, NtGet/SetContextThread, NtOpenProcess e NtGetNextProcess/Thread já têm handler."

[[componente]]
nome = "ntdll.dll, KERNEL32 e KERNELBASE"
categoria = "Programas do Windows"
icone = "layers"
descricao = "As bibliotecas de sistema reais do Windows, pelas quais os programas falam com o kernel."
estado = "planejado"
fase = "7"
notas = "Nenhum processo carrega as DLLs reais ainda. A ntdll.dll real vai para o volume só porque o vgk.sys a abre pelo caminho; o kernel procura a ntdll na raiz do volume (D:\\NTDLL.DLL), onde o build não a põe, e no boot comum registra “ntdll.dll ausente”. Os testes do modo usuário usam uma ntdll de bring-up que o build gera, só com os stubs das chamadas de sistema."

[[componente]]
nome = "Executáveis .exe (comando exec)"
categoria = "Programas do Windows"
icone = "window"
descricao = "Programas do Windows carregados pelo shell e executados em modo usuário."
estado = "planejado"
fase = "7"
notas = "O comando exec do shell ainda responde “ainda nao implementado”. A parte do kernel da criação de processos (PEB, TEB, seções, ntdll mapeada e entrada pelo LdrInitializeThunk) existe em Modo usuário, mas nenhum .exe real do Windows roda ainda: falta a ntdll real e o resto do modo usuário."

[[componente]]
nome = "csrss.exe"
categoria = "Programas do Windows"
icone = "message"
descricao = "O processo do subsistema Windows (Client/Server Runtime), que os programas Win32 contatam ao iniciar."
estado = "planejado"
fase = "7"
notas = "Alvo: rodar o csrss.exe real em modo usuário. Até lá, o kernel mantém uma imitação provisória do lado servidor dele (ps/user/csr.rs), descrita em Modo usuário."

# ---- subsistemas do kernel ----------------------------------------------------
# `pasta` é a pasta dos módulos em modulos-planejados.txt.

[[subsistema]]
pasta = "nano"
nome = "Nanokernel"
icone = "atom"
descricao = "Interrupções, canais de mensagens e registro de serviços."
fase = "1"

[[subsistema]]
pasta = "ntos/init"
nome = "Boot em fases"
icone = "rocket"
descricao = "A sequência de inicialização do kernel e o laço principal."
fase = "1"
notas = "A fase 1 do boot (I/O, drivers, NTFS, serviços) entra nas fases 4 a 6 do roadmap."

[[subsistema]]
pasta = "shell"
nome = "Shell"
icone = "terminal"
descricao = "Linha de comando e controle de serviços."
fase = "1 e 5"

[[subsistema]]
pasta = "drivers/video"
nome = "Driver de vídeo"
icone = "monitor"
descricao = "VGA em modo texto."
fase = "1"

[[subsistema]]
pasta = "drivers/console"
nome = "Driver de console"
icone = "terminal"
descricao = "Tela e espelho serial."
fase = "1 e 4"

[[subsistema]]
pasta = "drivers/input"
nome = "Drivers de entrada"
icone = "keyboard"
descricao = "Teclado PS/2 e a pilha de teclado do Windows."
fase = "1 e 6"

[[subsistema]]
pasta = "drivers/bus"
nome = "Drivers de barramento"
icone = "bus"
descricao = "PCI e dispositivos da placa-mãe."
fase = "4"

[[subsistema]]
pasta = "drivers/storage"
nome = "Drivers de armazenamento"
icone = "disk"
descricao = "Disco ATA do próprio kernel (DMA de bus master, com PIO como alternativa)."
fase = "4"

[[subsistema]]
pasta = "drivers/crypto"
nome = "Drivers de criptografia"
icone = "lock"
descricao = "Nenhum driver interno: a criptografia do kernel é papel do cng.sys real, que já carrega, e do ksecdd.sys real, alvo de carga."
fase = "6"

[[subsistema]]
pasta = "ntos/inc"
nome = "Cabeçalhos do NT (inc)"
icone = "book"
descricao = "As estruturas do NT geradas dos símbolos do próprio ntoskrnl (466 tipos, com tamanho e offsets conferidos na compilação), as do WDK que os símbolos não trazem e os NTSTATUS; acesso tipado por campo, como o C do NT."
fase = "2"

[[subsistema]]
pasta = "win32"
nome = "Diagnósticos de drivers"
icone = "chart"
descricao = "Instrumentação de diagnóstico de drivers, fora da conta: esse papel é do --trace-driver-api e dos traços do QEMU."
fase = "—"

[[subsistema]]
pasta = "ntos/exports"
nome = "Exports do kernel"
icone = "list"
descricao = "A tabela de exports do ntoskrnl; as rotinas moram no componente de cada uma (ntos/<componente>/exports.rs)."
fase = "6"

[[subsistema]]
pasta = "ntos/ke"
nome = "Kernel (Ke)"
icone = "cpu"
descricao = "Relógio, IRQL, DPCs, processadores, despacho de threads, APCs, timers."
fase = "1 a 3"

[[subsistema]]
pasta = "ntos/mm"
nome = "Memória (Mm)"
icone = "memory"
descricao = "Páginas físicas, tabelas de páginas, pool, seções e imagens carregadas."
fase = "2, 3 e 6"

[[subsistema]]
pasta = "ntos/ob"
nome = "Objetos (Ob)"
icone = "cube"
descricao = "Tipos de objeto, handles, namespace e callbacks."
fase = "3"

[[subsistema]]
pasta = "ntos/ps"
nome = "Processos e threads (Ps)"
icone = "threads"
descricao = "Processos, threads, notificações e escalonador."
fase = "1, 3 e 7"

[[subsistema]]
pasta = "ntos/ps/user"
nome = "Modo usuário (Ps)"
icone = "user"
descricao = "PEB/TEB, carregamento da ntdll e chamadas de sistema dos programas."
fase = "7"
notas = "Inclui csr.rs, uma imitação dentro do kernel do lado servidor do csrss.exe, mantida só até o csrss.exe real rodar."

[[subsistema]]
pasta = "ntos/ex"
nome = "Executive (Ex)"
icone = "sliders"
descricao = "Locks, pool, listas lookaside, callbacks e WNF."
fase = "1 e 3"

[[subsistema]]
pasta = "ntos/rtl"
nome = "Runtime library (Rtl)"
icone = "book"
descricao = "Strings, árvores, bitmaps, ordenação, imagens PE e Unicode."
fase = "3 e 6"

[[subsistema]]
pasta = "ntos/se"
nome = "Segurança (Se)"
icone = "shield"
descricao = "SIDs, ACLs, descritores, tokens e privilégios."
fase = "3"

[[subsistema]]
pasta = "ntos/io"
nome = "Entrada e saída (Io)"
icone = "io"
descricao = "Dispositivos, IRPs, drivers, Plug and Play e work items."
fase = "3 e 4"

[[subsistema]]
pasta = "drivers/fs"
nome = "Sistemas de arquivos"
icone = "folder"
descricao = "Arquivos em memória, volumes e NTFS."
fase = "1, 3 e 4"

[[subsistema]]
pasta = "hal"
nome = "HAL executiva"
icone = "chip"
descricao = "Tabelas ACPI, PCI e firmware."
fase = "2 e 4"

[[subsistema]]
pasta = "ntos/cm"
nome = "Registro (Cm)"
icone = "database"
descricao = "Hives, chaves, valores e serviços."
fase = "2 e 5"

[[subsistema]]
pasta = "ntos/po"
nome = "Energia (Po)"
icone = "power"
descricao = "Estados de energia e registro de falhas."
fase = "4"

[[subsistema]]
pasta = "ntos/etw"
nome = "Rastreamento (Etw)"
icone = "chart"
descricao = "Event Tracing for Windows."
fase = "4"

[[subsistema]]
pasta = "ntos/dbgk"
nome = "Depuração (Dbgk)"
icone = "chart"
descricao = "Relatórios ao vivo do Windows Error Reporting."
fase = "6"
notas = "Sem o werkernel.sys, o DbgkWerCaptureLiveKernelDump faz as validações do Windows e falha com STATUS_NOT_SUPPORTED, o status do stub da extensão ausente."

[[subsistema]]
pasta = "ntos/alpc"
nome = "Comunicação entre processos (Alpc)"
icone = "message"
descricao = "Portas ALPC entre processos."
fase = "7"

[[subsistema]]
pasta = "ntos/test"
nome = "Autotestes"
icone = "check"
descricao = "Suítes que rodam dentro do kernel no QEMU."
fase = "contínua"
notas = "Uma suíte planejada conta como pronta quando o arquivo de teste de mesmo nome existe, ou pela tabela [correspondencias]."

