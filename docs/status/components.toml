[[componente]]
nome = "win32k.sys, win32kbase.sys e win32kfull.sys"
categoria = "Drivers do Windows"
icone = "window"
descricao = "O subsistema de janelas e gráficos do Windows no kernel (USER e GDI), carregado como imagem de sistema."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/ex/system_information.rs", "kernel/src/ntos/mm/session_image.rs", "kernel/src/ntos/mm/sysload.rs", "kernel/src/ntos/ps/win32.rs", "kernel/src/ntos/po/power_information.rs", "kernel/src/ntos/test/session_driver_support.rs"]
testes = ["win32k", "win32k-display"]
fase = "8"
notas = "Os binários reais carregam como no Windows, com o kernel dando só o suporte. Com --initial-process=smss, o smss da sessão lê o Kmode (\\SystemRoot\\System32\\win32k.sys) e o carrega pela SystemExtendServiceTableInformation: o NtSetSystemInformation de modo usuário confere o mestre de sessão, o SeLoadDriverPrivilege e o caminho exato, e o kernel carrega a imagem no espaço de sessão, converte a W32pServiceTable gravada com RVAs no disco e chama o DriverEntry, cujo DriverUnload libera os callouts da sessão. O win32k.sys resolve os contratos de API set pelo ApiSetMap da PEB do smss e carrega o win32kbase.sys e o win32kfull.sys como imagens de sessão (o hidparse.sys antes, no espaço de sistema, pelas classes 54 e 27); o import de uma imagem já carregada a acha na lista de imagens carregadas e retém o LoadCount dela, e cada sessão conta as cargas de uma imagem de sessão. O Win32kBaseDriverEntry cria \\Driver\\Win32k, conecta-se ao dxgkrnl.sys (que agora sobe com os drivers de sistema nesse boot, como o Start 1 da instalação), publica a tabela 1 e a filtro do KeServiceDescriptorTableShadow e os callouts Win32, e inicializa o GDI e o USER: para isso o kernel ganhou a seção nomeada com OBJ_KERNEL_EXCLUSIVE, PagedPoolSession com o bit NX e com quota, o MmPageEntireDriver de imagens de sessão, as listas LOOKASIDE_LIST_EX com o AllocateEx e o FreeEx de dois argumentos e o ZwPowerInformation de SessionPowerInit, SessionPowerCleanup e SystemVideoState. O DriverEntry volta com sucesso (marcador WIN32K_LOADED, teste win32k). A conversão em thread GUI (PsConvertToGuiThread) segue a ordem do 19041: o callout de processo sempre, o GuiThread ligado antes do callout de thread e só o STATUS_SUCCESS repete a busca no Shadow. Com ele, a thread do csrss.exe vira thread GUI (os callouts de processo e de thread do win32k, que consultam o token pelas classes escalares do SeQueryInformationToken) e o NtGdiInit volta TRUE; o user32, o gdi32 e o gdi32full inicializam no csrss, mas o cfgmgr32.dll, que o winsrvext.dll importa pelo api-ms-win-devices-swdevice, recusa a carga sem o \\Device\\DeviceApi\\CMApi (a interface de dispositivos do PnP do ntoskrnl, que o OpenNT ainda não cria): a carga do winsrvext falha, o winsrv.dll volta STATUS_NOT_IMPLEMENTED antes do NtUserInitialize e o csrss sai com esse status. Sem eles, no boot comum, a tabela 1 do KeServiceDescriptorTableShadow fica vazia: uma syscall gráfica tenta converter a thread em GUI, que falha sem os callouts, e devolve STATUS_INVALID_SYSTEM_SERVICE. O suporte Rtl, Ob, Ps e ALPC que a família importa já existia (nenhum import do ntoskrnl falta)."

[[componente]]
nome = "acpi.sys e pci.sys"
categoria = "Drivers do Windows"
icone = "chip"
descricao = "O driver ACPI da Microsoft como raiz da árvore de dispositivos e o driver do barramento PCI sobre ele, com os árbitros e tradutores de recursos deles."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/acpi_stack.rs", "kernel/src/hal/pnp.rs", "kernel/src/hal/acpi_pm.rs", "kernel/src/hal/system_information.rs", "kernel/src/hal/interrupt_lines.rs", "kernel/src/hal/interrupt_targets.rs", "kernel/src/ntos/cm/arbiters.rs", "kernel/src/ntos/em", "kernel/src/hal/errata.rs", "kernel/src/ntos/cm/inf_parse.rs", "kernel/src/ntos/cm/pnp_control.rs"]
testes = ["acpi", "usb"]
fase = "8"
notas = "Com --pnp-root=acpi o acpi.sys real é a raiz da árvore: a HAL relata ROOT\\ACPI_HAL\\0000 e o AcpiRootPdo ACPI_HAL\\PNP0C08\\0 como o HalpDispatchPnp (ids, capacidades, os vetores da IDT de dispositivos como requisitos e configuração de boot), o acpi.inf o instala (serviço ACPI com Tag 2 e Group Core), o HalInitPowerManagement entrega a HalAcpiDispatchTable (tabelas do firmware pelo cache da HAL, FACS mapeada, registradores de PM da FADT, configuração PCI, o modelo APIC e as linhas dos IOAPICs da MADT), o HalQuerySystemInformation responde as classes que ele consulta (BadIOAddrList com o tratador de 0xCF8, depurador, controladores secundários, limite de MSI), o carregador deixa o MultifunctionAdapter 'ACPI BIOS' com a RSDT e o mapa E820 e a hive SYSTEM tem o Control\\Arbiters da instalação. O DriverEntry, o AddDevice e o START do acpi.sys têm sucesso: o interpretador AML dele carrega a DSDT do QEMU, entra no modo ACPI, conecta a SCI (GSIV 9, vetor 0x29, pelos dados de conexão que ele grava no PDO e que o IoConnectInterruptEx LINE_BASED usa, como o IopConnectLineBasedInterrupt) e as BusRelations da raiz são ACPI\\PNP0A03\\0, ACPI\\PNP0103, ACPI\\ACPI0010 e ACPI\\FixedButton, com o mesmo prefixo de instância (2&daba3ff&0) da instalação desta máquina. O nó PNP0A03 recebe o pci.sys pelo pci.inf; a pshed.dll carrega como DLL de modo kernel com os imports atendidos (KeGetEffectiveIrql, RtlPcToFileName, WheaLogInternalEvent, as variáveis de ambiente Ex e o HalBugCheckSystem). O Errata Manager carrega o banco do errata.inf (5 tipos de entrada, 26 callbacks, 76 regras, 224 cadeias e 68 regras-alvo), com os callbacks da HAL sobre as tabelas ACPI e os embutidos; o DriverEntry do pci.sys tem sucesso (as regras IgnorePciRootBusNumberRange e afins são FALSE com o OEMID BOCHS), o AddDevice abre o Control\\PnP\\Pci\\CardList e o START no ACPI\\PNP0A03 recebe as janelas do _CRS; o pci.sys lê a configuração pela interface de barramento PCI que o acpi.sys dá ao PDO, avalia as regras de PCIDevice com os próprios callbacks (o PIIX3 IDE recebe o LOCK_RESOURCES) e relata as funções com os ids dele (PCI_ROOT_OK). A ponte PCI-ISA sobe com o msisadrv.sys e o filtro do acpi.sys sobre o PDO dela relata os dispositivos ISA do namespace (PNP0303, PNP0F13, PNP0700, PNP0400, PNP0501, PNP0B00). Os filhos de um barramento com janelas atribuídas são arbitrados dentro delas (as janelas do pai não colidem com eles), e o PnP instala o ACPI\\PNP0303 e o ACPI\\PNP0F13 pelo keyboard.inf e pelo msmouse.inf com o i8042prt.sys, o kbdclass e o mouclass: a pilha do teclado do boot é a desse nó. Os recursos de todos os nós passam pelos árbitros e tradutores dos drivers de barramento (io/pnp/arbiter.rs, como o IopSetupArbiterAndTranslators): os do pci.sys para as portas, a memória e os números de barramento (ARBITER_PARTIAL, pelo QueryArbitrate das janelas da ponte), o de IRQ do acpi.sys na raiz ACPI (o _PRT e os dispositivos de link LNKA-D ficam com ele) e o tradutor de interrupções do acpi.sys, que dá o vetor do IDT e o IRQL atribuídos; a HAL liga cada vetor atribuído à linha do 8259 que o alimenta. O AcpiRootPdo responde a BUS_INTERFACE_STANDARD (o adaptador de DMA da HAL para as funções PCI) e a DMA_CACHE_COHERENCY. A pilha IDE real e o BasicDisplay.sys sobem nos nós do pci.sys, e os dispositivos do machine.inf com driver nulo iniciam crus quando o barramento os declara RawDeviceOK. A raiz ACPI é o padrão de todo boot (--pnp-root=internal volta ao barramento PCI interno). As interrupções de linha das funções PCI vêm do _PRT e dos dispositivos de link (a xHCI do teste usb, sem MSI, recebe a IRQ 5 do link, vetor 0x70). As interrupções por mensagem (MSI e MSI-X) são do árbitro de IRQ do acpi.sys, como no NT: a flag de MSI do HalGetInterruptTargetInformation (o HalpInterruptIsMsiSupported) libera o IrqArbpFindSuitableRangeMsi, o tradutor dele dá os vetores do conjunto da raiz e o HalAddInterruptRemapping compõe o endereço e o dado que o pci.sys programa (teste usb, MSI-X da xHCI). Falta: o IOAPIC (a HAL entrega as linhas pelo 8259)."

[[componente]]
nome = "Pilha USB 3 e HID (usbxhci.sys, ucx01000.sys, usbhub3.sys, hidusb.sys, hidclass.sys, kbdhid.sys e mouhid.sys)"
categoria = "Drivers do Windows"
icone = "keyboard"
descricao = "A pilha USB da Microsoft sobre a controladora xHCI do QEMU (--usb): a controladora, o hub raiz, os dispositivos HID e o teclado e o mouse USB."
estado = "em desenvolvimento"
caminhos = ["kernel/src/drivers/bus/usb_stack.rs", "kernel/src/ntos/io/pnp/install_usb.rs", "kernel/src/drivers/bus/pci_msi.rs", "kernel/src/ntos/io/pnp/message_interrupts.rs", "kernel/src/hal/message_interrupts.rs", "kernel/src/ntos/io/message_interrupt.rs", "kernel/src/hal/dma_v3.rs", "kernel/src/ntos/po/fx.rs"]
testes = ["usb"]
fase = "8"
notas = "Com --usb o PnP instala a controladora qemu-xhci pelo usbxhci.inf com o usbxhci.sys real (KMDF, com a extensão de classe ucx01000.sys pela chave da classe Ucx da WdfLdr) e, como o INF pede MSISupported, com mensagens MSI-X. Na raiz ACPI (o teste usb) o pci.sys real pede as mensagens e o árbitro de IRQ do acpi.sys as arbitra como no NT: o ProcessorAddInstance guarda a INTERRUPT_TARGET_INFORMATION do HalGetInterruptTargetInformation, cuja flag de MSI (+8, bit 0) a HAL liga pelo HalpInterruptIsMsiSupported (APIC local, a regra DisableMSI do Errata Manager e o fabricante do processador; sem ela o IrqArbpFindSuitableRangeMsi recusava a lista do MSI-X e o TestAllocation dava STATUS_UNSUCCESSFUL); o tradutor dele dá os vetores (com uma CPU, duas mensagens: 0x70 no IRQL 7 e 0x60 no IRQL 6), o PnP manager não troca essas mensagens por vetores da HAL, o acpi.sys grava os dados de conexão (InterruptTypeMessageRequest) e o HaliAddInterruptRemapping compõe o endereço e o dado de cada uma (o HalpPopulateMsiMessages com o HalpApicGenerateMessage físico); o pci.sys programa a tabela MSI-X pelo HalGetMessageRoutingInfo e o KMDF conecta os vetores (IoConnectInterruptEx FULLY_SPECIFIED). Com --pnp-root=internal o barramento interno pede 16 mensagens e o PnP manager dá a cada uma um vetor da HAL (0x50-0xCF, IRQL = vetor >> 4, destino físico no processador 0). O IoConnectInterruptEx MESSAGE_BASED monta a IO_INTERRUPT_MESSAGE_INFO como o IopConnectMessageBasedInterrupt. O DMA vem do adaptador da versão 3 da HAL (a DEVICE_DESCRIPTION do KMDF). O hub raiz (USB\\ROOT_HUB30) recebe o usbhub3.sys, com o registro no power framework pelo PO_FX_DEVICE_V2, e os dispositivos das portas (o teclado e o tablet) são enumerados pela thread das ações do PnP e instalados pelo input.inf com o hidusb.sys e o hidclass.sys (que assina pela SleepStudyHelper o nome WNF_PO_SCENARIO_CHANGE da hive); as coleções de teclado e de mouse recebem o kbdhid.sys e o mouhid.sys com o kbdclass e o mouclass. Com o Services\\kbdclass\\Parameters de uma instalação (ConnectMultiplePorts = 0), o teclado USB tem o próprio \\Device\\KeyboardClassN, que o serviço de teclado abre com FILE_READ_DATA (o kbdhid só lê os relatórios da coleção numa abertura de leitura) e lê: a abertura desce pelo kbdhid até a coleção do hidclass, que pede a sessão de quem abre (IoGetRequestorSessionId, com a thread que o IRP_MJ_CREATE leva como no IopParseDevice), e a tecla mandada pelo monitor do QEMU chega pelo relatório HID que o usbxhci recebe por MSI-X (USB_KEY_OK). Faltavam para a pilha: VslCreate/DeleteSecureSection, PoSetSystemWakeDevice, SeQuerySessionIdToken, NtBuildNumber, a classe WdfNotifyRoutinesClass do WmiQueryTraceInformation, o DMA V3, o PO_FX_DEVICE_V2/V3, as ações do PnP numa thread de sistema e a thread no IRP_MJ_CREATE; todos existem e têm autoteste. A linha (INTx) é a lista alternativa do pci.sys: sem MSI, o acpi.sys dá à controladora a IRQ 5 do dispositivo de link do _PRT (vetor 0x70), e a pilha também funciona por ela."

[[componente]]
nome = "dxgkrnl.sys e BasicDisplay.sys"
categoria = "Drivers do Windows"
icone = "monitor"
descricao = "O núcleo gráfico do Windows (DirectX Graphics Kernel) e o driver de vídeo básico da Microsoft, que juntos dão a tela gráfica."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/cm/graphics_defaults.rs", "kernel/src/ntos/inbv/display.rs", "kernel/src/ntos/ttm/device.rs", "kernel/src/drivers/video/display_stack.rs", "kernel/src/ntos/bgk/graphics_information.rs", "kernel/src/hal/x86bios/mod.rs", "kernel/src/hal/system_information.rs"]
testes = ["dxgkrnl", "basicdisplay", "win32k-display", "fase6"]
fase = "8"
notas = "O dxgkrnl.sys real carrega e roda com `--start-driver=DXGKrnl` (a chave do serviço tem os valores do Windows, com Start=3): o Code Integrity o valida pelo catálogo, os imports no ntoskrnl, no watchdog.sys e na WMILIB.SYS resolvem (nenhum import do ntoskrnl falta) e o DriverEntry retorna sucesso (DRIVER_START_COMPLETED state=4), criando \\Device\\DxgKrnl com a segurança SDDL da wdmsec. Para isso o kernel ganhou Control\\GraphicsDrivers, Control\\Video e Control\\Class da instalação, o ZwPowerInformation(PlatformInformation), o ObOpenObjectByPointer de DEVICE_OBJECTs e o ReturnLength local da consulta da CI. As duas inscrições WNF do DriverEntry (nomes do SRUM e do relatório de uso) dão STATUS_OBJECT_NAME_NOT_FOUND, porque o OpenNT não instala esses nomes; o driver segue sem elas, como no Windows. O dxgmms2.sys, carregado quando um adaptador inicia, e o cdd.dll já têm todos os imports do ntoskrnl. Com `--display=basic` (teste basicdisplay) o BasicDisplay.sys real sobe pelo PnP no adaptador VGA do QEMU: o display.inf o instala (PCI\\CC_0300, seção MSBDA, classe Display; a chave do serviço tem os valores da instalação, com o ImagePath no repositório de drivers e Start 3), o DriverEntry dele carrega o dxgkrnl.sys pelo ZwLoadDriver (sem `--start-driver`) e se registra nele pelo DxgkInitialize, o DpiAddDevice cria o FDO de vídeo e chama o DxgkDdiAddDevice do miniport, e o START_DEVICE (DpiFdoHandleStartDevice) passa pelo barramento com as listas bruta e traduzida e conclui com sucesso. O dxgkrnl não inicia o adaptador nesse START: o DpiFdoStartAdapterThread, com o DxgkDdiStartDevice do miniport, espera a criação da primeira sessão, que o win32k.sys anuncia no NtUserInitialize (watchdog!SMgrNotifySessionChange -> DxgkNotifySessionStateChange -> DpiSessionCreateCallback). Esse é o próximo passo, junto com o win32k. A tela de POST que o dxgkrnl procura na classe SystemBootGraphicsInformation (126) não existe no OpenNT (o vídeo de boot é o modo texto VGA): a consulta devolve STATUS_UNSUCCESSFUL, como o BgkQueryBootGraphicsInformation do NT sem biblioteca gráfica de boot. Sem tela de POST, o BasicDisplay usa o BIOS de vídeo (VBE) pelos x86Bios* da HAL, e esse caminho já responde de verdade: a interface x86 BIOS do kernel (`hal/x86bios`) executa o BIOS de vídeo do QEMU (a ROM em C0000h) num emulador de x86 de modo real, com a IVT e a BDA copiadas da máquina, o buffer de transferência em 2000:0000 e as portas no hardware, e o HalQuerySystemInformation(HalDisplayBiosInformation) informa o BIOS emulado, que é o que o BasicDisplay consulta antes de tentar o VBE. O autoteste da fase 6 conversa com o BIOS como o BasicDisplay: 4F00h devolve 'VESA' e os 93 modos do QEMU, 4F01h de um modo 1024x768x32 dá o framebuffer linear no BAR0 do adaptador (linha de 4096 bytes), 4F02h liga o modo (os registradores de modo do adaptador e da VGA confirmam), 4F03h o devolve, e o INT 10h AX=0003h volta ao modo texto. Com --display=basic o boot deixa o vídeo de boot que o carregador do Windows deixa num boot por BIOS (bgk/graphics_information.rs: o modo VBE 1024x768x32 com framebuffer linear, que o SystemBootGraphicsInformation descreve), e com o smss real a sessão do win32k faz o dxgkrnl iniciar o adaptador: o DxgkDdiStartDevice do BasicDisplay usa esse framebuffer e o serviço de BDD do dxgkrnl (que reconhece o driver pelo DriverName \\Driver\\BasicDisplay), e o PoDisableSleepStates devolve NTSTATUS com o handle por ponteiro, como no NT; o DpiFdoStartAdapter cria o \\Device\\Video0 e habilita a interface de chegada de dispositivo de vídeo (ADAPTER_STARTED, teste win32k-display). O InitVideo do win32k enumera o \\Device\\Video0; a sessão 0 monta a configuração de exibição sobre o dispositivo desconectado (teste win32k-display). O watchdog (SMgrGetConsoleSessionId) e o dxgkrnl leem a sessão de console pelo RtlGetActiveConsoleId, que devolve o ActiveConsoleId gravado pelo win32k de cada sessão (antes era sempre 0). O dxgkrnl só entrega o adaptador à sessão 1 depois do DxgkSessionConnected, que o win32k chama no xxxRemoteConnect, a pedido do Local Session Manager; sem ele a sessão 1 também usa o dispositivo desconectado e o cdd.dll não carrega (teste primeiro-pixel)."

[[componente]]
nome = "ntfs.sys, fastfat.sys e fltmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Os drivers de sistema de arquivos do Windows (NTFS e FAT) e o Filter Manager, base dos filtros de sistema de arquivos."
estado = "em desenvolvimento"
caminhos = ["kernel/src/ntos/io/file_system.rs", "kernel/src/ntos/io/parse.rs", "kernel/src/drivers/storage/ata_volume.rs", "kernel/src/ntos/test/file_system_mount.rs", "kernel/src/ntos/test/fs_driver_imports.rs", "xtask/src/ntfs_image.rs", "kernel/src/ntos/cm/service/file_system_filters.rs", "kernel/src/ntos/mm/prefetcher_file_info.rs", "kernel/src/ntos/test/minifilters.rs"]
testes = ["ntfs", "shutdown", "reboot", "minifilters", "nvme"]
fase = "8"
notas = "O ntfs.sys real monta o volume NTFS 3.1 do segundo disco IDE e serve arquivos (teste ntfs): com `--start-driver=ntfs` o carregador resolve o clfs.sys, o clipsp.sys, o ksecdd.sys e o fltmgr.sys (cada um validado pelo Code Integrity pelo catálogo), o DriverEntry cria o CDO \\Ntfs e o FltMgr se anexa a ele pela notificação de registro (state=4). A abertura de \\Device\\AtaVolume1\\HELLO.TXT monta o volume pelo IopMountVolume: o NtfsFsdFileSystemControl posta a montagem à FSP e o FltMgr espera; o NtfsMountVolume vai até o fim (LFS, reinício e checkpoint, $Secure, $Extend, $UpCase) e os streams internos que ele solta ficam para o lazy writer do Cache Manager, de onde vem o IRP_MJ_CLOSE deles depois, como no Windows. O arquivo é aberto e lido pelo Cache Manager; um arquivo novo é criado, gravado, fechado, reaberto e lido de volta pelo ntfs.sys, com o FltMgr na pilha do volume. Para isso: o volume do kernel saiu da raiz do namespace (\\NTFS colidia com o CDO \\Ntfs) para o seu dispositivo \\Device\\KernelVolume1, e os arquivos dos volumes do kernel ganharam DeviceObject e VPB (o IoGetBaseFileSystemDeviceObject do FltMgr); todo IRP_MJ_CREATE leva o IO_SECURITY_CONTEXT (o IoGetDeviceObjectPointer de \\Device\\NamedPipe do FltMgr derrubava o npfs.sys); o ObQueryNameString acha objetos nomeados na raiz; os itens de trabalho não rodam um dentro do outro e cada drenagem só roda os que já estavam na fila (o item de pós-montagem do NTFS esperava o DeviceLock que a montagem retém); o CcUninitializeCacheMap e o lazy writer seguem o NT; o ExAcquireFastMutexUnsafe não exige APCs desligadas, como no ntoskrnl (o LfsFlushToLsn entra com elas ligadas); o ExDeleteResourceLite tira o recurso da lista do sistema mesmo com dono, como no ntoskrnl (o checkpoint do NTFS apaga a tabela de reinício, que mora na pilha dele, ainda adquirida, e o recurso esquecido na lista fazia as inserções seguintes gravarem na pilha de outra chamada: a falha intermitente do teste no despachante nativo); e o volume do xtask grava os nomes 8.3 no espaço Win32+DOS e os demais no POSIX (um nome só Win32 sem o par curto é corrupção para o ntfs.sys). No desligamento (testes shutdown e reboot) o ntfs.sys recebe o IRP_MJ_SHUTDOWN pela fila de file systems, com o FltMgr no topo da pilha do CDO, e descarrega o volume; a sobreposição do volume vai ao disco na fila de última chance e o segundo boot lê pelo ntfs.sys e pelo leitor do kernel o arquivo que ele gravou. O fastfat.sys vai para o volume com o catálogo dele; o início dele pelo `--start-driver` sobre um volume FAT ainda não foi exercitado. O Filter Manager hospeda minifiltros reais da Microsoft sobre o volume do ntfs.sys (teste minifilters): o FltMgr sobe pela chave dele e o FileInfo, o Wof, o storqosflt e o bindflt pelas chaves e `Instances` da instalação; o FileInfo e o Wof se anexam sozinhos na montagem e o storqosflt e o bindflt pela anexação manual (FltAttachVolume), cada um na altitude da chave, e um filtro abre e lê um arquivo abaixo da sua instância pelo FltCreateFileEx. Para isso: o IoCreateFileEx leva o IO_DRIVER_CREATE_CONTEXT (ECPs no IRP_MJ_CREATE e a dica de dispositivo), a abertura sem nome de um volume montado com acesso além do direto vai ao file system (a abertura do volume do IopParseDevice), o WmiQueryTraceInformation dá ao FltMgr a tabela de rotinas de E/S dos minifiltros, o ZwQuerySystemInformation responde a SystemBasicInformation em modo kernel, o PfFileInfoNotify liga o FileInfo ao prefetcher, a extensão do FILE_OBJECT é uma só (I/O Manager e FsRtl), o volume ATA responde o IOCTL_DISK_GET_CLUSTER_INFO e o volume do xtask marca os índices de visão (DUP_VIEW_INDEX_PRESENT). O wcifs.sys carrega e se registra, mas a anexação dele pede o nome GUID do volume ao mount manager, que ainda não conhece o volume ATA. Com --storage=nvme (teste nvme) o ntfs.sys monta também o volume da partição do disco NVMe, sobre o volume.sys, o volmgr.sys e o storport.sys, e grava e relê um arquivo pela letra E: que o mountmgr.sys deu ao volume; o $BadClus do volume do xtask leva a contagem do run com o byte de sinal livre (o ntfs.sys lê a contagem com sinal)."

[[componente]]
nome = "npfs.sys"
categoria = "Drivers do Windows"
