notas = "Alvo de carga dos binários reais. O dxgkrnl.sys importa 53 funções do watchdog.sys, que já carrega e roda; nenhum dos dois carrega ainda."

[[componente]]
nome = "ntfs.sys, fastfat.sys e fltmgr.sys"
categoria = "Drivers do Windows"
icone = "folder"
descricao = "Os drivers de sistema de arquivos do Windows (NTFS e FAT) e o Filter Manager, base dos filtros de sistema de arquivos."
estado = "planejado"
fase = "8"
notas = "Alvo de carga dos binários reais. O Cache Manager e o suporte FsRtl/Io de file system já existem, mas dos imports do ntoskrnl ainda faltam 23 ao ntfs.sys e 19 ao fastfat.sys (entre eles FsRtlCopyRead, FsRtlNotifyVolumeEvent e MmFlushImageSection); o fltmgr.sys já tem todos os seus. Nenhum dos três carrega ainda. Hoje o volume NTFS é lido pelo leitor do próprio kernel; o fltmgr.sys só vai para o volume como arquivo, porque o vgk.sys o abre pelo caminho."

