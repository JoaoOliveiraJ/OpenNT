"ntos/ps/user/win32k" = "papel do win32k.sys real (win32kbase/win32kfull), alvo de carga; o kernel só dá o suporte"
"ntos/ps/user/user_atoms" = "papel do win32k.sys real (átomos USER), alvo de carga; o kernel só dá o suporte"
