[package]
name = "opennt-mcp"
description = "opennt-mcp: servidor do Model Context Protocol sobre o depurador do OpenNT (opennt-kd), com a desmontagem e as anotacoes compartilhadas com o opennt-re"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opennt-mcp"
path = "src/main.rs"

# Dependências só deste crate e de quem o usa (o opennt-re): nada entra no
# build do kernel nem do `xtask`.
[dependencies]
opennt-kd = { path = "../opennt-kd" }
# O JSON-RPC 2.0 do protocolo (o protocolo em si é implementado aqui).
serde_json = "1.0.154"
# Desmontagem x86-64 com a sintaxe MASM (a mesma do opennt-re).
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "masm", "instr_info"] }
