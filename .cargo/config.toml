[alias]
xtask = "run --quiet --package xtask --"

# Os binários freestanding são carregados em endereços fixos pelo stage2:
# sem PIE, sem tabelas de unwind e sem SSE no código do kernel (o estado
# x87/SSE pertence aos programas e drivers nativos).
[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "force-frame-pointers=yes",
]
