# OpenNT: um kernel compatível com o Windows NT, em Rust (x86-64).
#
# Os crates `boot` e `kernel` são freestanding (alvo x86_64-unknown-none) e
# só compilam pelo `cargo xtask`, que escolhe o alvo, empacota o kernel como
# PE32+ e monta a imagem de disco. O `xtask` roda no host. As ferramentas de
# desenvolvimento ficam em `tools/`: `opennt-kd` (o cliente do depurador do
# kernel, só a biblioteca padrão, usado pelo `xtask`), `opennt-dbg` (o
# depurador gráfico `opennt-dbg`), `opennt-re` (o depurador de engenharia
# reversa `opennt-re`), os dois com as dependências de interface, e
# `opennt-mcp` (o servidor MCP `opennt-mcp`); nunca entram no build do kernel
# nem do `xtask`.
[workspace]
resolver = "2"
members = ["boot", "kernel", "xtask", "tools/opennt-kd", "tools/opennt-dbg", "tools/opennt-re", "tools/opennt-mcp"]
default-members = ["xtask"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 1

# O kernel dos builds comuns (build, run, test-boot, test-all) leva só as
# tabelas de linha do DWARF: o depurador acha arquivo:linha e o nome de cada
# função (inclusive as expandidas inline), e o kernel compila e liga mais
# rápido e ocupa menos disco.
[profile.dev.package.kernel]
debug = "line-tables-only"

# `cargo xtask debug` (e os depuradores gráficos, que o chamam): o DWARF
# completo, com os tipos e as variáveis locais que eles mostram.
[profile.depuracao]
inherits = "dev"

[profile.depuracao.package.kernel]
debug = "full"

[profile.release]
panic = "abort"
opt-level = 2
debug = true
