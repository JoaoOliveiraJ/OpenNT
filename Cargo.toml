# OpenNT: um kernel compatível com o Windows NT, em Rust (x86-64).
#
# Os crates `boot` e `kernel` são freestanding (alvo x86_64-unknown-none) e
# só compilam pelo `cargo xtask`, que escolhe o alvo, empacota o kernel como
# PE32+ e monta a imagem de disco. O `xtask` roda no host. As ferramentas de
# desenvolvimento ficam em `tools/`: `kd-client` (o cliente do depurador do
# kernel, só a biblioteca padrão, usado pelo `xtask`) e `kd-gui` (o
# depurador gráfico `opennt-dbg`, com as dependências de interface; nunca
# entra no build do kernel nem do `xtask`).
[workspace]
resolver = "2"
members = ["boot", "kernel", "xtask", "tools/kd-client", "tools/kd-gui"]
default-members = ["xtask"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = true
